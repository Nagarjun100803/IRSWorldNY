bharosa.uio.default.whatsthis.DeviceTextPad.pagetitle=A propos du pav\u00E9 TextPad
bharosa.uio.default.whatsthis.DeviceTextPad.title=Utilisation du pav\u00E9 TextPad : explications

bharosa.uio.default.whatsthis.DeviceTextPad.whatsthis.title=Qu'est-ce que c'est ?
bharosa.uio.default.whatsthis.DeviceTextPad.whatsthis.text1=Le pav\u00E9 TextPad est un dispositif virtuel qui propose une protection avanc\u00E9e contre l'usurpation d'identit\u00E9 en ligne.
bharosa.uio.default.whatsthis.DeviceTextPad.whatsthis.text2=Il vous permet d'entrer votre mot de passe \u00E0 l'aide de votre clavier traditionnel. Ce dispositif vous emp\u00EAche de saisir par erreur des informations confidentielles sur un site Web frauduleux.

bharosa.uio.default.whatsthis.DeviceTextPad.about.title=A propos du pav\u00E9 TextPad : fonctions de s\u00E9curit\u00E9 en ligne
bharosa.uio.default.whatsthis.DeviceTextPad.about.text=Voici quelques fonctions de s\u00E9curit\u00E9 avanc\u00E9es associ\u00E9es au pav\u00E9 TextPad et les r\u00E9ponses aux questions les plus fr\u00E9quentes.

bharosa.uio.default.whatsthis.DeviceTextPad.about.question1=Pourquoi ai-je besoin d'une image et d'une expression personnelles ?
bharosa.uio.default.whatsthis.DeviceTextPad.about.answer1=Le pav\u00E9 TextPad est personnalis\u00E9 avec votre image d'arri\u00E8re-plan et votre expression. Cela garantit la s\u00E9curit\u00E9 de votre mot de passe. D\u00E9sormais, entrez uniquement votre mot de passe lorsque votre pav\u00E9 TextPad personnalis\u00E9 appara\u00EEt. Nous ne modifierons jamais votre personnalisation \u00E0 votre insu.

bharosa.uio.default.whatsthis.DeviceTextPad.about.question2=Pourquoi ce changement ?
bharosa.uio.default.whatsthis.DeviceTextPad.about.answer2=Nous sommes constamment \u00E0 la recherche de solutions pour s\u00E9curiser votre exp\u00E9rience en ligne. Le pav\u00E9 TextPad est l'une des nombreuses mesures prises pour optimiser votre s\u00E9curit\u00E9 sur notre site.

bharosa.uio.default.whatsthis.DeviceTextPad.about.question3=A quoi sert la date d'actualit\u00E9 ?
bharosa.uio.default.whatsthis.DeviceTextPad.about.answer3=A chaque apparition, le pav\u00E9 TextPad comportera une nouvelle heure et une nouvelle date. Il s'agit d'une autre fonction de s\u00E9curit\u00E9. Avant de saisir votre mot de passe, v\u00E9rifiez que la date et l'heure ne remontent pas \u00E0 plus de 24 heures.


