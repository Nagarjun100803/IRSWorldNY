bharosa.uio.default.register.info.section1.message=Vos nouveaux dispositifs de s\u00E9curit\u00E9 personnalis\u00E9s permettront de prot\u00E9ger vos op\u00E9rations bancaires en ligne. Les informations saisies sont prot\u00E9g\u00E9es contre de nombreuses menaces existant \u00E0 ce jour. En m\u00EAme temps, l'image, l'expression et la date prouvent que vous vous trouvez bien sur notre site officiel.

bharosa.uio.default.register.info.section2.title=Etape 2 : questions et r\u00E9ponses de s\u00E9curit\u00E9
bharosa.uio.default.register.info.section2.subtitle=Couche suppl\u00E9mentaire de s\u00E9curit\u00E9
bharosa.uio.default.register.info.section2.message=Vous inscrirez trois questions de s\u00E9curit\u00E9 afin d'accro\u00EEtre votre protection. Celles-ci vous seront pos\u00E9es \u00E0 tour de r\u00F4le via votre dispositif personnalis\u00E9 dans des situations susceptibles de comporter des risques. Vous ne devez pas les divulguer (pas plus que les r\u00E9ponses), tout comme votre mot de passe.

