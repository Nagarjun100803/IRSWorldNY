bharosa.uio.default.whatsthis.DeviceTextPad.pagetitle=Om TextPad
bharosa.uio.default.whatsthis.DeviceTextPad.title=Brug af TextPad: Anvisninger

bharosa.uio.default.whatsthis.DeviceTextPad.whatsthis.title=Hvad er det?
bharosa.uio.default.whatsthis.DeviceTextPad.whatsthis.text1=TextPad er en virtuel enhed, der giver dig avanceret beskyttelse mod tyveri af din onlineidentitet.
bharosa.uio.default.whatsthis.DeviceTextPad.whatsthis.text2=TextPad g\u00F8r det muligt for dig at indtaste din adgangskode ved brug af det almindelige tastatur og bekytter dig mod utilsigtet at indtaste f\u00F8lsomme oplysninger p\u00E5 svindelwebsted.

bharosa.uio.default.whatsthis.DeviceTextPad.about.title=Om TextPad: Onlinesikkerhedsfaciliteter
bharosa.uio.default.whatsthis.DeviceTextPad.about.text=Her er nogle af de avancerede sikkerhedsfaciliteter, der er knyttet til TextPad, og svarene p\u00E5 de mest almindelige sp\u00F8rgsm\u00E5l.

bharosa.uio.default.whatsthis.DeviceTextPad.about.question1=Hvorfor er det n\u00F8dvendigt med et personligt billede og udtryk?
bharosa.uio.default.whatsthis.DeviceTextPad.about.answer1=TextPad tilpasses med dit helt eget baggrundsbillede og dit eget udtryk. Denne tilpasning garanterer, at det er sikkert for dig at indtaste din adgangskode. Fra nu af m\u00E5 du kun indtaste din adgangskode online, hvis du f\u00E5r vist din tilpassede TextPad. Vi \u00E6ndrer aldrig din tilpasning uden at give dig besked.

bharosa.uio.default.whatsthis.DeviceTextPad.about.question2=Hvad skyldes \u00E6ndringen?
bharosa.uio.default.whatsthis.DeviceTextPad.about.answer2=Vi leder altid efter nye m\u00E5der at g\u00F8re din onlineoplevelse mere sikker p\u00E5. TextPad er blot en af de mange forholdsregler, vi tager for at for\u00F8ge din sikkerhed, n\u00E5r du bes\u00F8ger vores websted.

bharosa.uio.default.whatsthis.DeviceTextPad.about.question3=Hvad bruges opdateringsdatoen til?
bharosa.uio.default.whatsthis.DeviceTextPad.about.answer3=Hver gang du f\u00E5r vist TextPad-enheden, har den et nyt klokkesl\u00E6t og en ny dato. Dette er endnu en sikkerhedsfacilitet, der g\u00F8r det sikkert for dig at v\u00E6re online. Kontroll\u00E9r, at klokkesl\u00E6ttet og datoen ikke er \u00E6ldre end 24 timer, f\u00F8r du indtaster din adgangskode.


