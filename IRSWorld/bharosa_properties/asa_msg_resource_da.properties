bharosa.uio.default.whatsthis.DeviceQuestionPad.about.question1=Hvorfor er det n\u00F8dvendigt med et personligt billede og udtryk?
bharosa.uio.default.whatsthis.DeviceQuestionPad.about.answer1=QuestionPad tilpasses med dit helt eget baggrundsbillede og dit eget udtryk. Denne tilpasning garanterer, at det er sikkert for dig at besvare dine sikkerhedssp\u00F8rgsm\u00E5l. Fra nu af m\u00E5 du kun indtaste dine svar online, hvis du f\u00E5r vist din tilpassede QuestionPad. Vi \u00E6ndrer aldrig din tilpasning uden at give dig besked.

bharosa.uio.default.whatsthis.DeviceQuestionPad.about.question2=Hvad skyldes \u00E6ndringen?
bharosa.uio.default.whatsthis.DeviceQuestionPad.about.answer2=Vi leder altid efter nye m\u00E5der at g\u00F8re din onlineoplevelse mere sikker p\u00E5. QuestionPad er blot en af de mange forholdsregler, vi tager for at for\u00F8ge din sikkerhed, n\u00E5r du bes\u00F8ger vores websted.

bharosa.uio.default.whatsthis.DeviceQuestionPad.about.question3=Hvad bruges opdateringsdatoen til?
bharosa.uio.default.whatsthis.DeviceQuestionPad.about.answer3=Hver gang du f\u00E5r vist QuestionPad-enheden, har den et nyt klokkesl\u00E6t og en ny dato. Dette er endnu en sikkerhedsfacilitet, der g\u00F8r det sikkert for dig at v\u00E6re online. Kontroll\u00E9r, at klokkesl\u00E6ttet og datoen ikke er \u00E6ldre end 24 timer, f\u00F8r du indtaster dit svar.

