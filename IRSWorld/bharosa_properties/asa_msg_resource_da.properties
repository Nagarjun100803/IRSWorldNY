bharosa.uio.default.register.info.title=Din nye sikkerhedsprofil
bharosa.uio.default.register.info.message=Ops\u00E6tning af din nye sikkerhedsprofil forbedrer din onlinebeskyttelse.<br>Det for\u00F8ger sikkerheden for din konto, fordi det hj\u00E6lper os med at identificere dig - og hj\u00E6lper dig med at identificere vores websted.

bharosa.uio.default.register.info.section1.title=Trin 1: Sikkerhedsbillede og -udtryk
bharosa.uio.default.register.info.section1.subtitle=Forbedret datasikkerhed
bharosa.uio.default.register.info.section1.message=Dine nye tilpassede sikkerhedsenheder hj\u00E6lper med at beskytte dig, n\u00E5r du bruger netbank. De oplysninger, som du indtaster, er beskyttet mod mange af de aktuelle sikkerhedstrusler. Samtidig er billedet, udtrykket og datoen bevis for, at du befinder dig p\u00E5 vores officielle websted.

bharosa.uio.default.register.info.section2.title=Trin 2: Sikkerhedssp\u00F8rgsm\u00E5l og -svar
bharosa.uio.default.register.info.section2.subtitle=For\u00F8gelse af sikkerheden
bharosa.uio.default.register.info.section2.message=Du skal registrere tre sikkerhedssp\u00F8rgsm\u00E5l for at for\u00F8ge sikkerheden. Fremover stiller vi dig et af disse sp\u00F8rgsm\u00E5l ved brug af din tilpassede enhed, hvis en situation virker risikabel. Disse sp\u00F8rgsm\u00E5l og svar skal v\u00E6re hemmelige, ligesom din adgangskode.

