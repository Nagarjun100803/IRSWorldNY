# Enable the Fuzzy Logic by default for all UIO clients.
bharosa.authenticator.EnableMatchScore = true

# Disable UserId column in UIO FA Reports
fa.label.extuserid.show = true

# Enable KBA Validation for fauio build
kba.validation.enable=true

####Kba Menu Customization####
kba.show.create.category = true

#This property is needed if you want to use custom implementation, 
# vcrypt.kba.questionset.select.class.name=com.bharosa.vcrypt.dataaccess.util.CustomQuestionSetBuilder


#Configure this only if you are using ASA as SAML provider
oaam.saml.provider.version=1.1
oracle.saml.attribute.namespace=
#If this is true, then attributes will be set in the SAML assertion
oracle.saml.set.attributes=false
#Set the SAML issuer. This is in URL format e.g. http://yourhost:port
oracle.saml.issuer.url=
#The URL where the final SAML assertion will be redirected to
oracle.saml.redirect.post.url=
#The defaul URL where the user should be redirected to by the SAML server
oracle.saml.target.default.url=
#Name of the keystore with certificate for signing the SAML assertion
oaam.saml.keystore=
#Password for the keystore. This should be encrypted
oaam.saml.keystore.password=
#Alias for the certificate
oaam.saml.keystore.certAlias=
#Password for the alias
oaam.saml.keystore.alias.password=
#Type of keystore
oaam.saml.keystore.type=JKS

default.usergroupname=IRS

default.external.usergroupname=IRS

