#SOAP client library
vcrypt.common.util.vcryptsoap.impl.classname=com.bharosa.vcrypt.common.impl.VCryptSOAPAxisImpl

#Enable device identification
vcrypt.tracker.rule.deviceIdentification.disable=false

#Enable authenticator by default
bharosa.authenticator.enabled=true

# Disable auto transaction logging of Rule process
vcrypt.tracker.rule.process.autoTransactionLog.disable=true

#Add the VTUsers to Value List (list of users)
#Override system property
vcrypt.system.add.vtuser=true

#Enable multi tenant for all UIO base builds
bharosa.multitenant.boolean=true
bharosa.multitenant.enforce.admin.check=false

#### application labels ####
fa.label.groupid = Application Id
fa.label.extuserid = User Id
fa.label.loginid = User Name
fa.label.csrid = CSR Id


#This disables auto activating of user when they set their challenge questions
bharosa.user.activate.auto=true

# Property to not set the user status to activation pending, if all questions are removed.
bharosa.user.questions.setUserStatusPendingOnDelete=false

#This is to point to the shared image directory - These can be overridden by Localized properties
#bharosa.authentipad.keypad.background.dirlist=/bharosa_images/allpads/keypad/
#bharosa.authentipad.textpad.background.dirlist=/bharosa_images/allpads/textpad
#bharosa.authentipad.textpadreset.background.dirlist=/bharosa_images/allpads/textpad
#bharosa.authentipad.captionpad.background.dirlist=/bharosa_images/allpads/textpad
#bharosa.authentipad.captionconfirmpad.background.dirlist=/bharosa_images/allpads/textpad
#bharosa.authentipad.pinpad.background.dirlist=/bharosa_images/allpads/pinpad
#bharosa.authentipad.questionpad.background.dirlist=/bharosa_images/allpads/questionpad
#
#bharosa.image.dirlist=/bharosa_images/allpads/textpad

#This contains the deployment specific configuration values
vcrypt.password.length.max = 25
vcrypt.password.length.min = 6

#background image dir
vcrypt.user.image.dirlist.property.name = bharosa.image.dirlist


bharosa.authentipad.compatibility.entermask.file = /bharosa_web/images/clear.gif

#empty background for textpad.
bharosa.authentipad.textpad.blank.background.file = textpad_bg/BG_white.jpg

