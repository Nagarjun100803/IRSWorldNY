bharosa.uio.default.whatsthis.DeviceQuestionPad.whatsthis.title=Mik\u00E4 t\u00E4m\u00E4 on?
bharosa.uio.default.whatsthis.DeviceQuestionPad.whatsthis.text1=QuestionPad on virtuaalinen laite, jonka kehittynyt suojaus est\u00E4\u00E4 henkil\u00F6kohtaisten tietojesi varastamisen verkossa.
bharosa.uio.default.whatsthis.DeviceQuestionPad.whatsthis.text2=QuestionPadin avulla voit vastata suojauskysymyksiin tavallisella n\u00E4pp\u00E4imist\u00F6ll\u00E4. QuestionPad est\u00E4\u00E4 t\u00E4rkeiden tietojen sy\u00F6tt\u00E4misen huijaussivustoon.

bharosa.uio.default.whatsthis.DeviceQuestionPad.about.title=Tietoja QuestionPadista: online-suojausominaisuudet
bharosa.uio.default.whatsthis.DeviceQuestionPad.about.text=T\u00E4ss\u00E4 esitell\u00E4\u00E4n QuestionPadiin liittyvi\u00E4 kehittyneit\u00E4 suojausominaisuuksia ja vastataan yleisiin kysymyksiin.

bharosa.uio.default.whatsthis.DeviceQuestionPad.about.question1=Miksi tarvitsen henkil\u00F6kohtaisen kuvan ja lauseen?
bharosa.uio.default.whatsthis.DeviceQuestionPad.about.answer1=QuestionPad sis\u00E4lt\u00E4\u00E4 k\u00E4ytt\u00E4j\u00E4n oman taustakuvan ja lauseen. T\u00E4m\u00E4 r\u00E4\u00E4t\u00E4l\u00F6inti vahvistaa, ett\u00E4 suojauskysymyksen vastauksen sy\u00F6tt\u00E4minen on turvallista. \u00C4l\u00E4 t\u00E4st\u00E4 l\u00E4htien koskaan sy\u00F6t\u00E4 suojauskysymysten vastauksia verkossa, ellet n\u00E4e itsellesi r\u00E4\u00E4t\u00E4l\u00F6ity\u00E4 QuestionPadia. Saat aina tiedon, jos r\u00E4\u00E4t\u00E4l\u00F6inti\u00E4 muutetaan.

bharosa.uio.default.whatsthis.DeviceQuestionPad.about.question2=Miksi muutos tehtiin?
bharosa.uio.default.whatsthis.DeviceQuestionPad.about.answer2=Pyrimme jatkuvasti tekem\u00E4\u00E4n Internetin k\u00E4yt\u00F6st\u00E4 turvallisempaa. QuestionPad on yksi monista toiminnoista, joiden avulla pyrimme parantamaan sivustomme turvallisuutta.

bharosa.uio.default.whatsthis.DeviceQuestionPad.about.question3=Mik\u00E4 on tuoreusp\u00E4iv\u00E4m\u00E4\u00E4r\u00E4n tarkoitus?
bharosa.uio.default.whatsthis.DeviceQuestionPad.about.answer3=Aina kun n\u00E4et QuestionPadin, siin\u00E4 on uusi aika ja p\u00E4iv\u00E4m\u00E4\u00E4r\u00E4. T\u00E4m\u00E4 on suojaustoiminto, joka parantaa sivuston turvallisuutta. Varmista, ett\u00E4 aika ja p\u00E4iv\u00E4m\u00E4\u00E4r\u00E4 ovat enint\u00E4\u00E4n 24 tuntia j\u00E4ljess\u00E4 nykyhetkest\u00E4, ennen kuin sy\u00F6t\u00E4t salasanan.

