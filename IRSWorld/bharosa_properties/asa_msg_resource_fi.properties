bharosa.uio.default.whatsthis.DeviceKeyPadFull.bullet.enum.two.text=Voit sy\u00F6tt\u00E4\u00E4 ison kirjaimen napsauttamalla Caps-painiketta. Jos napsautat painiketta kaksi kertaa, voit sy\u00F6tt\u00E4\u00E4 isoja kirjaimia. Voit sy\u00F6tt\u00E4\u00E4 j\u00E4lleen pieni\u00E4 kirjaimia napsauttamalla painiketta kolmannen kerran.

