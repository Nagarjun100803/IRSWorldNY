bharosa.uio.default.register.info.section2.message=Tallennat kolme suojauskysymyst\u00E4, jotka t\u00E4ydent\u00E4v\u00E4t suojausta. Voimme ep\u00E4ilytt\u00E4viss\u00E4 tapauksissa kysy\u00E4 yhden n\u00E4ist\u00E4 kolmesta kysymyksest\u00E4 r\u00E4\u00E4t\u00E4l\u00F6idyn suojauslaitteesi kautta. N\u00E4m\u00E4 kysymykset ja vastaukset on salasanojen tavoin pidett\u00E4v\u00E4 salassa muilta.

