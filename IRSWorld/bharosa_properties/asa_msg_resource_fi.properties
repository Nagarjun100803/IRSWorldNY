bharosa.uio.default.whatsthis.DeviceTextPad.bullet.enum.one.text=Sy\u00F6t\u00E4 salasana n\u00E4pp\u00E4imist\u00F6ll\u00E4 ja paina sitten Enter-n\u00E4pp\u00E4int\u00E4.

