bharosa.uio.default.whatsthis.DeviceKeyPadFull.bullet.enum.one.description=KeyPadin luettelomerkki 1
bharosa.uio.default.whatsthis.DeviceKeyPadFull.bullet.enum.one.text=Sy\u00F6t\u00E4 salasana napsauttamalla KeyPadin painikkeita ja napsauta sitten Enter-painiketta.

