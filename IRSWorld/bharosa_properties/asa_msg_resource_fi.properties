bharosa.uio.default.messages.enum.wherepassword.description=Olemme parantaneet suojaustamme, jotta verkkopankin k\u00E4ytt\u00F6 olisi turvallisempaa. T\u00E4st\u00E4 l\u00E4htien k\u00E4ytt\u00E4j\u00E4tunnus sy\u00F6tet\u00E4\u00E4n ensin omalla sivullaan ja salasana sy\u00F6tet\u00E4\u00E4n sen j\u00E4lkeen erillisell\u00E4 sivulla.

bharosa.uio.default.messages.enum.notimage.name=V\u00E4\u00E4r\u00E4 kuva ja lause?
bharosa.uio.default.messages.enum.notimage.description=Jos n\u00E4kem\u00E4si laite ei ole r\u00E4\u00E4t\u00E4l\u00F6ity laite, jossa on valitsemasi kuva ja lause, varmista, ett\u00E4 sy\u00F6tit k\u00E4ytt\u00E4j\u00E4tunnuksen oikein. Jos sy\u00F6tit k\u00E4ytt\u00E4j\u00E4tunnuksesi oikein etk\u00E4 silti n\u00E4e r\u00E4\u00E4t\u00E4l\u00F6ity\u00E4 laitettasi, ota yhteys asiakaspalveluun. Kiitos.

bharosa.uio.default.messages.enum.forgotanswer.name=Unohditko vastauksen?
bharosa.uio.default.messages.enum.forgotanswer.description=Jos olet unohtanut haastekysymysten vastaukset, ota yhteys asiakaspalveluun. Kiitos.


