bharosa.uio.default.whatsthis.DeviceQuestionPad.about.answer1=QuestionPad se personaliza con una imagen de fondo y una frase personal. Esta personalizaci\u00F3n constituye una garant\u00EDa de que resulta seguro contestar las preguntas de seguridad. A partir de este momento, nunca introduzca la respuesta en l\u00EDnea a menos que se muestre su QuestionPad personalizado. Nunca cambiaremos la personalizaci\u00F3n sin su conocimiento.

bharosa.uio.default.whatsthis.DeviceQuestionPad.about.question2=\u00BFA qu\u00E9 se debe el cambio?
bharosa.uio.default.whatsthis.DeviceQuestionPad.about.answer2=Buscamos constantemente formas de crear una experiencia en l\u00EDnea m\u00E1s segura. QuestionPad es solo una de las diversas medidas que adoptamos para mejorar la seguridad mientras se encuentre en nuestra direcci\u00F3n.

bharosa.uio.default.whatsthis.DeviceQuestionPad.about.question3=\u00BFPara que sirve la fecha de actualizaci\u00F3n?
bharosa.uio.default.whatsthis.DeviceQuestionPad.about.answer3=QuestionPad tendr\u00E1 una fecha y una hora nuevas cada vez que se lo mostramos. Se trata de otra de las funciones de seguridad que garantizan su seguridad en l\u00EDnea. Antes de introducir la contrase\u00F1a, aseg\u00FArese de que la fecha y la hora no tengan una antig\u00FCedad mayor de 24 horas.

