bharosa.uio.default.register.info.section2.message=Registrar\u00E1 tres preguntas de seguridad para agregar otro nivel de seguridad. En el futuro le formularemos una de estas preguntas por medio del dispositivo personalizado en caso de que una situaci\u00F3n parezca arriesgada. Estas preguntas y respuestas deber\u00E1n mantenerse en secreto, lo mismo que su contrase\u00F1a.

