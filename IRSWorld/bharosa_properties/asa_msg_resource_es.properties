bharosa.uio.default.whatsthis.DeviceTextPad.pagetitle=Acerca de TextPad
bharosa.uio.default.whatsthis.DeviceTextPad.title=Uso de TextPad: Instrucciones

bharosa.uio.default.whatsthis.DeviceTextPad.whatsthis.title=\u00BFQu\u00E9 es esto?
bharosa.uio.default.whatsthis.DeviceTextPad.whatsthis.text1=TextPad es un dispositivo virtual que le ofrece una protecci\u00F3n avanzada de la seguridad frente al robo de los datos de identidad en l\u00EDnea.
bharosa.uio.default.whatsthis.DeviceTextPad.whatsthis.text2=TextPad le permite introducir la contrase\u00F1a por medio del teclado normal. TextPad le ayuda a protegerle ante la introducci\u00F3n accidental de informaci\u00F3n confidencial en una direcci\u00F3n Web fraudulenta.

bharosa.uio.default.whatsthis.DeviceTextPad.about.title=Acerca de TextPad: Funciones de Seguridad en L\u00EDnea
bharosa.uio.default.whatsthis.DeviceTextPad.about.text=A continuaci\u00F3n se describen algunas de las funciones avanzadas de seguridad asociadas a TextPad y se ofrecen respuestas a las preguntas m\u00E1s habituales.

bharosa.uio.default.whatsthis.DeviceTextPad.about.question1=\u00BFPor qu\u00E9 necesito una imagen y una frase personales?
bharosa.uio.default.whatsthis.DeviceTextPad.about.answer1=TextPad se personaliza con una imagen de fondo y una frase personal. Esta personalizaci\u00F3n constituye una garant\u00EDa de que resulta seguro introducir la contrase\u00F1a. A partir de este momento, nunca introduzca la contrase\u00F1a en l\u00EDnea a menos que se muestre su TextPad personalizado. Nunca cambiaremos la personalizaci\u00F3n sin su conocimiento.

bharosa.uio.default.whatsthis.DeviceTextPad.about.question2=\u00BFA qu\u00E9 se debe el cambio?
bharosa.uio.default.whatsthis.DeviceTextPad.about.answer2=Buscamos constantemente formas de crear una experiencia en l\u00EDnea m\u00E1s segura. TextPad es solo una de las diversas medidas que adoptamos para mejorar la seguridad mientras se encuentre en nuestra direcci\u00F3n.

bharosa.uio.default.whatsthis.DeviceTextPad.about.question3=\u00BFPara que sirve la fecha de actualizaci\u00F3n?
bharosa.uio.default.whatsthis.DeviceTextPad.about.answer3=TextPad tendr\u00E1 una fecha y una hora nuevas cada vez que se lo mostramos. Se trata de otra de las funciones de seguridad que garantizan su seguridad en l\u00EDnea. Antes de introducir la contrase\u00F1a, aseg\u00FArese de que la fecha y la hora no tengan una antig\u00FCedad mayor de 24 horas.


