bharosa.uio.default.whatsthis.DevicePinPad.about.question1=\u00BFPor qu\u00E9 necesito una imagen y una frase personales?
bharosa.uio.default.whatsthis.DevicePinPad.about.answer1=PinPad se personaliza con una imagen de fondo y una frase personal. Esta personalizaci\u00F3n constituye una garant\u00EDa de que resulta seguro introducir su c\u00F3digo PIN. A partir de este momento, nunca introduzca el c\u00F3digo PIN en l\u00EDnea a menos que se muestre su PinPad personalizado. Nunca cambiaremos la personalizaci\u00F3n sin su conocimiento.

