bharosa.uio.default.register.info.section1.subtitle=Mayor seguridad de los datos
bharosa.uio.default.register.info.section1.message=Los nuevos dispositivos de seguridad personalizados le ayudar\u00E1n a protegerle mientras realiza transacciones bancarias en l\u00EDnea. La informaci\u00F3n que introduzca estar\u00E1 protegida frente a muchas de las amenazas de seguridad existentes actualmente. Al mismo tiempo, la imagen, la frase y la fecha son pruebas de que se encuentra en nuestra direcci\u00F3n oficial.

bharosa.uio.default.register.info.section2.title=Paso 2: Preguntas y Respuestas de Seguridad
