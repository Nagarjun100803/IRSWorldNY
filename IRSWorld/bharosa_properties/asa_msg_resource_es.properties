bharosa.uio.default.whatsthis.DevicePinPad.whatsthis.text1=PinPad es un dispositivo virtual que le ofrece una protecci\u00F3n avanzada de la seguridad frente al robo de los datos de identidad en l\u00EDnea.
bharosa.uio.default.whatsthis.DevicePinPad.whatsthis.text2=PinPad le permite introducir el c\u00F3digo PIN con tan solo unos clic del mouse, en vez de tener que pulsar las teclas del teclado. Este sistema le protege de diversas amenazas en l\u00EDnea.

