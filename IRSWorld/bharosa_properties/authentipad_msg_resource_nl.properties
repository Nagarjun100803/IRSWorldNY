###  KeyPad Description and Directions
bharosa.autehntipad.keypad.accessibility.description = KeyPad
bharosa.authentipad.keypad.accessibility.directions = Instructies voor KeyPad: gebruik de volgende koppelingen om uw wachtwoord in te voeren. U ziet uw gepersonaliseerde bijschrifttekst, gevolgd door koppelingen voor opties en toetsen. Als u uw wachtwoord hebt opgegeven, navigeert u met Shift+Tab terug naar de invoerkoppeling om uw wachtwoord te versturen.
bharosa.authentipad.keypad.security.image.alt = Afbeelding beveiligingsapparaat

###  PinPad Description and Directions
bharosa.authentipad.pinpad.accessibility.description = PinPad
bharosa.authentipad.pinpad.accessibility.directions = Instructies voor PinPad: gebruik de volgende koppelingen om uw numerieke PIN in te voeren. U ziet uw gepersonaliseerde bijschrifttekst, gevolgd door koppelingen voor opties en nummertoetsen. Als u uw numerieke PIN hebt opgegeven, navigeert u met Shift+Tab terug naar de invoerkoppeling om uw PIN te versturen.
bharosa.authentipad.pinpad.security.image.alt = Afbeelding beveiligingsapparaat

###  TextPad Description and Directions
bharosa.authentipad.textpad.accessibility.description = TextPad
bharosa.authentipad.textpad.accessibility.directions = Instructies voor TextPad: gebruik de volgende items om uw apparaat te valideren. U ziet uw gepersonaliseerde bijschrifttekst, gevolgd door een tijdstempel waarmee u kunt controleren of het apparaat is gegenereerd voor deze sessie. Als u uw wachtwoord in het wachtwoordinvoerveld hebt opgegeven, navigeert u met de tabtoets naar de invoerkoppeling om uw wachtwoord te versturen.
bharosa.authentipad.textpad.security.image.alt = Afbeelding beveiligingsapparaat

###  TextPadReset Description and Directions
bharosa.authentipad.textpadreset.accessibility.description = TextPad
bharosa.authentipad.textpadreset.accessibility.directions = Instructies voor TextPad: gebruik de volgende items om uw nieuwe wachtwoord in te voeren. U ziet uw gepersonaliseerde bijschrifttekst, gevolgd door een invoerveld en bevestigingsveld voor het wachtwoord. Als u uw wachtwoord hebt opgegeven, navigeert u met de tabtoets naar de invoerkoppeling om uw nieuwe wachtwoord te versturen.
bharosa.authentipad.textpadreset.security.image.alt = Afbeelding beveiligingsapparaat

###  CaptionPad Description and Directions
bharosa.authentipad.captionpad.accessibility.description = CaptionPad
bharosa.authentipad.captionpad.accessibility.directions = Instructies voor CaptionPad: gebruik de volgende items om uw nieuwe bijschrifttekst in te voeren. U ziet koppelingen met opties, gevolgd door een tekstinvoerveld. Als u uw bijschrift hebt opgegeven, navigeert u met de tabtoets naar de invoerkoppeling om uw nieuwe bijschrift te versturen.
bharosa.authentipad.captionpad.security.image.alt = Afbeelding beveiligingsapparaat

###  CaptionPadConfirm Description and Directions
bharosa.authentipad.captionconfirmpad.accessibility.description = CaptionConfirmPad
bharosa.authentipad.captionconfirmpad.accessibility.directions = Instructies voor CaptionConfirmPad: gebruik de volgende items om uw bijschrifttekst te controleren. Als u de bijschrifttekst wilt bewerken, navigeert u met de tabtoets naar de koppeling 'Bewerken' en drukt u op 'Enter'.
bharosa.authentipad.captionconfirmpad.security.image.alt = Afbeelding beveiligingsapparaat

###  QuestionPad Description and Directions
bharosa.authentipad.questionpad.accessibility.description = QuestionPad
bharosa.authentipad.questionpad.accessibility.directions = Instructies voor QuestionPad: gebruik de volgende items om uw antwoord in te voeren. U ziet eerst uw gepersonaliseerde vraag, gevolgd door uw gepersonaliseerde bijschrift en het invoerveld voor uw antwoord. Als u uw antwoord hebt opgegeven, navigeert u met de tabtoets naar de invoerkoppeling om uw antwoord te versturen.
bharosa.authentipad.questionpad.security.image.alt = Afbeelding beveiligingsapparaat

