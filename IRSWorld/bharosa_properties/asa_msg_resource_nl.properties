bharosa.uio.default.whatsthis.DeviceTextPad.pagetitle=Info over TextPad
bharosa.uio.default.whatsthis.DeviceTextPad.title=TextPad gebruiken: aanwijzingen

bharosa.uio.default.whatsthis.DeviceTextPad.whatsthis.title=Wat is dit?
bharosa.uio.default.whatsthis.DeviceTextPad.whatsthis.text1=TextPad is een virtueel apparaat dat u uitgebreide beveiliging en bescherming geeft tegen diefstal van uw identiteit online.
bharosa.uio.default.whatsthis.DeviceTextPad.whatsthis.text2=Met TextPad kunt u uw wachtwoord invoeren met uw normale toetsenbord. TextPad helpt te voorkomen dat u per ongeluk gevoelige gegevens invoert op een frauduleuze website.

bharosa.uio.default.whatsthis.DeviceTextPad.about.title=Info over TextPad: functionaliteiten voor onlinebeveiliging
bharosa.uio.default.whatsthis.DeviceTextPad.about.text=Dit zijn enkele van de uitgebreide beveiligingsfunctionaliteiten van TextPad en antwoorden op de meestgestelde vragen.

bharosa.uio.default.whatsthis.DeviceTextPad.about.question1=Waarom heb ik een persoonlijke afbeelding en woordgroep nodig?
bharosa.uio.default.whatsthis.DeviceTextPad.about.answer1=TextPad wordt gepersonaliseerd met uw eigen achtergrondafbeelding en woordgroep. Deze personalisatie vormt een garantie dat het veilig is om uw wachtwoord in te voeren. Vanaf nu moet u uw wachtwoord alleen online invoeren als u uw gepersonaliseerde TextPad ziet. Wij zullen de personalisatie nooit wijzigen zonder dat u dit weet.

bharosa.uio.default.whatsthis.DeviceTextPad.about.question2=Waarom de wijziging?
bharosa.uio.default.whatsthis.DeviceTextPad.about.answer2=We zoeken steeds naar manieren om online bankieren veiliger voor u te maken. TextPad is slechts \u00E9\u00E9n van de vele maatregelen die wij nemen om uw veiligheid op onze site te verbeteren.

bharosa.uio.default.whatsthis.DeviceTextPad.about.question3=Waar is de versheidsdatum voor?
bharosa.uio.default.whatsthis.DeviceTextPad.about.answer3=Elke keer dat wij TextPad aan u tonen ziet u een nieuwe tijd en datum. Dit is nog een beveiligingsfunctionaliteit voor uw veiligheid online. Controleer of de tijd en datum niet ouder zijn dan 24 uur voordat u uw wachtwoord invoert.


