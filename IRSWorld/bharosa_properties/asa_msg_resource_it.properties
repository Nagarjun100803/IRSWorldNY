bharosa.uio.default.register.info.title=Un nuovo profilo di sicurezza
bharosa.uio.default.register.info.message=L'impostazione di un nuovo profilo di sicurezza migliora la protezione in linea.<br>Aggiunge nuovi livelli di sicurezza all'account aiutandoci a identificare l'utente e, al contempo, aiutando l'utente a identificare il nostro sito.

bharosa.uio.default.register.info.section1.title=Passo 1: Immagine ed espressione di sicurezza
bharosa.uio.default.register.info.section1.subtitle=Sicurezza dati migliorata
bharosa.uio.default.register.info.section1.message=I nuovi dispositivi di sicurezza personalizzati contribuiscono a una migliore protezione dell'utente durante le operazioni di banca in linea. Le informazioni immesse sono protette contro numerose minacce della vita di oggi. Al contempo, l'immagine, l'espressione e la data sono prove dell'avvenuto accesso al nostro sito ufficiale.

bharosa.uio.default.register.info.section2.title=Passo 2: Domande e risposte di sicurezza
bharosa.uio.default.register.info.section2.subtitle=Un livello di sicurezza supplementare
bharosa.uio.default.register.info.section2.message=Si dovranno registrare tre domande per aggiungere un ulteriore livello di sicurezza. In futuro, se la situazione risulter\u00E0 a rischio, all'utente verr\u00E0 posta una di queste domande utilizzando il dispositivo personalizzato di cui dispone. Le domande e le risposte devono essere tenute segrete proprio come la password.

