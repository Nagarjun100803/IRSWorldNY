bharosa.uio.default.whatsthis.DeviceTextPad.pagetitle=Informazioni su TextPad
bharosa.uio.default.whatsthis.DeviceTextPad.title=Istruzioni per l'uso di TextPad

bharosa.uio.default.whatsthis.DeviceTextPad.whatsthis.title=Guida rapida
bharosa.uio.default.whatsthis.DeviceTextPad.whatsthis.text1=TextPad \u00E8 un dispositivo virtuale che offre una protezione di sicurezza avanzata contro il furto di identit\u00E0 in linea.
bharosa.uio.default.whatsthis.DeviceTextPad.whatsthis.text2=TextPad consente di immettere la password utilizzando la normale tastiera del computer. TextPad aiuta a proteggersi dall'immissione accidentale di informazioni riservate su un sito Web fraudolento.

bharosa.uio.default.whatsthis.DeviceTextPad.about.title=Informazioni su TextPad: funzioni di sicurezza in linea
bharosa.uio.default.whatsthis.DeviceTextPad.about.text=Di seguito vengono indicate alcune delle funzioni di sicurezza avanzate associate a TextPad. Vengono inoltre riportate le risposte alle domande pi\u00F9 frequenti.

bharosa.uio.default.whatsthis.DeviceTextPad.about.question1=Perch\u00E9 sono necessarie le immagini e le espressioni personali?
bharosa.uio.default.whatsthis.DeviceTextPad.about.answer1=TextPad viene personalizzato con l'immagine di sfondo e l'espressione personali dell'utente. Questa personalizzazione garantisce che la password pu\u00F2 essere immessa in tutta sicurezza. D'ora in poi, non immettere mai la password in linea se non viene visualizzato il proprio TextPad personalizzato. La personalizzazione non verr\u00E0 mai modificata senza l'accordo dell'utente.

bharosa.uio.default.whatsthis.DeviceTextPad.about.question2=Perch\u00E9 cambiare?
bharosa.uio.default.whatsthis.DeviceTextPad.about.answer2=Si \u00E8 costantemente alla ricerca di nuovi metodi per proteggere gli utenti che si collegano. TextPad rappresenta semplicemente una delle numerose misure adottate per migliorare la sicurezza dei visitatori del nostro sito.

bharosa.uio.default.whatsthis.DeviceTextPad.about.question3=A cosa serve la data di validit\u00E0?
bharosa.uio.default.whatsthis.DeviceTextPad.about.answer3=A ogni presentazione TextPad avr\u00E0 un'ora e una data diverse. Si tratta di un'ulteriore funzione volta a migliorare la sicurezza degli utenti in linea. Prima di immettere la password \u00E8 necessario accertarsi che l'ora e la data non siano trascorse da oltre 24 ore.


