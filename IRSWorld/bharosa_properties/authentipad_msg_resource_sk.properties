###  KeyPad Description and Directions
bharosa.autehntipad.keypad.accessibility.description = KeyPad
bharosa.authentipad.keypad.accessibility.directions = Pokyny pre KeyPad: Pomocou nasleduj\u00FAcich prepojen\u00ED zadajte heslo. Najprv sa zobraz\u00ED personalizovan\u00FD text titulku, potom ovl\u00E1dacie prepojenia, po ktor\u00FDch sa zobrazia kl\u00E1vesov\u00E9 prepojenia. Po zadan\u00ED hesla sa pomocou kl\u00E1vesov shift-tabul\u00E1tor vr\u00E1\u0165te na prepojenie Enter a heslo odo\u0161lite.
bharosa.authentipad.keypad.security.image.alt = Obr\u00E1zok zabezpe\u010Dovacieho zariadenia

###  PinPad Description and Directions
bharosa.authentipad.pinpad.accessibility.description = PinPad
bharosa.authentipad.pinpad.accessibility.directions = Pokyny pre PinPad: Pomocou nasleduj\u00FAcich prepojen\u00ED zadajte \u010D\u00EDseln\u00FD k\u00F3d PIN. Najprv sa zobraz\u00ED personalizovan\u00FD text titulku, potom ovl\u00E1dacie prepojenia, po ktor\u00FDch sa zobrazia \u010D\u00EDseln\u00E9 prepojenia. Po zadan\u00ED \u010D\u00EDseln\u00E9ho k\u00F3du PIN sa pomocou kl\u00E1vesov shift-tabul\u00E1tor vr\u00E1\u0165te na prepojenie Enter a \u010D\u00EDseln\u00FD k\u00F3d PIN odo\u0161lite.
bharosa.authentipad.pinpad.security.image.alt = Obr\u00E1zok zabezpe\u010Dovacieho zariadenia

###  TextPad Description and Directions
bharosa.authentipad.textpad.accessibility.description = TextPad
bharosa.authentipad.textpad.accessibility.directions = Pokyny pre TextPad: Pomocou nasleduj\u00FAcich polo\u017Eiek overte zariadenie. Najprv sa zobraz\u00ED personalizovan\u00FD text titulku, potom \u010Dasov\u00E1 zna\u010Dka zabezpe\u010Duj\u00FAca, \u017Ee zariadenie bolo vygenerovan\u00E9 pre t\u00FAto rel\u00E1ciu. Po zadan\u00ED hesla v predch\u00E1dzaj\u00FAcom poli na zadanie hesla prejdite pomocou tabul\u00E1tora na prepojenie Enter a heslo odo\u0161lite.
bharosa.authentipad.textpad.security.image.alt = Obr\u00E1zok zabezpe\u010Dovacieho zariadenia

###  TextPadReset Description and Directions
bharosa.authentipad.textpadreset.accessibility.description = TextPad
bharosa.authentipad.textpadreset.accessibility.directions = Pokyny pre TextPad: Pomocou nasleduj\u00FAcich polo\u017Eiek zadajte nov\u00E9 heslo. Najprv sa zobraz\u00ED personalizovan\u00FD text titulku, potom pole na zadanie hesla a pole na potvrdenie hesla. Po zadan\u00ED hesla prejdite pomocou tabul\u00E1tora na prepojenie Enter a nov\u00E9 heslo odo\u0161lite.
bharosa.authentipad.textpadreset.security.image.alt = Obr\u00E1zok zabezpe\u010Dovacieho zariadenia

