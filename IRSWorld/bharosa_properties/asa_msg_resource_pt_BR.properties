bharosa.uio.default.whatsthis.DeviceKeyPadFull.about.question1=Por que preciso de uma imagem e frase pessoal?
bharosa.uio.default.whatsthis.DeviceKeyPadFull.about.answer1=O KeyPad est\u00E1 personalizado com sua imagem e frase de segundo plano. Esta personaliza\u00E7\u00E3o \u00E9 a garantia de que \u00E9 seguro informar sua senha. De agora em diante, nunca informe sua senha on-line, a n\u00E3o ser que lhe seja apresentado o seu KeyPad personalizado. Nunca alteraremos sua personaliza\u00E7\u00E3o sem o seu conhecimento.

bharosa.uio.default.whatsthis.DeviceKeyPadFull.about.question2=Por que as chaves mudam?
bharosa.uio.default.whatsthis.DeviceKeyPadFull.about.answer2=Como medida adicional de seguran\u00E7a, as teclas do KeyPad s\u00E3o transferidas para outro local dentro do frame cada vez que voc\u00EA efetua login.

