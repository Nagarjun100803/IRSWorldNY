bharosa.uio.default.whatsthis.DeviceTextPad.pagetitle=Sobre o TextPad
bharosa.uio.default.whatsthis.DeviceTextPad.title=Usando o TextPad: Instru\u00E7\u00F5es

bharosa.uio.default.whatsthis.DeviceTextPad.whatsthis.title=O Que \u00C9 Isto?
bharosa.uio.default.whatsthis.DeviceTextPad.whatsthis.text1=O TextPad \u00E9 um dispositivo virtual que lhe oferece prote\u00E7\u00E3o de seguran\u00E7a avan\u00E7ada contra roubo de identidades on-line.
bharosa.uio.default.whatsthis.DeviceTextPad.whatsthis.text2=O TextPad permite digitar sua senha usando o teclado normal. Ele ajuda a proteg\u00EA-lo de, acidentalmente, digitar suas informa\u00E7\u00F5es confidenciais em um Web site fraudulento.

bharosa.uio.default.whatsthis.DeviceTextPad.about.title=Sobre o TextPad: Recursos de Seguran\u00E7a On-line
bharosa.uio.default.whatsthis.DeviceTextPad.about.text=Aqui est\u00E3o alguns dos recursos de seguran\u00E7a avan\u00E7ados associados ao TextPad e as respostas \u00E0s suas perguntas mais comuns.

bharosa.uio.default.whatsthis.DeviceTextPad.about.question1=Por que preciso de uma imagem e frase pessoal?
bharosa.uio.default.whatsthis.DeviceTextPad.about.answer1=O Textpad \u00E9 personalizado com sua imagem e frase de segundo plano. Esta personaliza\u00E7\u00E3o \u00E9 uma garantia de que \u00E9 seguro informar sua senha. De agora em diante, nunca informe sua senha  on-line, a menos que lhe seja apresentado o seu Textpad personalizado. N\u00F3s nunca alteraremos sua personaliza\u00E7\u00E3o sem seu conhecimento.

bharosa.uio.default.whatsthis.DeviceTextPad.about.question2=Por que a altera\u00E7\u00E3o?
bharosa.uio.default.whatsthis.DeviceTextPad.about.answer2=Estamos sempre buscando formas de tornar mais segura sua experi\u00EAncia on-line. O TextPad \u00E9 apenas uma das muitas medidas que estamos tomando para aumentar sua seguran\u00E7a enquanto voc\u00EA estiver no nosso site.

bharosa.uio.default.whatsthis.DeviceTextPad.about.question3=Qual \u00E9 a data de atualiza\u00E7\u00E3o para?
bharosa.uio.default.whatsthis.DeviceTextPad.about.answer3=Cada vez que lhe apresentarmos o Textpad, ele ter\u00E1 uma nova data e hor\u00E1rio. Este \u00E9 mais um recurso de seguran\u00E7a para garantir sua prote\u00E7\u00E3o on-line. Antes de informar sua senha, certifique-se de que a data e o hor\u00E1rio s\u00E3o do dia atual.


