bharosa.uio.default.whatsthis.DeviceQuestionPad.whatsthis.text2=O QuestionPad permite responder a perguntas de seguran\u00E7a usando o teclado normal. Ele ajuda a proteg\u00EA-lo de, por acidente, digitar suas informa\u00E7\u00F5es confidenciais em um Web site fraudulento.

bharosa.uio.default.whatsthis.DeviceQuestionPad.about.title=Sobre o QuestionPad: Recursos de Seguran\u00E7a On-line
bharosa.uio.default.whatsthis.DeviceQuestionPad.about.text=Aqui est\u00E3o alguns dos recursos de seguran\u00E7a avan\u00E7ados associados ao QuestionPad e as respostas \u00E0s suas perguntas mais comuns.

bharosa.uio.default.whatsthis.DeviceQuestionPad.about.question1=Por que preciso de uma imagem e frase pessoal?
bharosa.uio.default.whatsthis.DeviceQuestionPad.about.answer1=O Questionpad \u00E9 personalizado com sua imagem e frase de segundo plano. Essa personaliza\u00E7\u00E3o \u00E9 a garantia de que \u00E9 seguro responder \u00E0s suas perguntas de seguran\u00E7a. De agora em diante, nunca digite sua resposta on-line, a menos que lhe seja apresentado o seu QuestionPad personalizado. Nunca alteraremos sua personaliza\u00E7\u00E3o sem o seu conhecimento.

bharosa.uio.default.whatsthis.DeviceQuestionPad.about.question2=Por que a altera\u00E7\u00E3o?
bharosa.uio.default.whatsthis.DeviceQuestionPad.about.answer2=Estamos sempre buscando formas de tornar mais segura sua experi\u00EAncia on-line. O QuestionPad \u00E9 apenas uma das muitas medidas que estamos tomando para aumentar sua seguran\u00E7a enquanto voc\u00EA estiver no nosso site.

bharosa.uio.default.whatsthis.DeviceQuestionPad.about.question3=Qual \u00E9 a data de atualiza\u00E7\u00E3o para?
bharosa.uio.default.whatsthis.DeviceQuestionPad.about.answer3=Cada vez que lhe apresentarmos o QuestionPad, ele ter\u00E1 uma nova data e hor\u00E1rio. Este \u00E1 mais outro recurso de seguran\u00E7a para garantir sua prote\u00E7\u00E3o on-line. Antes de informar sua resposta, certifique-se de que a data e o hor\u00E1rio sejam do dia atual.

