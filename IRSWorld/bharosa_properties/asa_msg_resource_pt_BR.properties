bharosa.uio.default.whatsthis.DeviceTextPad.bullet.enum.one.description=Bullet 1 do TextPad
bharosa.uio.default.whatsthis.DeviceTextPad.bullet.enum.one.text=Digite sua senha usando o teclado e clique em Enter.

