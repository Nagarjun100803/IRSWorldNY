###  KeyPad Description and Directions
bharosa.autehntipad.keypad.accessibility.description = KeyPad
bharosa.authentipad.keypad.accessibility.directions = KeyPad-anvisninger: Benyt f\u00F8lgende links til at angive din adgangskode. Din personlige overskrift kommer frem f\u00F8rst. Dern\u00E6st f\u00F8lger nogle kontrollinks, som efterf\u00F8lges af hovedlinkene. N\u00E5r du har angivet din adgangskode, skal du benytte shift-tab til at komme tilbage til enter-linket og afsende din adgangskode.
bharosa.authentipad.keypad.security.image.alt = Billede af sikkerhedsenhed

###  PinPad Description and Directions
bharosa.authentipad.pinpad.accessibility.description = PinPad
bharosa.authentipad.pinpad.accessibility.directions = PinPad-anvisninger: Benyt f\u00F8lgende links til at angive din numeriske pinkode. Din personlige overskrift kommer frem f\u00F8rst. Dern\u00E6st f\u00F8lger nogle kontrollinks, som efterf\u00F8lges af de numeriske links. N\u00E5r du har angivet din numeriske pinkode, skal du benytte shift-tab til at komme tilbage til enter-linket og afsende din pinkode.
bharosa.authentipad.pinpad.security.image.alt = Billede af sikkerhedsenhed

###  TextPad Description and Directions
bharosa.authentipad.textpad.accessibility.description = TextPad
bharosa.authentipad.textpad.accessibility.directions = TextPad-anvisninger: Benyt f\u00F8lgende elementer til at validere din enhed. Din personlige overskrift kommer frem f\u00F8rst. Dern\u00E6st f\u00F8lger et tidsstempel, som sikrer, at enheden blev genereret til denne session. N\u00E5r du har angivet din adgangskode i det forrige felt til angivelse af adgangskode, skal du bruge tabulator-tasten til at navigere til enter-linket og afsende din adgangskode
bharosa.authentipad.textpad.security.image.alt = Billede af sikkerhedsenhed

###  TextPadReset Description and Directions
bharosa.authentipad.textpadreset.accessibility.description = TextPad
bharosa.authentipad.textpadreset.accessibility.directions = TextPad-anvisninger: Benyt f\u00F8lgende elementer til at angive din nye adgangskode. Din personlige overskrift kommer frem f\u00F8rst. Dern\u00E6st f\u00F8lger et felt, hvor adgangskoden skal indtastes, og et felt, hvor adgangskoden skal bekr\u00E6ftes. N\u00E5r du har angivet din adgangskode, skal du bruge tabulatortasten til at navigere til enter-linket og afsende din nye adgangskode.
bharosa.authentipad.textpadreset.security.image.alt = Billede af sikkerhedsenhed

###  CaptionPad Description and Directions
bharosa.authentipad.captionpad.accessibility.description = CaptionPad
bharosa.authentipad.captionpad.accessibility.directions = CaptionPad-anvisninger: Benyt f\u00F8lgende elementer til at angive teksten til din nye overskrift. Der kommer f\u00F8rst nogle kontrollinks frem. Dern\u00E6st f\u00F8lger et tekstindtastningsfelt. N\u00E5r du har angivet overskriften, skal du benytte tabulatortasten til at navigere til enter-linket og afsende din nye overskrift.
bharosa.authentipad.captionpad.security.image.alt = Billede af sikkerhedsenhed

###  CaptionPadConfirm Description and Directions
bharosa.authentipad.captionconfirmpad.accessibility.description = CaptionConfirmPad
bharosa.authentipad.captionconfirmpad.accessibility.directions = CaptionConfirmPad-anvisinger: Benyt f\u00F8lgende elementer til at genneml\u00E6se teksten i din overskrift. Hvis du vil redigere teksten, skal du benytte tabulatortasten til at g\u00E5 til linket Redig\u00E9r og trykke p\u00E5 Enter.
bharosa.authentipad.captionconfirmpad.security.image.alt = Billede af sikkerhedsenhed

###  QuestionPad Description and Directions
bharosa.authentipad.questionpad.accessibility.description = QuestionPad
bharosa.authentipad.questionpad.accessibility.directions = QuestionPad-anvisninger: Benyt f\u00F8lgende elementer til at angive dine svar. Dit personlige sp\u00F8rgsm\u00E5l kommer frem f\u00F8rst. Dern\u00E6st f\u00F8lger din personlige overskrift efterfulgt af svarindtastningsfeltet. N\u00E5r du har angivet dit svar, skal du benytte tabulatortasten til at navigere til enter-linket og afsende dit svar.
bharosa.authentipad.questionpad.security.image.alt = Billede af sikkerhedsenhed

###  QuizPad Description and Directions
bharosa.authentipad.quizpad.accessibility.description = QuizPad
bharosa.authentipad.quizpad.accessibility.directions = QuizPad-anvisninger: Benyt f\u00F8lgende elementer til at v\u00E6lge svaret p\u00E5 sp\u00F8rgsm\u00E5let. Din personlige overskrift kommer f\u00F8rst frem efterfulgt af svar-linkene.
bharosa.authentipad.quizpad.security.image.alt = Billede af sikkerhedsenhed
