###  KeyPad Description and Directions
bharosa.autehntipad.keypad.accessibility.description = KeyPad
bharosa.authentipad.keypad.accessibility.directions = Pokyny k pou\u017Eit\u00ED oblasti KeyPad: Pomoc\u00ED n\u00E1sleduj\u00EDc\u00EDch odkaz\u016F zadejte heslo. Jako prvn\u00ED bude uveden v\u00E1\u0161 p\u0159izp\u016Fsoben\u00FD text popisku. Pak budou n\u00E1sledovat kontroln\u00ED odkazy, kter\u00E9 budou n\u00E1sledov\u00E1ny kl\u00ED\u010Dov\u00FDmi odkazy. Po zad\u00E1n\u00ED hesla se pomoc\u00ED kl\u00E1ves SHIFT + TAB vra\u0165te k odkazu pro zad\u00E1n\u00ED a heslo ode\u0161lete.
