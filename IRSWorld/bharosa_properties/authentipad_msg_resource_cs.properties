###  TextPad Description and Directions
bharosa.authentipad.textpad.accessibility.description = TextPad
bharosa.authentipad.textpad.accessibility.directions = Pokyny k pou\u017Eit\u00ED oblasti TextPad: Pomoc\u00ED n\u00E1sleduj\u00EDc\u00EDch polo\u017Eek ov\u011B\u0159te za\u0159\u00EDzen\u00ED. Jako prvn\u00ED bude uveden v\u00E1\u0161 p\u0159izp\u016Fsoben\u00FD text. Pak bude n\u00E1sledovat \u010Dasov\u00E9 raz\u00EDtko zaji\u0161\u0165uj\u00EDc\u00ED, \u017Ee za\u0159\u00EDzen\u00ED bylo generov\u00E1no pro tuto relaci. Po zad\u00E1n\u00ED hesla do p\u0159edchoz\u00EDho pole pro zad\u00E1n\u00ED hesla p\u0159ejd\u011Bte pomoc\u00ED karty k odkazu pro zad\u00E1n\u00ED a heslo ode\u0161lete.
bharosa.authentipad.textpad.security.image.alt = Obr\u00E1zek za\u0159\u00EDzen\u00ED pro zabezpe\u010Den\u00ED

###  TextPadReset Description and Directions
bharosa.authentipad.textpadreset.accessibility.description = TextPad
bharosa.authentipad.textpadreset.accessibility.directions = Pokyny k pou\u017Eit\u00ED oblasti TextPad: Pomoc\u00ED n\u00E1sleduj\u00EDc\u00EDch polo\u017Eek zadejte nov\u00E9 heslo. Jako prvn\u00ED bude uveden v\u00E1\u0161 p\u0159izp\u016Fsoben\u00FD text popisku. Pak bude n\u00E1sledovat pole pro zad\u00E1n\u00ED hesla a pole pro potvrzen\u00ED hesla. Po zad\u00E1n\u00ED hesla pomoc\u00ED karty p\u0159ejd\u011Bte k odkazu pro zad\u00E1n\u00ED a ode\u0161lete nov\u00E9 heslo.
bharosa.authentipad.textpadreset.security.image.alt = Obr\u00E1zek za\u0159\u00EDzen\u00ED pro zabezpe\u010Den\u00ED

