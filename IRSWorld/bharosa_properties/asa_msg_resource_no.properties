bharosa.uio.default.register.info.title=Den nye sikkerhetsprofilen din
bharosa.uio.default.register.info.message=Ved \u00E5 konfigurere den nye sikkerhetsprofilen forbedrer du den elektroniske sikkerheten.<br>Sikkerhetsprofilen legger til nye lag av sikkerhet for kontoen din ved \u00E5 hjelpe oss med \u00E5 identifisere deg - og vil hjelpe deg med \u00E5 identifisere omr\u00E5det v\u00E5rt.

bharosa.uio.default.register.info.section1.title=Trinn 1: Sikkerhetsbilde og -uttrykk
bharosa.uio.default.register.info.section1.subtitle=Forbedret datasikkerhet
bharosa.uio.default.register.info.section1.message=De nye tilpassede sikkerhetsenhetene bidrar til \u00E5 beskytte deg n\u00E5r du bruker elektroniske banktjenester. Informasjonen du angir, beskyttes mot mange av sikkerhetstruslene som finnes i dag. Samtidig fungerer bildet, uttrykket og datoen som bevis p\u00E5 at du er p\u00E5 det offisielle omr\u00E5det v\u00E5rt.

bharosa.uio.default.register.info.section2.title=Trinn 2: Sikkerhetssp\u00F8rsm\u00E5l og svar
bharosa.uio.default.register.info.section2.subtitle=Ekstra lag med sikkerhet
bharosa.uio.default.register.info.section2.message=Du registrerer tre sikkerhetssp\u00F8rsm\u00E5l for \u00E5 legge til enda et lag med sikkerhet. I fremtiden vil vi stille deg ett av disse sp\u00F8rsm\u00E5lene ved hjelp av den tilpassede enheten din hvis en situasjon virker risikabel. Disse sp\u00F8rsm\u00E5lene og svarene m\u00E5 du holde hemmelig, akkurat som passordet.

