bharosa.uio.default.whatsthis.DevicePinPad.whatsthis.text1=PinPad er en virtuell enhet som gir avansert sikkerhetsbeskyttelse mot elektronisk identitetstyveri.
bharosa.uio.default.whatsthis.DevicePinPad.whatsthis.text2=Med PinPad kan du angi PIN-koden med bare noen f\u00E5 museklikk i stedet for \u00E5 taste den inn via tastaturet. Dette beskytter deg mot en rekke elektroniske trusler.

