bharosa.uio.default.whatsthis.DevicePinPad.about.answer1=PinPad tilpasses med ditt eget bakgrunnsbilde og uttrykk. Denne personlige tilpasningen angir at det er trygt \u00E5 oppgi PIN-koden. Fra n\u00E5 av b\u00F8r du aldri oppgi PIN-koden din p\u00E5 Internett med mindre den tilpassede PinPad-enheten vises. Vi endrer aldri tilpasningen uten at du er informert.

