bharosa.uio.default.whatsthis.DeviceTextPad.pagetitle=Om TextPad
bharosa.uio.default.whatsthis.DeviceTextPad.title=Bruke TextPad: Instruksjoner

bharosa.uio.default.whatsthis.DeviceTextPad.whatsthis.title=Hva er dette?
bharosa.uio.default.whatsthis.DeviceTextPad.whatsthis.text1=TextPad er en virtuell enhet som gir avansert sikkerhetsbeskyttelse mot elektronisk identitetstyveri.
bharosa.uio.default.whatsthis.DeviceTextPad.whatsthis.text2=Med TextPad kan du angi passordet ved hjelp av det vanlige tastaturet. TextPad bidrar til \u00E5 beskytte deg mot at du gir fra deg sensitive opplysninger ved et uhell p\u00E5 et falskt Web-omr\u00E5de. 

bharosa.uio.default.whatsthis.DeviceTextPad.about.title=Om TextPad: Funksjoner for elektronisk sikkerhet
bharosa.uio.default.whatsthis.DeviceTextPad.about.text=Her finner du noen av de avanserte sikkerhetsfunksjonene til TextPad og svar p\u00E5 vanlige sp\u00F8rsm\u00E5l.

bharosa.uio.default.whatsthis.DeviceTextPad.about.question1=Hvorfor trenger jeg et personlig bilde og uttrykk?
bharosa.uio.default.whatsthis.DeviceTextPad.about.answer1=Textpad tilpasses med ditt eget bakgrunnsbilde og uttrykk. Denne personlige tilpasningen angir at det er trygt \u00E5 oppgi passordet. Fra n\u00E5 av b\u00F8r du aldri oppgi passordet ditt p\u00E5 Internett med mindre den tilpassede Textpad-enheten vises. Vi endrer aldri tilpasningen uten at du er informert.

bharosa.uio.default.whatsthis.DeviceTextPad.about.question2=Hva skyldes endringen?
bharosa.uio.default.whatsthis.DeviceTextPad.about.answer2=Vi pr\u00F8ver alltid \u00E5 gj\u00F8re Internett-opplevelsen tryggere. TextPad er bare \u00E9n av flere metoder vi bruker for \u00E5 forbedre sikkerheten p\u00E5 omr\u00E5det v\u00E5rt. 

bharosa.uio.default.whatsthis.DeviceTextPad.about.question3=Hva er form\u00E5let med datostempelet?
bharosa.uio.default.whatsthis.DeviceTextPad.about.answer3=Hver gang du ser Textpad-enheten, vil den ha nytt klokkeslett og ny dato. Dette er en sikkerhetsfunksjon for \u00E5 beskytte deg p\u00E5 Internett. F\u00F8r du angir passordet, m\u00E5 du kontrollere at klokkeslettet og datoen ikke er eldre enn 24 timer.


