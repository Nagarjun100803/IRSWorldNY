###  PinPad Description and Directions
bharosa.authentipad.pinpad.accessibility.description = PinPad
bharosa.authentipad.pinpad.accessibility.directions = Korzystanie z urz\u0105dzenia PinPad: Prosz\u0119 u\u017Cy\u0107 poni\u017Cszych \u0142\u0105czy do wprowadzenia liczbowego kodu PIN. Jako pierwszy jest wy\u015Bwietlany spersonalizowany tekst tytu\u0142u, po nim wyst\u0119puj\u0105 \u0142\u0105cza steruj\u0105ce, a nast\u0119pnie - \u0142\u0105cza cyfr. Po wprowadzeniu swojego liczbowego kodu PIN prosz\u0119 przej\u015B\u0107 za pomoc\u0105 klawiszy Shift-Tab do \u0142\u0105cza "Enter" w celu przes\u0142ania kodu.
