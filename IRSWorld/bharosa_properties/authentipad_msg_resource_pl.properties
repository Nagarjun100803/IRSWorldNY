###  KeyPad Description and Directions
bharosa.autehntipad.keypad.accessibility.description = KeyPad
bharosa.authentipad.keypad.accessibility.directions = Korzystanie z urz\u0105dzenia KeyPad: Prosz\u0119 u\u017Cy\u0107 poni\u017Cszych \u0142\u0105czy do wprowadzenia has\u0142a. Jako pierwszy jest wy\u015Bwietlany spersonalizowany tekst tytu\u0142u, po nim wyst\u0119puj\u0105 \u0142\u0105cza steruj\u0105ce, a nast\u0119pnie - \u0142\u0105cza klawiszy. Po wprowadzeniu swojego has\u0142a prosz\u0119 przej\u015B\u0107 za pomoc\u0105 klawiszy Shift-Tab do \u0142\u0105cza "Enter" w celu przes\u0142ania has\u0142a.
