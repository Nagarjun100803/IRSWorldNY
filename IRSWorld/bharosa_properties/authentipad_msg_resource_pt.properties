###  KeyPad Description and Directions
bharosa.autehntipad.keypad.accessibility.description = KeyPad
bharosa.authentipad.keypad.accessibility.directions = Instru\u00E7\u00F5es do KeyPad: Utilize as seguintes refer\u00EAncias para introduzir a senha. O texto personalizado da legenda \u00E9 apresentado em primeiro lugar, seguido pelas refer\u00EAncias de controlo, as quais ser\u00E3o seguidas pelas refer\u00EAncias de teclas. Assim que tiver introduzido a senha, utilize as teclas Shift-tabula\u00E7\u00E3o para regressar \u00E0 refer\u00EAncia de introdu\u00E7\u00E3o para apresentar a senha.
bharosa.authentipad.keypad.security.image.alt = Imagem do Dispositivo de Permiss\u00E3o de Acesso

###  PinPad Description and Directions
bharosa.authentipad.pinpad.accessibility.description = PinPad
bharosa.authentipad.pinpad.accessibility.directions = Instru\u00E7\u00F5es do PinPad: Utilize as seguintes refer\u00EAncias para introduzir o PIN num\u00E9rico. O texto personalizado da legenda \u00E9 apresentado em primeiro lugar, seguido pelas refer\u00EAncias de controlo, as quais ser\u00E3o seguidas pelas refer\u00EAncias num\u00E9ricas. Assim que tiver introduzido o PIN num\u00E9rico, utilize as teclas Shift-tabula\u00E7\u00E3o para regressar \u00E0 refer\u00EAncia de introdu\u00E7\u00E3o para apresentar o PIN.
bharosa.authentipad.pinpad.security.image.alt = Imagem do Dispositivo de Permiss\u00E3o de Acesso

###  TextPad Description and Directions
bharosa.authentipad.textpad.accessibility.description = TextPad
bharosa.authentipad.textpad.accessibility.directions = Instru\u00E7\u00F5es do TextPad: Utilize os seguintes itens para validar o dispositivo. O texto personalizado da legenda \u00E9 apresentado em primeiro lugar, seguido por uma indica\u00E7\u00E3o de data/hora para assegurar que o dispositivo foi gerado para a sess\u00E3o actual. Assim que tiver introduzido a senha no campo de entrada da senha anterior, utilize a tecla de tabula\u00E7\u00E3o para navegar para a refer\u00EAncia de introdu\u00E7\u00E3o para apresentar a senha.
bharosa.authentipad.textpad.security.image.alt = Imagem do Dispositivo de Permiss\u00E3o de Acesso

###  TextPadReset Description and Directions
bharosa.authentipad.textpadreset.accessibility.description = TextPad
bharosa.authentipad.textpadreset.accessibility.directions = Instru\u00E7\u00F5es do TextPad: Utilize os seguintes itens para introduzir a nova senha. O texto personalizado da legenda \u00E9 apresentado em primeiro lugar, seguido por um campo de entrada e confirma\u00E7\u00E3o da senha. Assim que tiver introduzido a senha, utilize a tecla de tabula\u00E7\u00E3o para navegar para a refer\u00EAncia de introdu\u00E7\u00E3o para apresentar a nova senha.
bharosa.authentipad.textpadreset.security.image.alt = Imagem do Dispositivo de Permiss\u00E3o de Acesso

###  CaptionPad Description and Directions
bharosa.authentipad.captionpad.accessibility.description = CaptionPad
bharosa.authentipad.captionpad.accessibility.directions = Instru\u00E7\u00F5es do CaptionPad: Utilize os seguintes itens para introduzir o novo texto da legenda. As refer\u00EAncias de controlo s\u00E3o apresentadas em primeiro lugar, seguidas por um campo de entrada de texto. Assim que tiver introduzido a legenda, utilize a tecla de tabula\u00E7\u00E3o para navegar para a refer\u00EAncia de introdu\u00E7\u00E3o para apresentar a nova legenda.
bharosa.authentipad.captionpad.security.image.alt = Imagem do Dispositivo de Permiss\u00E3o de Acesso

###  CaptionPadConfirm Description and Directions
bharosa.authentipad.captionconfirmpad.accessibility.description = CaptionConfirmPad
bharosa.authentipad.captionconfirmpad.accessibility.directions = Instru\u00E7\u00F5es do CaptionConfirmPad: Utilize os seguintes itens para analisar o texto da legenda. Se pretender editar o texto da legenda, utilize a tecla de tabula\u00E7\u00E3o para navegar para a refer\u00EAncia Editar e prima Enter.
bharosa.authentipad.captionconfirmpad.security.image.alt = Imagem do Dispositivo de Permiss\u00E3o de Acesso

###  QuestionPad Description and Directions
bharosa.authentipad.questionpad.accessibility.description = QuestionPad
bharosa.authentipad.questionpad.accessibility.directions = Instru\u00E7\u00F5es do QuestionPad: Utilize os seguintes itens para introduzir a resposta. A pergunta personalizada \u00E9 apresentada em primeiro lugar, seguida pela legenda personalizada, a qual ser\u00E1 seguida pelo campo de entrada da resposta. Assim que tiver introduzido a resposta, utilize a tecla de tabula\u00E7\u00E3o para navegar para a refer\u00EAncia de introdu\u00E7\u00E3o para apresentar a resposta.
bharosa.authentipad.questionpad.security.image.alt = Imagem do Dispositivo de Permiss\u00E3o de Acesso

###  QuizPad Description and Directions
bharosa.authentipad.quizpad.accessibility.description = QuizPad
bharosa.authentipad.quizpad.accessibility.directions = Instru\u00E7\u00F5es do QuizPad: Utilize os seguintes itens para seleccionar a resposta \u00E0 pergunta. O texto personalizado da legenda \u00E9 apresentado em primeiro lugar, seguido pelas refer\u00EAncias de resposta.
bharosa.authentipad.quizpad.security.image.alt = Imagem do Dispositivo de Permiss\u00E3o de Acesso
