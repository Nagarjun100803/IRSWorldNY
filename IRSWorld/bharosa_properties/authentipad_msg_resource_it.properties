###  KeyPad Description and Directions
bharosa.autehntipad.keypad.accessibility.description = KeyPad
bharosa.authentipad.keypad.accessibility.directions = Istruzioni per KeyPad: utilizzare i collegamenti seguenti per immettere la password. Viene riportato per primo il testo della didascalia personalizzata, seguito dai collegamenti di controllo e quindi dai collegamenti di chiave. Dopo aver immesso la password, utilizzare Maiusc-Tab per tornare al collegamento di immissione e sottomettere la password.
bharosa.authentipad.keypad.security.image.alt = Immagine dispositivo di sicurezza

###  PinPad Description and Directions
bharosa.authentipad.pinpad.accessibility.description = PinPad
bharosa.authentipad.pinpad.accessibility.directions = Istruzioni per PinPad: utilizzare i collegamenti seguenti per immettere il PIN numerico. Viene riportato per primo il testo della didascalia personalizzata, seguito dai collegamenti di controllo e quindi dai collegamenti numerici. Dopo aver immesso il PIN numerico, utilizzare Maiusc-Tab per tornare al collegamento di immissione e sottomettere il PIN.
bharosa.authentipad.pinpad.security.image.alt = Immagine dispositivo di sicurezza

###  TextPad Description and Directions
bharosa.authentipad.textpad.accessibility.description = TextPad
bharosa.authentipad.textpad.accessibility.directions = Istruzioni per TextPad: utilizzare gli elementi seguenti per convalidare il dispositivo. Viene riportato per primo il testo della didascalia personalizzata, seguito da un indicatore orario per garantire che il dispositivo sia stato generato per la sessione corrente. Dopo aver immesso la password nel campo di immissione precedente, utilizzare Tab per spostarsi al collegamento di immissione e sottomettere la password.
bharosa.authentipad.textpad.security.image.alt = Immagine dispositivo di sicurezza

###  TextPadReset Description and Directions
bharosa.authentipad.textpadreset.accessibility.description = TextPad
bharosa.authentipad.textpadreset.accessibility.directions = Istruzioni per TextPad: utilizzare gli elementi seguenti per immettere la nuova password. Viene riportato per primo il testo della didascalia personalizzata, seguito dal campo di inserimento della password e dal campo di conferma della password. Dopo aver immesso la password, utilizzare Tab per spostarsi al collegamento di immissione e sottomettere la password.
bharosa.authentipad.textpadreset.security.image.alt = Immagine dispositivo di sicurezza

###  CaptionPad Description and Directions
bharosa.authentipad.captionpad.accessibility.description = CaptionPad
bharosa.authentipad.captionpad.accessibility.directions = Istruzioni per CaptionPad: utilizzare gli elementi seguenti per immettere il testo della nuova didascalia. Vengono riportati per primi i collegamenti di controllo, seguiti da un campo di input del testo. Dopo aver immesso la didascalia, utilizzare Tab per spostarsi al collegamento di immissione e sottomettere la nuova didascalia.
bharosa.authentipad.captionpad.security.image.alt = Immagine dispositivo di sicurezza

###  CaptionPadConfirm Description and Directions
bharosa.authentipad.captionconfirmpad.accessibility.description = CaptionConfirmPad
bharosa.authentipad.captionconfirmpad.accessibility.directions = Istruzioni per CaptionConfirmPad: utilizzare gli elementi seguenti per rivedere il testo della didascalia. Se \u00E8 necessario correggere il testo, utilizzare Tab per spostarsi al collegamento di modifica e premere Invio.
bharosa.authentipad.captionconfirmpad.security.image.alt = Immagine dispositivo di sicurezza

###  QuestionPad Description and Directions
bharosa.authentipad.questionpad.accessibility.description = QuestionPad
bharosa.authentipad.questionpad.accessibility.directions = Istruzioni per QuestionPad: utilizzare gli elementi seguenti per immettere la risposta. Viene riportata per prima la domanda personalizzata, seguita dalla didascalia personalizzata e dal campo di input della risposta. Dopo aver immesso la risposta, utilizzare Tab per spostarsi al collegamento di immissione e sottomettere la risposta.
bharosa.authentipad.questionpad.security.image.alt = Immagine dispositivo di sicurezza

###  QuizPad Description and Directions
bharosa.authentipad.quizpad.accessibility.description = QuizPad
bharosa.authentipad.quizpad.accessibility.directions = Istruzioni per QuizPad: utilizzare gli elementi seguenti per selezionare la risposta alla domanda. Viene riportato per primo il testo della didascalia personalizzata, seguito dai collegamenti di risposta.
bharosa.authentipad.quizpad.security.image.alt = Immagine dispositivo di sicurezza
