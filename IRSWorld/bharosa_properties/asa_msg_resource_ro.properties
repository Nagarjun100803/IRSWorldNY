bharosa.uio.default.whatsthis.DevicePinPad.bullet.enum.one.text=Utiliza\u0163i mouse-ul pentru a face clic pe butoanele de pe panoul pentru pin \u015Fi introduce\u0163i codul pin, apoi face\u0163i clic pe Introducere.

