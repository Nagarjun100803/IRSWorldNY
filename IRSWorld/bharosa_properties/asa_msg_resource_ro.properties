bharosa.uio.default.register.info.section2.message=Ve\u0163i \u00EEnregistra trei \u00EEntreb\u0103ri de securitate pentru a ad\u0103uga un alt strat de securitate. Pe viitor, v\u0103 vom pune una dintre aceste \u00EEntreb\u0103ri utiliz\u00E2nd dispozitivul dvs. personalizat \u00EEn cazul \u00EEn care o situa\u0163ie pare riscant\u0103. Aceste \u00EEntreb\u0103ri \u015Fi r\u0103spunsuri trebuie p\u0103strate secrete la fel ca \u015Fi parola dvs.

