bharosa.uio.default.register.info.section1.message=Noile dvs. dispozitive de securitate personalizate v\u0103 vor oferi protec\u0163ie \u00EEn timpul opera\u0163iilor bancare online. Informa\u0163iile introduse sunt protejate \u00EEmpotriva numeroaselor amenin\u0163\u0103ri de securitate existente \u00EEn zilele noastre. \u00CEn acela\u015Fi timp, imaginea, expresia \u015Fi data reprezint\u0103 dovada faptului c\u0103 v\u0103 afla\u0163i pe site-ul nostru oficial.

