bharosa.uio.default.whatsthis.DeviceTextPad.pagetitle=Despre panoul pentru text
bharosa.uio.default.whatsthis.DeviceTextPad.title=Utilizarea panoului pentru text: Indica\u0163ii

bharosa.uio.default.whatsthis.DeviceTextPad.whatsthis.title=Ce este aceata?
bharosa.uio.default.whatsthis.DeviceTextPad.whatsthis.text1=Panoul pentru text este un dispozitiv virtual care v\u0103 ofer\u0103 protec\u0163ie de securitate avansat\u0103 \u00EEmpotriva furtului de identitate online.
bharosa.uio.default.whatsthis.DeviceTextPad.whatsthis.text2=Panoul pentru text v\u0103 permite s\u0103 introduce\u0163i parola dvs. utiliz\u00E2nd tastatura normal\u0103. Panoul pentru text v\u0103 protejeaz\u0103 impotriva introducerii accidentale de informa\u0163ii sensibile pe un site web fraudulos.

bharosa.uio.default.whatsthis.DeviceTextPad.about.title=Despre panoul pentru text: Caracteristici de securitate online
bharosa.uio.default.whatsthis.DeviceTextPad.about.text=V\u0103 prezent\u0103m c\u00E2teva caracteristici de securitate avansate asociate cu panoul pentru text, precum \u015Fi r\u0103spunsuri la cele mai frecvente \u00EEntreb\u0103ri.

bharosa.uio.default.whatsthis.DeviceTextPad.about.question1=De ce am nevoie de o imagine \u015Fi o expresie personale?
bharosa.uio.default.whatsthis.DeviceTextPad.about.answer1=Panoul pentru text este personalizat cu imaginea \u015Fi expresia dvs. de fundal. Aceast\u0103 personalizare v\u0103 asigur\u0103 c\u0103 pute\u0163i introduce parola dvs. \u00EEn siguran\u0163\u0103. De acum \u00EEnainte, nu mai introduce\u0163i niciodat\u0103 parola dvs. online \u00EEnainte de a vizualiza panoul dvs. personalizat pentru text. Nu vom schimba niciodat\u0103 personalizarea f\u0103r\u0103 a v\u0103 aduce la cuno\u015Ftin\u0163\u0103 acest lucru.

bharosa.uio.default.whatsthis.DeviceTextPad.about.question2=De ce a fost necesar\u0103 schimbarea?
bharosa.uio.default.whatsthis.DeviceTextPad.about.answer2=C\u0103ut\u0103m \u00EEn permanen\u0163\u0103 metode pentru a face mai sigur\u0103 experien\u0163a dvs. online. Panoul pentru text este doar una dintre numeroasele m\u0103suri pe care le lu\u0103m pentru a v\u0103 spori securitatea pe site-ul nostru.

bharosa.uio.default.whatsthis.DeviceTextPad.about.question3=Ce reprezint\u0103 data \u00EEmprosp\u0103t\u0103rii?
bharosa.uio.default.whatsthis.DeviceTextPad.about.answer3=La fiecare afi\u015Fare a panoului pentru text, acesta va avea o dat\u0103 \u015Fi o or\u0103 noi. Aceasta este \u00EEnc\u0103 o caracteristic\u0103 de securitate pentru siguran\u0163a dvs. online. \u00CEnainte de a introduce parola asigura\u0163i-v\u0103 c\u0103 data \u015Fi ora nu sunt mai vechi de 24 de ore.


