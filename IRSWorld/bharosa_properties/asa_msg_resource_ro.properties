bharosa.uio.default.whatsthis.DeviceKeyPadFull.pagetitle=Despre panoul pentru parol\u0103
bharosa.uio.default.whatsthis.DeviceKeyPadFull.title=Utilizarea panoului pentru parol\u0103: Indica\u0163ii

bharosa.uio.default.whatsthis.DeviceKeyPadFull.whatsthis.title=Ce este acesta?
bharosa.uio.default.whatsthis.DeviceKeyPadFull.whatsthis.text1=Panoul pentru parol\u0103 este un dispozitiv virtual care v\u0103 ofer\u0103 protec\u0163ie de securitate avansat\u0103 \u00EEmpotriva furtului de identitate online.
bharosa.uio.default.whatsthis.DeviceKeyPadFull.whatsthis.text2=Panoul pentru parol\u0103 v\u0103 permite s\u0103 introduce\u0163i parola f\u0103c\u00E2nd clic de c\u00E2teva ori cu mouse-ul, \u00EEn loc s\u0103 o tasta\u0163i. Acest lucru v\u0103 protejeaz\u0103 \u00EEmpotriva unor diverse amenin\u0163\u0103ri online.

bharosa.uio.default.whatsthis.DeviceKeyPadFull.about.title=Despre panoul pentru parol\u0103: Caracteristici de securitate online
bharosa.uio.default.whatsthis.DeviceKeyPadFull.about.text=V\u0103 prezent\u0103m c\u00E2teva caracteristici de securitate avansate asociate cu panoul pentru parol\u0103, precum \u015Fi r\u0103spunsuri la cele mai frecvente \u00EEntreb\u0103ri.

bharosa.uio.default.whatsthis.DeviceKeyPadFull.about.question1=De ce am nevoie de o imagine \u015Fi o expresie personale?
bharosa.uio.default.whatsthis.DeviceKeyPadFull.about.answer1=Panoul pentru parol\u0103 este personalizat cu imaginea \u015Fi expresia dvs. de fundal. Aceast\u0103 personalizare v\u0103 confirm\u0103 c\u0103 este sigur s\u0103 introduce\u0163i parola. De acum \u00EEnainte, nu mai introduce\u0163i niciodat\u0103 parola online \u00EEnainte de a vizualiza panoul dvs. personalizat pentru parol\u0103. Nu vom schimba niciodat\u0103 personalizarea f\u0103r\u0103 a v\u0103 aduce la cuno\u015Ftin\u0163\u0103 acest lucru.

bharosa.uio.default.whatsthis.DeviceKeyPadFull.about.question2=De ce se mut\u0103 tastele?
bharosa.uio.default.whatsthis.DeviceKeyPadFull.about.answer2=Ca m\u0103sur\u0103 de securitate suplimentar\u0103, tastele de pe panoul pentru parol\u0103 \u00EE\u015Fi schimb\u0103 loca\u0163ia \u00EEn cadru la fiecare conectare.

bharosa.uio.default.whatsthis.DeviceKeyPadFull.about.question3=Ce reprezint\u0103 data \u00EEmprosp\u0103t\u0103rii?
bharosa.uio.default.whatsthis.DeviceKeyPadFull.about.answer3=La fiecare afi\u015Fare a panoului pentru parol\u0103, acesta va avea o dat\u0103 \u015Fi o or\u0103 noi. Aceasta este \u00EEnc\u0103 o caracteristic\u0103 de securitate pentru siguran\u0163a dvs. online. \u00CEnainte de a introduce parola, asigura\u0163i-v\u0103 c\u0103 data \u015Fi ora nu sunt mai vechi de 24 de ore.


