bharosa.uio.default.whatsthis.DeviceKeyPadAlpha.bullet.enum.two.text=B\u00FCy\u00FCk harf girmek i\u00E7in Caps d\u00FC\u011Fmesine t\u0131klay\u0131n. Caps tu\u015Funa ikinci kez t\u0131klad\u0131\u011F\u0131n\u0131zda kilitlenir, \u00FC\u00E7\u00FCnc\u00FC kez t\u0131klad\u0131\u011F\u0131n\u0131zda k\u00FC\u00E7\u00FCk harfe d\u00F6ner.

