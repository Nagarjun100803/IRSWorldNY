bharosa.uio.default.whatsthis.DeviceQuestionPad.about.question2=Neden de\u011Fi\u015Fti?
bharosa.uio.default.whatsthis.DeviceQuestionPad.about.answer2=Her zaman \u00E7evrimi\u00E7i i\u015Flemlerinizi daha g\u00FCvenli hale getirmenin yollar\u0131n\u0131 arar\u0131z. QuestionPad, sitemizdeyken g\u00FCvenli\u011Finizi art\u0131rmak i\u00E7in ald\u0131\u011F\u0131m\u0131z pek \u00E7ok \u00F6nlemden sadece biridir.

