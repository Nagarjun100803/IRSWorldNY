bharosa.uio.default.messages.enum.wherepassword.name=Parolam\u0131 nereye girmeliyim?
bharosa.uio.default.messages.enum.wherepassword.description=\u00C7evrimi\u00E7i bankac\u0131l\u0131k i\u015Flemlerinizde sizi daha iyi koruyabilmek i\u00E7in g\u00FCvenli\u011Fimizi geli\u015Ftirdik. \u015Eu andan itibaren, \u00F6nce kullan\u0131c\u0131 ad\u0131n\u0131z\u0131 gireceksiniz, sonra da ayr\u0131 bir sayfada parolan\u0131z\u0131 gireceksiniz.

bharosa.uio.default.messages.enum.notimage.name=Sizin resminiz ve metniniz de\u011Fil mi?
bharosa.uio.default.messages.enum.notimage.description=Size g\u00F6r\u00FCnt\u00FClenen cihaz resminiz ve metninizle ki\u015Fiselle\u015Ftirilmemi\u015Fse, l\u00FCtfen kullan\u0131c\u0131 ad\u0131n\u0131z\u0131 do\u011Fru girip girmedi\u011Finizi kontrol edin. Kullan\u0131c\u0131 ad\u0131n\u0131z\u0131 do\u011Fru girdi\u011Finiz halde ki\u015Fiselle\u015Ftirilmi\u015F cihaz\u0131n\u0131z\u0131 g\u00F6remiyorsan\u0131z, l\u00FCtfen m\u00FC\u015Fteri hizmetlerine ba\u015Fvurun. Te\u015Fekk\u00FCr ederiz.

bharosa.uio.default.messages.enum.forgotanswer.name=Yan\u0131t\u0131n\u0131z\u0131 m\u0131 unuttunuz?
bharosa.uio.default.messages.enum.forgotanswer.description=Se\u00E7ti\u011Finiz sorular\u0131n yan\u0131tlar\u0131n\u0131 unuttuysan\u0131z, l\u00FCtfen m\u00FC\u015Fteri hizmetlerine ba\u015Fvurun. Te\u015Fekk\u00FCr ederiz.


