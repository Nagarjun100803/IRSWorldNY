bharosa.uio.default.whatsthis.DeviceKeyPadAlpha.bullet.enum.one.description=KeyPad \u0130\u015Fareti 1
bharosa.uio.default.whatsthis.DeviceKeyPadAlpha.bullet.enum.one.text=Fareyle KeyPad'deki d\u00FC\u011Fmelere t\u0131klayarak parolan\u0131z\u0131 girin ve Enter'a t\u0131klay\u0131n.

