bharosa.uio.default.whatsthis.DeviceTextPad.pagetitle=TextPad Hakk\u0131nda
bharosa.uio.default.whatsthis.DeviceTextPad.title=TextPad'i Kullanma: A\u00E7\u0131klamalar

bharosa.uio.default.whatsthis.DeviceTextPad.whatsthis.title=Bu Nedir?
bharosa.uio.default.whatsthis.DeviceTextPad.whatsthis.text1=TextPad, \u00E7evrimi\u00E7i kimlik h\u0131rs\u0131zl\u0131\u011F\u0131na kar\u015F\u0131 geli\u015Fmi\u015F koruma sa\u011Flayan bir sanal ara\u00E7t\u0131r.
bharosa.uio.default.whatsthis.DeviceTextPad.whatsthis.text2=TextPad, parolan\u0131z\u0131 normal klavyenizi kullanarak girmenize olanak tan\u0131r. TextPad, sizi sahte bir Web sitesine yanl\u0131\u015Fl\u0131kla hassas bilgilerinizi girmekten korur.

bharosa.uio.default.whatsthis.DeviceTextPad.about.title=TextPad Hakk\u0131nda: \u00C7evrimi\u00E7i G\u00FCvenlik \u00D6zellikleri
bharosa.uio.default.whatsthis.DeviceTextPad.about.text=Burada TextPad ile ilgili baz\u0131 geli\u015Fmi\u015F \u00F6zellikler ve s\u0131k sorulan sorulara yan\u0131tlar yer almaktad\u0131r.

bharosa.uio.default.whatsthis.DeviceTextPad.about.question1=Ki\u015Fisel bir resim ve metin neden gerekli?
bharosa.uio.default.whatsthis.DeviceTextPad.about.answer1=TextPad'i kendi arka plan resminiz ve metninizle tamamen ki\u015Fiselle\u015Ftirin. Bu ki\u015Fiselle\u015Ftirme parolan\u0131z\u0131 g\u00FCvenle girebilece\u011Finizin sigortas\u0131d\u0131r. Bu andan itibaren, ki\u015Fiselle\u015Ftirilmi\u015F TextPad'iniz sunulmad\u0131\u011F\u0131 s\u00FCrece, \u00E7evrimi\u00E7i durumdayken parolan\u0131z\u0131 girmeyin. Ki\u015Fiselle\u015Ftirdi\u011Finiz \u00F6\u011Feler bilginiz olmadan de\u011Fi\u015Ftirilmeyecektir.

bharosa.uio.default.whatsthis.DeviceTextPad.about.question2=Neden de\u011Fi\u015Fti?
bharosa.uio.default.whatsthis.DeviceTextPad.about.answer2=Her zaman \u00E7evrimi\u00E7i i\u015Flemlerinizi daha g\u00FCvenli hale getirmenin yollar\u0131n\u0131 arar\u0131z. TextPad, sitemizdeyken g\u00FCvenli\u011Finizi art\u0131rmak i\u00E7in ald\u0131\u011F\u0131m\u0131z pek \u00E7ok \u00F6nlemden sadece biridir.

bharosa.uio.default.whatsthis.DeviceTextPad.about.question3=Yenileme tarihi ne i\u00E7in kullan\u0131l\u0131r?
bharosa.uio.default.whatsthis.DeviceTextPad.about.answer3=TextPad'i size her sunu\u015Fumuzda yeni bir saat ve tarih veririz. Bu, \u00E7evrimi\u00E7i g\u00FCvenli\u011Finizi sa\u011Flamak kullan\u0131lan bir ba\u015Fka g\u00FCvenlik \u00F6nlemidir. Parolan\u0131z\u0131 girmeden \u00F6nce, tarih ve saatin 24 saatten \u00F6nce olmad\u0131\u011F\u0131ndan emin olun.


