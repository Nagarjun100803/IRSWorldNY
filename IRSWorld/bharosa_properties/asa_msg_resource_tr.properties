bharosa.uio.default.whatsthis.DeviceKeyPadFull.whatsthis.title=Bu Nedir?
bharosa.uio.default.whatsthis.DeviceKeyPadFull.whatsthis.text1=KeyPad, \u00E7evrimi\u00E7i kimlik h\u0131rs\u0131zl\u0131\u011F\u0131na kar\u015F\u0131 geli\u015Fmi\u015F koruma sa\u011Flayan bir sanal ara\u00E7t\u0131r.
bharosa.uio.default.whatsthis.DeviceKeyPadFull.whatsthis.text2=KeyPad, klavyenizi kullanarak tu\u015Flamak yerine fareyle birka\u00E7 t\u0131klamayla parolan\u0131z\u0131 girmenize olanak sa\u011Flar. Bu \u00F6zellik sizi pek \u00E7ok \u00E7evrimi\u00E7i tehditten korur.

bharosa.uio.default.whatsthis.DeviceKeyPadFull.about.title=KeytPad Hakk\u0131nda: \u00C7evrimi\u00E7i G\u00FCvenlik \u00D6zellikleri
bharosa.uio.default.whatsthis.DeviceKeyPadFull.about.text=Burada KeytPad ile ilgili baz\u0131 geli\u015Fmi\u015F \u00F6zellikler ve s\u0131k sorulan sorulara yan\u0131tlar yer almaktad\u0131r.

bharosa.uio.default.whatsthis.DeviceKeyPadFull.about.question1=Ki\u015Fisel bir resim ve metin neden gerekli?
bharosa.uio.default.whatsthis.DeviceKeyPadFull.about.answer1=KeyPad'i kendi arka plan resminiz ve metninizle tamamen ki\u015Fiselle\u015Ftirin. Bu ki\u015Fiselle\u015Ftirme parolan\u0131z\u0131 g\u00FCvenle girebilece\u011Finizin sigortas\u0131d\u0131r. Bu andan itibaren, ki\u015Fiselle\u015Ftirilmi\u015F KeyPad'iniz sunulmad\u0131\u011F\u0131 s\u00FCrece, \u00E7evrimi\u00E7i durumdayken parolan\u0131z\u0131 girmeyin. Ki\u015Fiselle\u015Ftirdi\u011Finiz \u00F6\u011Feler bilginiz olmadan de\u011Fi\u015Ftirilmeyecektir.

bharosa.uio.default.whatsthis.DeviceKeyPadFull.about.question2=Tu\u015Flar\u0131n yeri neden de\u011Fi\u015Fiyor?
bharosa.uio.default.whatsthis.DeviceKeyPadFull.about.answer2=Ek bir g\u00FCvenlik \u00F6nlemi olarak, her oturum a\u00E7t\u0131\u011F\u0131n\u0131zda KeyPad'deki tu\u015Flar \u00E7er\u00E7evede farkl\u0131 bir yere ta\u015F\u0131n\u0131r.

bharosa.uio.default.whatsthis.DeviceKeyPadFull.about.question3=Yenileme tarihi ne i\u00E7in kullan\u0131l\u0131r?
bharosa.uio.default.whatsthis.DeviceKeyPadFull.about.answer3=KeyPad'i size her sunu\u015Fumuzda yeni bir saat ve tarih veririz. Bu, \u00E7evrimi\u00E7i g\u00FCvenli\u011Finizi sa\u011Flamak kullan\u0131lan bir ba\u015Fka g\u00FCvenlik \u00F6nlemidir. Parolan\u0131z\u0131 girmeden \u00F6nce, tarih ve saatin 24 saatten \u00F6nce olmad\u0131\u011F\u0131ndan emin olun.


