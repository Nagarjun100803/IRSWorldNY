bharosa.uio.default.register.info.section2.message=\u60A8\u5C07\u9700\u8981\u8A3B\u518A 3 \u500B\u5B89\u5168\u554F\u984C, \u4EE5\u589E\u52A0\u53E6\u4E00\u5C64\u7684\u5B89\u5168\u4FDD\u8B77. \u5982\u679C\u672A\u4F86\u767C\u751F\u4F3C\u4E4E\u6709\u5371\u96AA\u7684\u60C5\u6CC1, \u6211\u5011\u5C07\u4F7F\u7528\u60A8\u7684\u500B\u4EBA\u5316\u88DD\u7F6E, \u8A62\u554F\u60A8\u9019 3 \u500B\u554F\u984C\u4E2D\u7684\u5176\u4E2D\u4E00\u500B\u554F\u984C. \u5C31\u50CF\u60A8\u7684\u5BC6\u78BC\u4E00\u6A23, \u8ACB\u5C07\u9019\u4E9B\u554F\u984C\u548C\u56DE\u7B54\u78BA\u5BE6\u4FDD\u5BC6.

