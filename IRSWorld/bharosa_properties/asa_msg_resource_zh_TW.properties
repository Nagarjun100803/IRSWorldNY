bharosa.uio.default.register.info.title=\u60A8\u7684\u65B0\u5B89\u5168\u8A2D\u5B9A\u6A94
bharosa.uio.default.register.info.message=\u60A8\u53EF\u4EE5\u900F\u904E\u8A2D\u5B9A\u60A8\u7684\u65B0\u5B89\u5168\u8A2D\u5B9A\u6A94, \u589E\u5F37\u60A8\u7684\u7DDA\u4E0A\u4FDD\u8B77.<br>\u65B0\u7684\u5B89\u5168\u8A2D\u5B9A\u6A94\u6703\u5728\u60A8\u7684\u5E33\u6236\u52A0\u4E0A\u65B0\u7684\u5B89\u5168\u5C64, \u5E6B\u52A9\u6211\u5011\u8FA8\u8B58\u60A8, \u4E5F\u5E6B\u52A9\u60A8\u8FA8\u8B58\u6211\u5011\u7684\u7DB2\u7AD9.

bharosa.uio.default.register.info.section1.title=\u6B65\u9A5F 1: \u5B89\u5168\u5F71\u50CF\u548C\u6587\u5B57\u5167\u5BB9
bharosa.uio.default.register.info.section1.subtitle=\u589E\u5F37\u8CC7\u6599\u5B89\u5168
bharosa.uio.default.register.info.section1.message=\u60A8\u7684\u65B0\u500B\u4EBA\u5316\u5B89\u5168\u88DD\u7F6E\u5C07\u5728\u60A8\u9032\u884C\u7DDA\u4E0A\u9280\u884C\u696D\u52D9\u6642\u4FDD\u8B77\u60A8. \u60A8\u6240\u8F38\u5165\u7684\u8CC7\u8A0A\u6703\u53D7\u5230\u56B4\u5BC6\u7684\u4FDD\u8B77, \u514D\u65BC\u53D7\u5230\u7576\u4ECA\u8A31\u591A\u5B89\u5168\u4E0A\u7684\u5A01\u8105. \u540C\u6642, \u85C9\u7531\u5F71\u50CF, \u6587\u5B57\u5167\u5BB9\u548C\u65E5\u671F, \u8B49\u660E\u60A8\u78BA\u5BE6\u767B\u5165\u6211\u5011\u7684\u5B98\u65B9\u7DB2\u7AD9.

