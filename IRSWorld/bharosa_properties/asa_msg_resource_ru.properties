bharosa.uio.default.whatsthis.DeviceQuestionPad.about.answer1=Questionpad \u043E\u0442\u043E\u0431\u0440\u0430\u0436\u0430\u0435\u0442 \u0432 \u043A\u0430\u0447\u0435\u0441\u0442\u0432\u0435 \u0444\u043E\u043D\u0430 \u0412\u0430\u0448\u0435 \u0438\u043D\u0434\u0438\u0432\u0438\u0434\u0443\u0430\u043B\u044C\u043D\u043E\u0435 \u0438\u0437\u043E\u0431\u0440\u0430\u0436\u0435\u043D\u0438\u0435 \u0438 \u0444\u0440\u0430\u0437\u0443. \u0422\u0430\u043A\u0430\u044F \u0438\u043D\u0434\u0438\u0432\u0438\u0434\u0443\u0430\u043B\u044C\u043D\u0430\u044F \u043D\u0430\u0441\u0442\u0440\u043E\u0439\u043A\u0430 \u044F\u0432\u043B\u044F\u0435\u0442\u0441\u044F \u0433\u0430\u0440\u0430\u043D\u0442\u0438\u0435\u0439 \u0442\u043E\u0433\u043E, \u0447\u0442\u043E \u0432\u0432\u043E\u0434 \u043E\u0442\u0432\u0435\u0442\u043E\u0432 \u043D\u0430 \u0437\u0430\u0449\u0438\u0442\u043D\u044B\u0435 \u0432\u043E\u043F\u0440\u043E\u0441\u044B \u044F\u0432\u043B\u044F\u0435\u0442\u0441\u044F \u0431\u0435\u0437\u043E\u043F\u0430\u0441\u043D\u044B\u043C. \u0421 \u044D\u0442\u043E\u0433\u043E \u043C\u043E\u043C\u0435\u043D\u0442\u0430 \u0438 \u0434\u0430\u043B\u0435\u0435 \u043D\u0438\u043A\u043E\u0433\u0434\u0430 \u043D\u0435 \u043F\u0435\u0440\u0435\u0434\u0430\u0432\u0430\u0439\u0442\u0435 \u043F\u043E \u0441\u0435\u0442\u0438 \u0441\u0432\u043E\u0438 \u043E\u0442\u0432\u0435\u0442\u044B, \u0435\u0441\u043B\u0438 \u043D\u0435 \u043E\u0442\u043E\u0431\u0440\u0430\u0436\u0430\u0435\u0442\u0441\u044F \u0438\u043D\u0434\u0438\u0432\u0438\u0434\u0443\u0430\u043B\u044C\u043D\u043E \u043D\u0430\u0441\u0442\u0440\u043E\u0435\u043D\u043D\u044B\u0439 \u0434\u043B\u044F \u0412\u0430\u0441 QuestionPad. \u041C\u044B \u043D\u0435 \u0438\u0437\u043C\u0435\u043D\u044F\u0435\u043C \u0438\u043D\u0434\u0438\u0432\u0438\u0434\u0443\u0430\u043B\u044C\u043D\u0443\u044E \u043D\u0430\u0441\u0442\u0440\u043E\u0439\u043A\u0443 \u0431\u0435\u0437 \u0412\u0430\u0448\u0435\u0433\u043E \u0432\u0435\u0434\u043E\u043C\u0430.

bharosa.uio.default.whatsthis.DeviceQuestionPad.about.question2=\u0414\u043B\u044F \u0447\u0435\u0433\u043E \u043D\u0443\u0436\u043D\u044B \u0438\u0437\u043C\u0435\u043D\u0435\u043D\u0438\u044F?
bharosa.uio.default.whatsthis.DeviceQuestionPad.about.answer2=\u041C\u044B \u043F\u043E\u0441\u0442\u043E\u044F\u043D\u043D\u043E \u0438\u0449\u0435\u043C \u0441\u043F\u043E\u0441\u043E\u0431\u044B \u0441\u0434\u0435\u043B\u0430\u0442\u044C \u0412\u0430\u0448\u0443 \u0440\u0430\u0431\u043E\u0442\u0443 \u043F\u043E \u0441\u0435\u0442\u0438 \u0431\u043E\u043B\u0435\u0435 \u0431\u0435\u0437\u043E\u043F\u0430\u0441\u043D\u043E\u0439. QuestionPad - \u044D\u0442\u043E \u043B\u0438\u0448\u044C \u043E\u0434\u043D\u0430 \u0438\u0437 \u043C\u043D\u043E\u0433\u043E\u0447\u0438\u0441\u043B\u0435\u043D\u043D\u044B\u0445 \u043C\u0435\u0440, \u043A\u043E\u0442\u043E\u0440\u044B\u0435 \u043C\u044B \u043F\u0440\u0435\u0434\u043F\u0440\u0438\u043D\u0438\u043C\u0430\u0435\u043C \u0434\u043B\u044F \u043E\u0431\u0435\u0441\u043F\u0435\u0447\u0435\u043D\u0438\u044F \u0412\u0430\u0448\u0435\u0439 \u0437\u0430\u0449\u0438\u0442\u044B \u043F\u0440\u0438 \u0440\u0430\u0431\u043E\u0442\u0435 \u0441 \u043D\u0430\u0448\u0438\u043C web-\u0443\u0437\u043B\u043E\u043C.

bharosa.uio.default.whatsthis.DeviceQuestionPad.about.question3=\u0414\u043B\u044F \u0447\u0435\u0433\u043E \u0442\u0440\u0435\u0431\u0443\u0435\u0442\u0441\u044F \u0434\u0430\u0442\u0430 \u0430\u043A\u0442\u0443\u0430\u043B\u044C\u043D\u043E\u0441\u0442\u0438?
