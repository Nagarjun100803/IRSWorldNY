###  KeyPad Description and Directions
bharosa.autehntipad.keypad.accessibility.description = KeyPad
bharosa.authentipad.keypad.accessibility.directions = Instrucciones de KeyPad: Utilice los siguientes enlaces para introducir su contrase\u00F1a. El texto del t\u00EDtulo personalizado aparecer\u00E1 primero y, a continuaci\u00F3n, se mostrar\u00E1n los enlaces de control, que aparecen antes de los enlaces clave. Cuando haya introducido la contrase\u00F1a, utilice el tabulador y la tecla May\u00FAs para volver al enlace para introducir la contrase\u00F1a.
bharosa.authentipad.keypad.security.image.alt = Imagen del Dispositivo de Seguridad

###  PinPad Description and Directions
bharosa.authentipad.pinpad.accessibility.description = PinPad
bharosa.authentipad.pinpad.accessibility.directions = Instrucciones de PinPad: Utilice los siguientes enlaces para introducir el PIN num\u00E9rico. El texto del t\u00EDtulo personalizado aparecer\u00E1 primero y, a continuaci\u00F3n, se mostrar\u00E1n los enlaces de control, que aparecen antes de los enlaces num\u00E9ricos. Cuando haya introducido el PIN num\u00E9rico, utilice el tabulador y la tecla May\u00FAs para volver al enlace para introducir el PIN.
bharosa.authentipad.pinpad.security.image.alt = Imagen del Dispositivo de Seguridad

###  TextPad Description and Directions
bharosa.authentipad.textpad.accessibility.description = TextPad
bharosa.authentipad.textpad.accessibility.directions = Instrucciones de TextPad: Utilice los siguientes elementos para validar el dispositivo. El texto del t\u00EDtulo personalizado aparecer\u00E1 primero y, a continuaci\u00F3n, se mostrar\u00E1 el registro de hora para asegurarse de que el dispositivo se ha generado para esta sesi\u00F3n. Cuando haya introducido la contrase\u00F1a en el campo de introducci\u00F3n de contrase\u00F1a anterior, utilice el tabulador para desplazarse al enlace para introducir la contrase\u00F1a.
bharosa.authentipad.textpad.security.image.alt = Imagen del Dispositivo de Seguridad

###  TextPadReset Description and Directions
bharosa.authentipad.textpadreset.accessibility.description = TextPad
bharosa.authentipad.textpadreset.accessibility.directions = Instrucciones de TextPad: Utilice los siguientes elementos para introducir la nueva contrase\u00F1a. El texto del t\u00EDtulo personalizado aparecer\u00E1 primero y, a continuaci\u00F3n, se mostrar\u00E1 un campo de introducci\u00F3n de contrase\u00F1a y un campo de confirmaci\u00F3n de contrase\u00F1a. Cuando haya introducido la contrase\u00F1a, utilice el tabulador para desplazarse al enlace para introducir la contrase\u00F1a.
bharosa.authentipad.textpadreset.security.image.alt = Imagen del Dispositivo de Seguridad

###  CaptionPad Description and Directions
