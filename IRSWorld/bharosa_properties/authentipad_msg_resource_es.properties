bharosa.authentipad.captionpad.accessibility.directions = Instrucciones de CaptionPad: Utilice los siguientes elementos para introducir el nuevo texto de t\u00EDtulo. Los enlaces de control aparecen primero y, a continuaci\u00F3n, se mostrar\u00E1 un campo de introducci\u00F3n de texto. Cuando haya introducido el t\u00EDtulo, utilice el tabulador para desplazarse al enlace para introducir el nuevo t\u00EDtulo.
bharosa.authentipad.captionpad.security.image.alt = Imagen del Dispositivo de Seguridad

