bharosa.uio.default.register.info.section2.subtitle=Zus\u00E4tzliche Sicherheitsebene
bharosa.uio.default.register.info.section2.message=Sie registrieren drei Sicherheitsfragen, um eine weitere Sicherheitsebene hinzuzuf\u00FCgen. K\u00FCnftig wird Ihnen mit dem pers\u00F6nlichen Ger\u00E4t eine der Fragen gestellt, wenn eine Situation als risikoreich eingestuft wird. Diese Fragen und Antworten sollten wie Ihr Kennwort geheim gehalten werden.

