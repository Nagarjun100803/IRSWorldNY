bharosa.uio.default.whatsthis.DeviceTextPad.pagetitle=Info zu TextPad
bharosa.uio.default.whatsthis.DeviceTextPad.title=Verwendung von TextPad: Anleitungen

bharosa.uio.default.whatsthis.DeviceTextPad.whatsthis.title=Was ist das?
bharosa.uio.default.whatsthis.DeviceTextPad.whatsthis.text1=TextPad ist eine virtuelle Vorrichtung mit erweitertem Schutz vor Online-Identit\u00E4tsbetrug.
bharosa.uio.default.whatsthis.DeviceTextPad.whatsthis.text2=Mit TextPad k\u00F6nnen Sie das Kennwort mit der normalen Tastatur eingeben. TextPad sch\u00FCtzt Sie davor, wesentliche Daten versehentlich auf einer betr\u00FCgerischen Website einzugeben.

bharosa.uio.default.whatsthis.DeviceTextPad.about.title=Info zu TextPad: Online-Sicherheitsfunktionen
bharosa.uio.default.whatsthis.DeviceTextPad.about.text=Hier finden Sie einige der erweiterten Sicherheitsfunktionen von TextPad sowie Antworten auf h\u00E4ufig gestellte Fragen.

bharosa.uio.default.whatsthis.DeviceTextPad.about.question1=Warum brauche ich ein pers\u00F6nliches Bild und eine pers\u00F6nliche Phrase?
bharosa.uio.default.whatsthis.DeviceTextPad.about.answer1=TextPad ist mit Ihrem pers\u00F6nlichen Hintergrundbild und Ihrer Phrase ausgestattet. Diese Personalisierung gew\u00E4hrleistet, dass Sie das Kennwort sicher eingeben k\u00F6nnen. Geben Sie das Kennwort ab jetzt nur dann online ein, wenn Ihr pers\u00F6nliches TextPad angezeigt wird. Wir \u00E4ndern Ihre pers\u00F6nliche Darstellung nie ohne Ihr Wissen.

bharosa.uio.default.whatsthis.DeviceTextPad.about.question2=Warum wurde diese \u00C4nderung vorgenommen?
bharosa.uio.default.whatsthis.DeviceTextPad.about.answer2=Wir versuchen stets, Ihre Online-T\u00E4tigkeiten sicherer zu gestalten. TextPad ist nur eine der zahlreichen Ma\u00DFnahmen, mit denen wir Ihre Sicherheit auf unserer Site verbessern.

bharosa.uio.default.whatsthis.DeviceTextPad.about.question3=Wozu dient das Aktualisierungsdatum?
bharosa.uio.default.whatsthis.DeviceTextPad.about.answer3=Jedes Mal, wenn TextPad angezeigt wird, enth\u00E4lt es eine neue Zeit und ein neues Datum. Dies ist eine weitere Sicherheitsfunktion, um Ihre Online-Sicherheit zu gew\u00E4hrleisten. Achten Sie darauf, dass die Zeit und das Datum nicht \u00E4lter als 24 Stunden sind, bevor Sie Ihr Kennwort eingeben.


