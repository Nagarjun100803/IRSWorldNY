bharosa.uio.default.register.info.section1.subtitle=Erweiterte Datensicherheit
bharosa.uio.default.register.info.section1.message=Die neuen pers\u00F6nlichen Sicherheitsger\u00E4te bieten Ihnen mehr Schutz beim Online-Banking. Die von Ihnen eingegebenen Informationen werden vor zahlreichen heutigen Sicherheitsbedrohungen gesch\u00FCtzt. Gleichzeitig beweisen das Bild, die Phrase und das Datum, dass Sie auf unserer offiziellen Site sind.

