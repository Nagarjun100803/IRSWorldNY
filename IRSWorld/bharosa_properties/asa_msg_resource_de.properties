bharosa.uio.default.whatsthis.DeviceQuestionPad.about.question3=Wozu dient das Aktualisierungsdatum?
bharosa.uio.default.whatsthis.DeviceQuestionPad.about.answer3=Jedes Mal, wenn QuestionPad angezeigt wird, enth\u00E4lt es eine neue Zeit und ein neues Datum. Dies ist eine weitere Sicherheitsfunktion, um Ihre Online-Sicherheit zu gew\u00E4hrleisten. Achten Sie darauf, dass die Zeit und das Datum nicht \u00E4lter als 24 Stunden sind, bevor Sie Ihr Kennwort eingeben.

