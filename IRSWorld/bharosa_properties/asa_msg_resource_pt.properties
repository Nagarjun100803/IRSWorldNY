bharosa.uio.default.whatsthis.DeviceKeyPadFull.about.answer1=O KeyPad \u00E9 personalizado com uma imagem e frase de segundo plano pessoais. Esta personaliza\u00E7\u00E3o garante ao utilizador que \u00E9 seguro introduzir a senha. A partir deste momento, o utilizador nunca dever\u00E1 introduzir a senha em modo interactivo se n\u00E3o for apresentado o respectivo KeyPad personalizado. A personaliza\u00E7\u00E3o nunca ser\u00E1 alterada sem o conhecimento do utilizador.

