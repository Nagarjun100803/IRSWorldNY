bharosa.uio.default.register.info.message=A configura\u00E7\u00E3o do novo perfil de permiss\u00E3o de acesso melhora a protec\u00E7\u00E3o do utilizador em modo interactivo.<br>Acrescenta novas camadas de seguran\u00E7a \u00E0 conta do utilizador, pois ajuda-nos a identificar o utilizador e ajudar\u00E1 o utilizador a identificar o nosso local.

