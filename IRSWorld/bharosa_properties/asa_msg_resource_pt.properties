bharosa.uio.default.whatsthis.DeviceTextPad.pagetitle=Acerca do TextPad
bharosa.uio.default.whatsthis.DeviceTextPad.title=Utiliza\u00E7\u00E3o do TextPad: Instru\u00E7\u00F5es

bharosa.uio.default.whatsthis.DeviceTextPad.whatsthis.title=O Que \u00E9 Isto?
bharosa.uio.default.whatsthis.DeviceTextPad.whatsthis.text1=O TextPad \u00E9 um dispositivo virtual que oferece protec\u00E7\u00E3o de permiss\u00E3o de acesso avan\u00E7ada contra o roubo de identidades em modo interactivo.
bharosa.uio.default.whatsthis.DeviceTextPad.whatsthis.text2=O TextPad permite introduzir a senha atrav\u00E9s do teclado normal. O TextPad ajuda a proteger o utilizador contra a introdu\u00E7\u00E3o acidental de informa\u00E7\u00F5es importantes em locais na Web fraudulentos.

bharosa.uio.default.whatsthis.DeviceTextPad.about.title=Acerca do TextPad: Funcionalidades de Permiss\u00E3o de Acesso Interactivas
bharosa.uio.default.whatsthis.DeviceTextPad.about.text=Seguem-se algumas das funcionalidades de permiss\u00E3o de acesso avan\u00E7adas associadas ao TextPad e respostas \u00E0s perguntas mais comuns dos utilizadores.

bharosa.uio.default.whatsthis.DeviceTextPad.about.question1=Por que s\u00E3o necess\u00E1rias uma imagem e uma frase pessoais?
bharosa.uio.default.whatsthis.DeviceTextPad.about.answer1=O TextPad \u00E9 personalizado com uma imagem e frase de segundo plano pessoais. Esta personaliza\u00E7\u00E3o garante ao utilizador que \u00E9 seguro introduzir a senha. A partir deste momento, o utilizador nunca dever\u00E1 introduzir a senha em modo interactivo se n\u00E3o for apresentado o respectivo TextPad personalizado. A personaliza\u00E7\u00E3o nunca ser\u00E1 alterada sem o conhecimento do utilizador.

bharosa.uio.default.whatsthis.DeviceTextPad.about.question2=Porqu\u00EA mudar?
bharosa.uio.default.whatsthis.DeviceTextPad.about.answer2=Estamos sempre \u00E0 procura de formas de tornar mais segura a experi\u00EAncia interactiva dos utilizadores. O TextPad \u00E9 apenas uma das muitas medidas que estamos a tomar para melhorar a seguran\u00E7a no nosso local.

bharosa.uio.default.whatsthis.DeviceTextPad.about.question3=Para que serve a renova\u00E7\u00E3o da data?
bharosa.uio.default.whatsthis.DeviceTextPad.about.answer3=Sempre que o TextPad for apresentado, ter\u00E1 uma nova hora e data. Trata-se de outra funcionalidade de permiss\u00E3o de acesso destinada a garantir a seguran\u00E7a em modo interactivo. Antes de introduzir a senha, o utilizador deve certificar-se de que a hora e a data n\u00E3o t\u00EAm mais de 24 horas.


