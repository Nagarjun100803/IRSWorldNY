bharosa.uio.default.whatsthis.DeviceTextPad.bullet.enum.one.description=Marca do TextPad 1
bharosa.uio.default.whatsthis.DeviceTextPad.bullet.enum.one.text=Introduza a senha atrav\u00E9s da utiliza\u00E7\u00E3o do teclado e, em seguida, seleccione Enter.

