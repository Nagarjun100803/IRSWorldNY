bharosa.uio.default.register.info.section2.message=O utilizador registar\u00E1 tr\u00EAs perguntas de permiss\u00E3o de acesso para acrescentar outra camada de seguran\u00E7a. Futuramente, faremos uma dessas perguntas atrav\u00E9s do dispositivo personalizado, se uma determinada situa\u00E7\u00E3o parecer arriscada. Estas perguntas e respostas dever\u00E3o permanecer secretas tal como a senha.

