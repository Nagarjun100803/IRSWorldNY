###  KeyPad Description and Directions
bharosa.autehntipad.keypad.accessibility.description = Billenty\u0171zet-k\u00E9perny\u0151
bharosa.authentipad.keypad.accessibility.directions = A Billenty\u0171zet-k\u00E9perny\u0151 haszn\u00E1lata: Az al\u00E1bbi gombok seg\u00EDts\u00E9g\u00E9vel adhatja meg jelszav\u00E1t. El\u0151sz\u00F6r saj\u00E1t szem\u00E9lyre szabott felirata jelenik meg, azut\u00E1n a vez\u00E9rl\u0151gombok. Miut\u00E1n megadta a jelsz\u00F3t, a Shift+Tab billenty\u0171kombin\u00E1ci\u00F3val t\u00E9rhet vissza az Enter gombhoz, amellyel a jelsz\u00F3t elk\u00FCldheti.
