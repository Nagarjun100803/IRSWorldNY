bharosa.uio.default.whatsthis.DeviceKeyPadFull.whatsthis.text2=\uD0A4\uD328\uB4DC\uB97C \uC0AC\uC6A9\uD558\uBA74 \uD0A4\uBCF4\uB4DC\uB97C \uD1B5\uD574 \uC785\uB825\uD558\uB294 \uB300\uC2E0 \uB9C8\uC6B0\uC2A4\uB97C \uBA87 \uBC88\uB9CC \uB20C\uB7EC \uBE44\uBC00\uBC88\uD638\uB97C \uC785\uB825\uD560 \uC218 \uC788\uC2B5\uB2C8\uB2E4. \uD0A4\uD328\uB4DC\uB294 \uC5EC\uB7EC \uAC00\uC9C0 \uC628\uB77C\uC778 \uC704\uD611\uC73C\uB85C\uBD80\uD130 \uC0AC\uC6A9\uC790\uB97C \uBCF4\uD638\uD574 \uC90D\uB2C8\uB2E4.

