bharosa.uio.default.register.info.title=\uC0C8 \uBCF4\uC548 \uD504\uB85C\uD30C\uC77C
bharosa.uio.default.register.info.message=\uC0C8 \uBCF4\uC548 \uD504\uB85C\uD30C\uC77C\uC744 \uC124\uC815\uD558\uBA74 \uC628\uB77C\uC778 \uBCF4\uD638 \uAE30\uB2A5\uC774 \uD5A5\uC0C1\uB429\uB2C8\uB2E4.<br>\uB610\uD55C \uC0AC\uC6A9\uC790 \uACC4\uC815\uC5D0 \uC0C8 \uBCF4\uC548 \uCE35\uC774 \uCD94\uAC00\uB418\uBBC0\uB85C \uC0AC\uC6A9\uC790 \uC2DD\uBCC4\uC774 \uC26C\uC6CC\uC9C0\uBA70 \uC0AC\uC6A9\uC790 \uB610\uD55C \uBCF8\uC0AC\uC758 \uC0AC\uC774\uD2B8\uB97C \uC27D\uAC8C \uC2DD\uBCC4\uD560 \uC218 \uC788\uAC8C \uB429\uB2C8\uB2E4.

bharosa.uio.default.register.info.section1.title=\uB2E8\uACC4 1: \uBCF4\uC548 \uC774\uBBF8\uC9C0 \uBC0F \uAD6C\uBB38
bharosa.uio.default.register.info.section1.subtitle=\uD5A5\uC0C1\uB41C \uB370\uC774\uD130 \uBCF4\uC548
bharosa.uio.default.register.info.section1.message=\uC0C8\uB85C \uAC1C\uBCC4\uD654\uB41C \uBCF4\uC548 \uC7A5\uCE58\uB97C \uD1B5\uD574 \uC628\uB77C\uC778 \uBC45\uD0B9 \uC911 \uBCF4\uD638\uB97C \uBC1B\uC744 \uC218 \uC788\uC2B5\uB2C8\uB2E4. \uC785\uB825\uD55C \uC815\uBCF4\uB294 \uD604\uC7AC \uC0B0\uC7AC\uD574 \uC788\uB294 \uC5EC\uB7EC \uBCF4\uC548 \uC704\uD611\uC73C\uB85C\uBD80\uD130 \uBCF4\uD638\uB429\uB2C8\uB2E4. \uB3D9\uC2DC\uC5D0 \uC774\uBBF8\uC9C0, \uAD6C\uBB38 \uBC0F \uB0A0\uC9DC\uB97C \uD1B5\uD574 \uC0AC\uC6A9\uC790\uAC00 \uBCF8\uC0AC\uC758 \uACF5\uC2DD \uC0AC\uC774\uD2B8\uC5D0 \uC811\uC18D\uD574 \uC788\uC74C\uC744 \uD655\uC778\uD560 \uC218 \uC788\uC2B5\uB2C8\uB2E4.

bharosa.uio.default.register.info.section2.title=\uB2E8\uACC4 2: \uBCF4\uC548 \uC9C8\uBB38 \uBC0F \uC751\uB2F5
bharosa.uio.default.register.info.section2.subtitle=\uCD94\uAC00 \uBCF4\uC548 \uCE35
bharosa.uio.default.register.info.section2.message=\uB2E4\uB978 \uBCF4\uC548 \uCE35\uC744 \uCD94\uAC00\uD558\uAE30 \uC704\uD574 \uC138 \uAC00\uC9C0 \uBCF4\uC548 \uC9C8\uBB38\uC744 \uB4F1\uB85D\uD558\uAC8C \uB429\uB2C8\uB2E4. \uB098\uC911\uC5D0 \uC704\uD5D8\uD55C \uC0C1\uD0DC\uAC00 \uAC10\uC9C0\uB418\uBA74 \uAC1C\uBCC4\uD654\uB41C \uC7A5\uCE58\uB97C \uC0AC\uC6A9\uD558\uC5EC \uC774\uB7EC\uD55C \uC9C8\uBB38 \uC911 \uD558\uB098\uB97C \uBB3B\uAC8C \uB420 \uAC83\uC785\uB2C8\uB2E4. \uC774\uB7EC\uD55C \uC9C8\uBB38 \uBC0F \uC751\uB2F5\uC740 \uBE44\uBC00\uBC88\uD638\uC640 \uB9C8\uCC2C\uAC00\uC9C0\uB85C \uAE30\uBC00\uB85C \uC720\uC9C0\uB418\uC5B4\uC57C \uD569\uB2C8\uB2E4.

