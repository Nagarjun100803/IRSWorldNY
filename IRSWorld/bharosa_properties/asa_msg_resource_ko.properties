bharosa.uio.default.whatsthis.DeviceTextPad.whatsthis.title=\uC124\uBA85
bharosa.uio.default.whatsthis.DeviceTextPad.whatsthis.text1=\uD14D\uC2A4\uD2B8 \uD328\uB4DC\uB294 \uC628\uB77C\uC778 ID \uB3C4\uB09C\uC5D0 \uB300\uBE44\uD558\uC5EC \uACE0\uAE09 \uBCF4\uC548 \uBCF4\uD638\uB97C \uC81C\uACF5\uD558\uB294 \uAC00\uC0C1 \uC7A5\uCE58\uC785\uB2C8\uB2E4.
bharosa.uio.default.whatsthis.DeviceTextPad.whatsthis.text2=\uD14D\uC2A4\uD2B8 \uD328\uB4DC\uB97C \uC0AC\uC6A9\uD558\uBA74 \uC77C\uBC18 \uD0A4\uBCF4\uB4DC\uB85C \uBE44\uBC00\uBC88\uD638\uB97C \uC785\uB825\uD560 \uC218 \uC788\uC2B5\uB2C8\uB2E4. \uD14D\uC2A4\uD2B8 \uD328\uB4DC\uB294 \uC0AC\uAE30\uC131 \uC6F9 \uC0AC\uC774\uD2B8\uC5D0\uC11C \uC2E4\uC218\uB85C \uAE30\uBC00 \uC815\uBCF4\uB97C \uC785\uB825\uD558\uC9C0 \uC54A\uB3C4\uB85D \uBCF4\uD638\uD574 \uC90D\uB2C8\uB2E4.

bharosa.uio.default.whatsthis.DeviceTextPad.about.title=\uD14D\uC2A4\uD2B8 \uD328\uB4DC \uC815\uBCF4: \uC628\uB77C\uC778 \uBCF4\uC548 \uAE30\uB2A5
bharosa.uio.default.whatsthis.DeviceTextPad.about.text=\uC5EC\uAE30\uC11C\uB294 \uD14D\uC2A4\uD2B8 \uD328\uB4DC\uC640 \uC5F0\uAD00\uB41C \uACE0\uAE09 \uBCF4\uC548 \uAE30\uB2A5\uACFC \uAC00\uC7A5 \uC77C\uBC18\uC801\uC778 \uC9C8\uBB38\uC5D0 \uB300\uD55C \uB2F5\uBCC0\uC744 \uC81C\uACF5\uD569\uB2C8\uB2E4.

bharosa.uio.default.whatsthis.DeviceTextPad.about.question1=\uAC1C\uC778 \uC774\uBBF8\uC9C0\uC640 \uAD6C\uBB38\uC774 \uD544\uC694\uD55C \uC774\uC720\uB294 \uBB34\uC5C7\uC785\uB2C8\uAE4C?
bharosa.uio.default.whatsthis.DeviceTextPad.about.answer1=\uD14D\uC2A4\uD2B8 \uD328\uB4DC\uB294 \uACE0\uC720\uD55C \uBC30\uACBD \uC774\uBBF8\uC9C0\uC640 \uAD6C\uBB38\uC73C\uB85C \uAC1C\uBCC4\uD654\uB429\uB2C8\uB2E4. \uC774 \uAC1C\uBCC4\uD654\uB97C \uD1B5\uD574 \uC548\uC804\uD558\uAC8C \uBE44\uBC00\uBC88\uD638\uB97C \uC785\uB825\uD560 \uC218 \uC788\uC2B5\uB2C8\uB2E4. \uC9C0\uAE08\uBD80\uD130\uB294 \uAC1C\uBCC4\uD654\uB41C \uD14D\uC2A4\uD2B8 \uD328\uB4DC\uAC00 \uD45C\uC2DC\uB420 \uB54C\uB9CC \uC628\uB77C\uC778\uC5D0\uC11C \uBE44\uBC00\uBC88\uD638\uB97C \uC785\uB825\uD558\uC2ED\uC2DC\uC624. \uC0AC\uC6A9\uC790\uC758 \uD655\uC778 \uC5C6\uC774\uB294 \uAC1C\uBCC4\uD654\uAC00 \uBCC0\uACBD\uB418\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4.

bharosa.uio.default.whatsthis.DeviceTextPad.about.question2=\uBCC0\uACBD \uC774\uC720\uB294 \uBB34\uC5C7\uC785\uB2C8\uAE4C?
bharosa.uio.default.whatsthis.DeviceTextPad.about.answer2=\uBCF8\uC0AC\uB294 \uD56D\uC0C1 \uC628\uB77C\uC778 \uD658\uACBD\uC744 \uBCF4\uB2E4 \uC548\uC804\uD558\uAC8C \uC720\uC9C0\uD558\uAE30 \uC704\uD55C \uBC29\uC548\uC744 \uBAA8\uC0C9\uD558\uACE0 \uC788\uC2B5\uB2C8\uB2E4. \uD14D\uC2A4\uD2B8 \uD328\uB4DC\uB294 \uBCF8\uC0AC \uC0AC\uC774\uD2B8\uC5D0 \uC811\uC18D\uD574 \uC788\uB294 \uB3D9\uC548 \uC0AC\uC6A9\uC790\uC758 \uC548\uC804\uC744 \uAC15\uD654\uD558\uAE30 \uC704\uD574 \uCDE8\uD558\uACE0 \uC788\uB294 \uC5EC\uB7EC \uAC00\uC9C0 \uC870\uCE58 \uC911 \uD558\uB098\uC77C \uBFD0\uC785\uB2C8\uB2E4.

bharosa.uio.default.whatsthis.DeviceTextPad.about.question3=\uCD5C\uC885 \uAC31\uC2E0 \uB0A0\uC9DC\uB780 \uBB34\uC5C7\uC785\uB2C8\uAE4C?
bharosa.uio.default.whatsthis.DeviceTextPad.about.answer3=\uD14D\uC2A4\uD2B8 \uD328\uB4DC\uAC00 \uD45C\uC2DC\uB420 \uB54C\uB9C8\uB2E4 \uC0C8 \uC2DC\uAC04\uACFC \uB0A0\uC9DC\uAC00 \uC81C\uACF5\uB429\uB2C8\uB2E4. \uC774\uB294 \uC628\uB77C\uC778\uC5D0\uC11C\uC758 \uC548\uC804\uC744 \uC704\uD55C \uBCF4\uC548 \uAE30\uB2A5 \uC911 \uD558\uB098\uC785\uB2C8\uB2E4. \uBE44\uBC00\uBC88\uD638\uB97C \uC785\uB825\uD558\uAE30 \uC804\uC5D0 \uC2DC\uAC04\uACFC \uB0A0\uC9DC\uAC00 \uCD5C\uADFC 24\uC2DC\uAC04 \uC774\uB0B4\uC778\uC9C0 \uD655\uC778\uD558\uC2ED\uC2DC\uC624.


