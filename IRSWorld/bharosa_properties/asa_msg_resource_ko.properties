bharosa.uio.default.whatsthis.DevicePinPad.about.answer1=\uC22B\uC790 \uD328\uB4DC\uB294 \uACE0\uC720\uD55C \uBC30\uACBD \uC774\uBBF8\uC9C0\uC640 \uAD6C\uBB38\uC73C\uB85C \uAC1C\uBCC4\uD654\uB429\uB2C8\uB2E4. \uC774 \uAC1C\uBCC4\uD654\uB97C \uD1B5\uD574 \uC548\uC804\uD558\uAC8C PIN \uCF54\uB4DC\uB97C \uC785\uB825\uD560 \uC218 \uC788\uC2B5\uB2C8\uB2E4. \uC9C0\uAE08\uBD80\uD130\uB294 \uAC1C\uBCC4\uD654\uB41C \uC22B\uC790 \uD328\uB4DC\uAC00 \uD45C\uC2DC\uB420 \uB54C\uB9CC \uC628\uB77C\uC778\uC5D0\uC11C PIN\uC744 \uC785\uB825\uD558\uC2ED\uC2DC\uC624. \uC0AC\uC6A9\uC790\uC758 \uD655\uC778 \uC5C6\uC774\uB294 \uAC1C\uBCC4\uD654\uAC00 \uBCC0\uACBD\uB418\uC9C0 \uC54A\uC2B5\uB2C8\uB2E4.

bharosa.uio.default.whatsthis.DevicePinPad.about.question2=\uD0A4\uAC00 \uC774\uB3D9\uD558\uB294 \uC774\uC720\uB294 \uBB34\uC5C7\uC785\uB2C8\uAE4C?
bharosa.uio.default.whatsthis.DevicePinPad.about.answer2=\uC22B\uC790 \uD328\uB4DC\uC758 \uD0A4\uB294 \uCD94\uAC00\uB41C \uBCF4\uC548 \uC870\uCE58\uC758 \uC77C\uD658\uC73C\uB85C \uC0AC\uC6A9\uC790\uAC00 \uB85C\uADF8\uC778\uD560 \uB54C\uB9C8\uB2E4 \uD504\uB808\uC784 \uB0B4\uC758 \uB2E4\uB978 \uC7A5\uC18C\uB85C \uC774\uB3D9\uB429\uB2C8\uB2E4.

