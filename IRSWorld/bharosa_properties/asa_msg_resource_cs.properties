bharosa.uio.default.whatsthis.DeviceQuestionPad.about.answer3=Poka\u017Ed\u00E9, kdy\u017E se v\u00E1m za\u0159\u00EDzen\u00ED QuestionPad zobraz\u00ED, bude obsahovat nov\u00FD \u010Das a datum. Jedn\u00E1 se o dal\u0161\u00ED funkci zabezpe\u010Den\u00ED, kter\u00E1 zaji\u0161\u0165uje va\u0161i online bezpe\u010Dnost. P\u0159ed zad\u00E1n\u00EDm jm\u00E9na se ujist\u011Bte, \u017Ee datum a \u010Das nejsou star\u0161\u00ED ne\u017E 24 hodin.

