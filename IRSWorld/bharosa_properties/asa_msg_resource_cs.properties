bharosa.uio.default.messages.enum.notimage.description=Pokud za\u0159\u00EDzen\u00ED, kter\u00E9 se zobraz\u00ED, neobsahuje v\u00E1\u0161 obr\u00E1zek a fr\u00E1zi, ov\u011B\u0159te, zda jste spr\u00E1vn\u011B zadali u\u017Eivatelsk\u00E9 jm\u00E9no. Pokud jste spr\u00E1vn\u011B zadali u\u017Eivatelsk\u00E9 jm\u00E9no a va\u0161e p\u0159izp\u016Fsoben\u00E9 za\u0159\u00EDzen\u00ED se st\u00E1le nezobrazuje, obra\u0165te se na st\u0159edisko slu\u017Eeb z\u00E1kazn\u00EDk\u016Fm. D\u011Bkujeme.

