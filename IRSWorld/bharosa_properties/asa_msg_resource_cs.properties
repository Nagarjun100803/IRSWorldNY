bharosa.uio.default.whatsthis.DeviceTextPad.whatsthis.title=Co je to?
bharosa.uio.default.whatsthis.DeviceTextPad.whatsthis.text1=TextPad je virtu\u00E1ln\u00ED za\u0159\u00EDzen\u00ED, jeho\u017E pomoc\u00ED m\u016F\u017Eete zv\u00FD\u0161it ochranu zabezpe\u010Den\u00ED p\u0159ed online kr\u00E1de\u017E\u00ED identity.
bharosa.uio.default.whatsthis.DeviceTextPad.whatsthis.text2=Za\u0159\u00EDzen\u00ED TextPad umo\u017E\u0148uje zad\u00E1n\u00ED hesla pomoc\u00ED norm\u00E1ln\u00ED kl\u00E1vesnice. Napom\u00E1h\u00E1 p\u0159i ochran\u011B p\u0159ed n\u00E1hodn\u00FDm zad\u00E1n\u00EDm d\u016Fv\u011Brn\u00FDch informac\u00ED na podvodn\u00FD web.

bharosa.uio.default.whatsthis.DeviceTextPad.about.title=O za\u0159\u00EDzen\u00ED TextPad: Online funkce zabezpe\u010Den\u00ED
bharosa.uio.default.whatsthis.DeviceTextPad.about.text=Nab\u00EDz\u00EDme n\u011Bkter\u00E9 roz\u0161\u00ED\u0159en\u00E9 funkce zabezpe\u010Den\u00ED spojen\u00E9 se za\u0159\u00EDzen\u00EDm TextPad a odpov\u011Bdi na nej\u010Dast\u011Bj\u0161\u00ED dotazy.

bharosa.uio.default.whatsthis.DeviceTextPad.about.question1=K \u010Demu pot\u0159ebuji osobn\u00ED obr\u00E1zek a heslo?
bharosa.uio.default.whatsthis.DeviceTextPad.about.answer1=Za\u0159\u00EDzen\u00ED Textpad obsahuje pouze v\u00E1\u0161 vlastn\u00ED obr\u00E1zek na pozad\u00ED a fr\u00E1zi. Toto p\u0159izp\u016Fsoben\u00ED je z\u00E1rukou, \u017Ee je zad\u00E1v\u00E1n\u00ED hesla bezpe\u010Dn\u00E9. Odte\u010F nikdy nezad\u00E1vejte heslo online, pokud nem\u00E1te sv\u00E9 vlastn\u00ED za\u0159\u00EDzen\u00ED Textpad. Va\u0161e osobn\u00ED nastaven\u00ED nikdy nezm\u011Bn\u00EDme bez va\u0161eho v\u011Bdom\u00ED.

bharosa.uio.default.whatsthis.DeviceTextPad.about.question2=Pro\u010D tato zm\u011Bna?
bharosa.uio.default.whatsthis.DeviceTextPad.about.answer2=St\u00E1le hled\u00E1me zp\u016Fsoby, jak zajistit je\u0161t\u011B lep\u0161\u00ED online zabezpe\u010Den\u00ED z\u00E1kazn\u00EDk\u016F. Za\u0159\u00EDzen\u00ED TextPad je jen jedn\u00EDm z mnoha opat\u0159en\u00ED, jimi\u017E zvy\u0161ujeme va\u0161i bezpe\u010Dnost p\u0159i proch\u00E1zen\u00ED na\u0161ich str\u00E1nek.

bharosa.uio.default.whatsthis.DeviceTextPad.about.question3=K \u010Demu slou\u017E\u00ED v\u017Edy aktu\u00E1ln\u00ED datum?
bharosa.uio.default.whatsthis.DeviceTextPad.about.answer3=Poka\u017Ed\u00E9, kdy\u017E se za\u0159\u00EDzen\u00ED Textpad objev\u00ED, bude uv\u00E1d\u011Bt nov\u00FD \u010Das a datum. Jedn\u00E1 se o dal\u0161\u00ED funkci zabezpe\u010Den\u00ED zvy\u0161uj\u00EDc\u00ED va\u0161i online bezpe\u010Dnost. P\u0159ed zad\u00E1n\u00EDm hesla se ujist\u011Bte, zda datum a \u010Das nejsou star\u0161\u00ED 24 hodin.


