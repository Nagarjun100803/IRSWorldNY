bharosa.uio.default.whatsthis.DeviceQuestionPad.about.answer2=St\u00E1le hled\u00E1me zp\u016Fsoby, jak zajistit je\u0161t\u011B lep\u0161\u00ED zabezpe\u010Den\u00ED va\u0161\u00ED online pr\u00E1ce. Za\u0159\u00EDzen\u00ED QuestionPad je jen jedn\u00EDm z mnoha opat\u0159en\u00ED, jimi\u017E zvy\u0161ujeme va\u0161i bezpe\u010Dnost p\u0159i proch\u00E1zen\u00ED na\u0161ich str\u00E1nek.

