bharosa.uio.default.messages.enum.wherepassword.description=Zv\u00FD\u0161ili jsme bezpe\u010Dnostn\u00ED opat\u0159en\u00ED, abyste byli p\u0159i online bankovnictv\u00ED l\u00E9pe chr\u00E1n\u011Bni. Od nyn\u011Bj\u0161ka nejprve zad\u00E1te u\u017Eivatelsk\u00E9 jm\u00E9no a potom na samostatn\u00E9 str\u00E1nce heslo.

