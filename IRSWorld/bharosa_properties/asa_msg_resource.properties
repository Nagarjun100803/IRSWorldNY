################# What's This ###################################


bharosa.uio.default.whatsthis.DeviceTextPad.pagetitle=About TextPad
bharosa.uio.default.whatsthis.DeviceTextPad.title=Using TextPad: Directions

bharosa.uio.default.whatsthis.DeviceTextPad.whatsthis.title=What's This?
bharosa.uio.default.whatsthis.DeviceTextPad.whatsthis.text1=TextPad is a virtual device that offers you advanced security protection against online identity theft.
bharosa.uio.default.whatsthis.DeviceTextPad.whatsthis.text2=TextPad lets you enter your password using your normal keyboard. TextPad helps to protect you from accidentally entering your sensitive information on a fraudulent Web site.

bharosa.uio.default.whatsthis.DeviceTextPad.about.title=About TextPad: Online Security Features
bharosa.uio.default.whatsthis.DeviceTextPad.about.text=Here are some of the advanced security features associated with TextPad and answers to your most common questions.

bharosa.uio.default.whatsthis.DeviceTextPad.about.question1=Why do I need a personal image and phrase?
bharosa.uio.default.whatsthis.DeviceTextPad.about.answer1=Textpad is personalized with your very own background image and phrase. This personalization is assurance that it's safe to enter your password. From now on, never enter your password online unless you are presented with your personalized Textpad. We will never change your personalization without your knowledge.

bharosa.uio.default.whatsthis.DeviceTextPad.about.question2=Why the change?
bharosa.uio.default.whatsthis.DeviceTextPad.about.answer2=We are always looking for ways to make your online experience safer. TextPad is just one of the many measures we are taking to enhance your safety while on our site.

bharosa.uio.default.whatsthis.DeviceTextPad.about.question3=What is the freshness date for?
bharosa.uio.default.whatsthis.DeviceTextPad.about.answer3=Every time we present you with Textpad it will have a new time and date. This is yet another security feature to ensure your safety online. Before entering your password make sure the time and date are no more than 24 hours old.


bharosa.uio.default.whatsthis.DeviceTextPad.bullet.enum.one.name=TextPad Bullet 1
bharosa.uio.default.whatsthis.DeviceTextPad.bullet.enum.one.description=TextPad Bullet 1
bharosa.uio.default.whatsthis.DeviceTextPad.bullet.enum.one.text=Enter your password using your keyboard, and then click Enter.

bharosa.uio.default.whatsthis.DeviceTextPad.bullet.enum.two.name=TextPad Bullet 2
bharosa.uio.default.whatsthis.DeviceTextPad.bullet.enum.two.description=TextPad Bullet 2
bharosa.uio.default.whatsthis.DeviceTextPad.bullet.enum.two.text=It's as easy as that!

