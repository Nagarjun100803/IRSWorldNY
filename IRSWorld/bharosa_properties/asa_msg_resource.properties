bharosa.uio.default.whatsthis.DeviceKeyPadFull.pagetitle=About KeyPad
bharosa.uio.default.whatsthis.DeviceKeyPadFull.title=Using KeyPad: Directions

bharosa.uio.default.whatsthis.DeviceKeyPadFull.whatsthis.title=What's This?
bharosa.uio.default.whatsthis.DeviceKeyPadFull.whatsthis.text1=KeyPad is a virtual device that offers you advanced security protection against online identity theft.
bharosa.uio.default.whatsthis.DeviceKeyPadFull.whatsthis.text2=KeyPad lets you enter your password with just a few clicks of your mouse, instead of keying it in on your keyboard. This protects you from a variety of online threats.

bharosa.uio.default.whatsthis.DeviceKeyPadFull.about.title=About KeyPad: Online Security Features
bharosa.uio.default.whatsthis.DeviceKeyPadFull.about.text=Here are some of the advanced security features associated with KeyPad and answers to your most common questions.

bharosa.uio.default.whatsthis.DeviceKeyPadFull.about.question1=Why do I need a personal image and phrase?
bharosa.uio.default.whatsthis.DeviceKeyPadFull.about.answer1=KeyPad is personalized with your very own background image and phrase. This personalization is assurance that it's safe to enter your password. From now on, never enter your password online unless you are presented with your personalized KeyPad. We will never change your personalization without your knowledge.

bharosa.uio.default.whatsthis.DeviceKeyPadFull.about.question2=Why do the keys move?
bharosa.uio.default.whatsthis.DeviceKeyPadFull.about.answer2=The keys on KeyPad move to a different spot within the frame each time you login as an added security measure.

bharosa.uio.default.whatsthis.DeviceKeyPadFull.about.question3=What is the freshness date for?
bharosa.uio.default.whatsthis.DeviceKeyPadFull.about.answer3=Every time we present you with KeyPad it will have a new time and date. This is yet another security feature to ensure your safety online. Before entering your password make sure the time and date are no more than 24 hours old.


bharosa.uio.default.whatsthis.DeviceKeyPadFull.bullet.enum.one.name=KeyPad Bullet 1
bharosa.uio.default.whatsthis.DeviceKeyPadFull.bullet.enum.one.description=KeyPad Bullet 1
bharosa.uio.default.whatsthis.DeviceKeyPadFull.bullet.enum.one.text=Use your mouse to click the buttons on the KeyPad to enter your password, and then click Enter.

bharosa.uio.default.whatsthis.DeviceKeyPadFull.bullet.enum.two.name=KeyPad Bullet 2
bharosa.uio.default.whatsthis.DeviceKeyPadFull.bullet.enum.two.description=KeyPad Bullet 2
bharosa.uio.default.whatsthis.DeviceKeyPadFull.bullet.enum.two.text=To enter a capital letter, click the caps button. Click a second time to lock caps; a third time to return to lower case

bharosa.uio.default.whatsthis.DeviceKeyPadFull.bullet.enum.three.name=KeyPad Bullet 3
bharosa.uio.default.whatsthis.DeviceKeyPadFull.bullet.enum.three.description=KeyPad Bullet 2
bharosa.uio.default.whatsthis.DeviceKeyPadFull.bullet.enum.three.text=If you make a mistake, use the back arrow

