bharosa.uio.default.whatsthis.DeviceQuestionPad.pagetitle=About QuestionPad
bharosa.uio.default.whatsthis.DeviceQuestionPad.title=Using QuestionPad: Directions

bharosa.uio.default.whatsthis.DeviceQuestionPad.whatsthis.title=What's This?
bharosa.uio.default.whatsthis.DeviceQuestionPad.whatsthis.text1=QuestionPad is a virtual device that offers you advanced security protection against online identity theft.
bharosa.uio.default.whatsthis.DeviceQuestionPad.whatsthis.text2=QuestionPad lets you answer security questions using your normal keyboard. QuestionPad helps to protect you from accidentally entering your sensitive information on a fraudulent Web site.

bharosa.uio.default.whatsthis.DeviceQuestionPad.about.title=About QuestionPad: Online Security Features
bharosa.uio.default.whatsthis.DeviceQuestionPad.about.text=Here are some of the advanced security features associated with QuestionPad and answers to your most common questions.

bharosa.uio.default.whatsthis.DeviceQuestionPad.about.question1=Why do I need a personal image and phrase?
bharosa.uio.default.whatsthis.DeviceQuestionPad.about.answer1=Questionpad is personalized with your very own background image and phrase. This personalization is assurance that it's safe to answer your security questions. From now on, never enter your answer online unless you are presented with your personalized QuestionPad. We will never change your personalization without your knowledge.

bharosa.uio.default.whatsthis.DeviceQuestionPad.about.question2=Why the change?
bharosa.uio.default.whatsthis.DeviceQuestionPad.about.answer2=We are always looking for ways to make your online experience safer. QuestionPad is just one of many measures we are taking to enhance your safety while on our site.

bharosa.uio.default.whatsthis.DeviceQuestionPad.about.question3=What is the freshness date for?
bharosa.uio.default.whatsthis.DeviceQuestionPad.about.answer3=Every time we present you with QuestionPad it will have a new time and date. This is yet another security feature to ensure your safety online. Before entering your answer make sure the time and date are no more than 24 hours old.

