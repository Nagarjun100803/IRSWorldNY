bharosa.uio.default.whatsthis.DevicePinPad.whatsthis.title=Co to jest?
bharosa.uio.default.whatsthis.DevicePinPad.whatsthis.text1=PinPad to wirtualne urz\u0105dzenie, zapewniaj\u0105ce zaawansowan\u0105 ochron\u0119 przed kradzie\u017C\u0105 to\u017Csamo\u015Bci online.
bharosa.uio.default.whatsthis.DevicePinPad.whatsthis.text2=PinPad pozwala wprowadzi\u0107 kod PIN za pomoc\u0105 kilku klikni\u0119\u0107 mysz\u0105, bez u\u017Cycia zwyk\u0142ej klawiatury. Zabezpieczenie to chroni przed r\u00F3\u017Cnorodnymi zagro\u017Ceniami podczas pracy online.

bharosa.uio.default.whatsthis.DevicePinPad.about.title=PinPad - informacje: funkcje zabezpiecze\u0144 online
bharosa.uio.default.whatsthis.DevicePinPad.about.text=Oto niekt\u00F3re z zaawansowanych funkcji zabezpieczaj\u0105cych, powi\u0105zanych z urz\u0105dzeniem PinPad, oraz odpowiedzi na najcz\u0119\u015Bciej zadawane pytania.

bharosa.uio.default.whatsthis.DevicePinPad.about.question1=Do czego jest potrzebna grafika i fraza osobista?
bharosa.uio.default.whatsthis.DevicePinPad.about.answer1=PinPad jest spersonalizowany za pomoc\u0105 Pana/Pani osobistej grafiki t\u0142a i osobistej frazy. Personalizacja ta pomaga stwierdzi\u0107, czy mo\u017Cna bezpiecznie wprowadzi\u0107 kod PIN. Od tej pory nigdy nie nale\u017Cy wprowadza\u0107 kodu PIN, je\u015Bli nie jest wy\u015Bwietlone spersonalizowane urz\u0105dzenie PinPad. Nigdy nie zmienimy personalizacji bez Pana/Pani wiedzy.

