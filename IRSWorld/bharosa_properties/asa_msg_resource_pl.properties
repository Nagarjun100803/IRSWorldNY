bharosa.uio.default.messages.enum.wherepassword.name=Gdzie wprowadzam swoje has\u0142o?
bharosa.uio.default.messages.enum.wherepassword.description=Wzmocnili\u015Bmy zabezpieczenia, aby lepiej chroni\u0107 u\u017Cytkownik\u00F3w podczas operacji bankowych w trybie online. Od tej pory najpierw nale\u017Cy poda\u0107 nazw\u0119 u\u017Cytkownika, a dopiero potem trzeba poda\u0107 has\u0142o na osobnej stronie.

bharosa.uio.default.messages.enum.notimage.name=Nie jest to Pana/Pani grafika ani fraza?
bharosa.uio.default.messages.enum.notimage.description=Je\u015Bli wy\u015Bwietlane urz\u0105dzenie nie jest spersonalizowane z u\u017Cyciem Pana/Pani grafiki i frazy, prosz\u0119 si\u0119 upewni\u0107, \u017Ce zosta\u0142a poprawnie podana nazwa u\u017Cytkownika. Je\u015Bli nazwa u\u017Cytkownika zosta\u0142a podana poprawnie, a mimo to nadal nie wida\u0107 spersonalizowanego urz\u0105dzenia, to prosimy si\u0119 skontaktowa\u0107 z dzia\u0142em obs\u0142ugi klient\u00F3w. Dzi\u0119kujemy.

bharosa.uio.default.messages.enum.forgotanswer.name=Nie pami\u0119tam odpowiedzi
bharosa.uio.default.messages.enum.forgotanswer.description=Je\u015Bli zapomnia\u0142(a) Pan(i) odpowiedzi na swoje pytania zabezpieczaj\u0105ce, to prosimy si\u0119 skontaktowa\u0107 z dzia\u0142em obs\u0142ugi klient\u00F3w. Dzi\u0119kujemy.


