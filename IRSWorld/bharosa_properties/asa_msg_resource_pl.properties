bharosa.uio.default.whatsthis.DeviceQuestionPad.whatsthis.title=Co to jest?
bharosa.uio.default.whatsthis.DeviceQuestionPad.whatsthis.text1=QuestionPad to wirtualne urz\u0105dzenie, zapewniaj\u0105ce zaawansowan\u0105 ochron\u0119 przed kradzie\u017C\u0105 to\u017Csamo\u015Bci online.
bharosa.uio.default.whatsthis.DeviceQuestionPad.whatsthis.text2=QuestionPad pozwala udzieli\u0107 za pomoc\u0105 zwyk\u0142ej klawiatury odpowiedzi na pytania zabezpieczaj\u0105ce. QuestionPad chroni przed przypadkowym podaniem wra\u017Cliwych informacji na fa\u0142szywej stronie WWW.

bharosa.uio.default.whatsthis.DeviceQuestionPad.about.title=QuestionPad - informacje: funkcje zabezpiecze\u0144 online
bharosa.uio.default.whatsthis.DeviceQuestionPad.about.text=Oto niekt\u00F3re z zaawansowanych funkcji zabezpieczaj\u0105cych, powi\u0105zanych z urz\u0105dzeniem QuestionPad, oraz odpowiedzi na najcz\u0119\u015Bciej zadawane pytania.

bharosa.uio.default.whatsthis.DeviceQuestionPad.about.question1=Do czego jest potrzebna grafika i fraza osobista?
bharosa.uio.default.whatsthis.DeviceQuestionPad.about.answer1=QuestionPad jest spersonalizowany za pomoc\u0105 Pana/Pani osobistej grafiki t\u0142a i osobistej frazy. Personalizacja ta pomaga stwierdzi\u0107, czy mo\u017Cna bezpiecznie udziela\u0107 odpowiedzi na pytania zabezpieczaj\u0105ce. Od tej pory nigdy nie nale\u017Cy udziela\u0107 odpowiedzi online, je\u015Bli nie jest wy\u015Bwietlone spersonalizowane urz\u0105dzenie QuestionPad. Nigdy nie zmienimy personalizacji bez Pana/Pani wiedzy.

bharosa.uio.default.whatsthis.DeviceQuestionPad.about.question2=Z czego wynika ta zmiana?
bharosa.uio.default.whatsthis.DeviceQuestionPad.about.answer2=Zawsze szukamy nowych sposob\u00F3w zwi\u0119kszenia bezpiecze\u0144stwa pracy w trybie online. QuestionPad jest tylko jednym z wielu \u015Brodk\u00F3w zabezpieczaj\u0105cych, stosowanych w naszym serwisie.

bharosa.uio.default.whatsthis.DeviceQuestionPad.about.question3=Do czego s\u0142u\u017Cy data wa\u017Cno\u015Bci
bharosa.uio.default.whatsthis.DeviceQuestionPad.about.answer3=Za ka\u017Cdym razem udost\u0119pniane przez nas narz\u0119dzie QuestionPad b\u0119dzie zaopatrzone w now\u0105 godzin\u0119 i dat\u0119. To jeszcze jeden \u015Brodek zabezpieczaj\u0105cy, maj\u0105cy zapewni\u0107 bezpiecze\u0144stwo online. Przed podaniem has\u0142a nale\u017Cy si\u0119 upewni\u0107, \u017Ce godzina i data nie s\u0105 starsze ni\u017C 24 godziny.

