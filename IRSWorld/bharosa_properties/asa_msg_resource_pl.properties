bharosa.uio.default.register.info.section2.message=W celu wprowadzenia dodatkowej warstwy zabezpiecze\u0144 zostan\u0105 dodane trzy pytania zabezpieczaj\u0105ce. W przysz\u0142o\u015Bci, je\u015Bli sytuacja wyda si\u0119 niebezpieczna, poprosimy o udzielenie odpowiedzi na jedno z nich za pomoc\u0105 spersonalizowanego urz\u0105dzenia. Pytania te i odpowiedzi powinny by\u0107 traktowane jako poufne, podobnie jak has\u0142a.

