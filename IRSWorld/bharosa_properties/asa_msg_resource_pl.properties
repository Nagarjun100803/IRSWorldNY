bharosa.uio.default.whatsthis.DeviceKeyPadAlpha.about.question2=Dlaczego przyciski zmieniaj\u0105 swoje miejsce?
bharosa.uio.default.whatsthis.DeviceKeyPadAlpha.about.answer2=Przyciski urz\u0105dzenia KeyPad zmieniaj\u0105 swoje miejsce przy ka\u017Cdym logowaniu si\u0119 u\u017Cytkownika. Jest to dodatkowy \u015Brodek zabezpieczaj\u0105cy.

bharosa.uio.default.whatsthis.DeviceKeyPadAlpha.about.question3=Do czego s\u0142u\u017Cy data wa\u017Cno\u015Bci
bharosa.uio.default.whatsthis.DeviceKeyPadAlpha.about.answer3=Za ka\u017Cdym razem udost\u0119pniane przez nas narz\u0119dzie KeyPad b\u0119dzie zaopatrzone w now\u0105 godzin\u0119 i dat\u0119. To jeszcze jeden \u015Brodek zabezpieczaj\u0105cy, maj\u0105cy zapewni\u0107 bezpiecze\u0144stwo online. Przed podaniem has\u0142a nale\u017Cy si\u0119 upewni\u0107, \u017Ce godzina i data nie s\u0105 starsze ni\u017C 24 godziny.


