bharosa.authentipad.captionconfirmpad.accessibility.directions = Instructions pour CaptionConfirmPad : utilisez les \u00E9l\u00E9ments suivants pour r\u00E9viser votre titre. Si vous souhaitez modifier votre titre, utilisez la tabulation jusqu'\u00E0 atteindre le lien Modifier et appuyez sur Entr\u00E9e.
