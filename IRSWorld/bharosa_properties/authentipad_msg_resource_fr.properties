###  KeyPad Description and Directions
bharosa.autehntipad.keypad.accessibility.description = KeyPad
bharosa.authentipad.keypad.accessibility.directions = Instructions pour KeyPad : utilisez les liens suivants pour entrer votre mot de passe. Votre titre personnalis\u00E9 appara\u00EEt en premier, suivi des liens de contr\u00F4le, puis enfin les liens cl\u00E9s. Une fois votre mot de passe entr\u00E9, utilisez la combinaison de touches Maj+Tab pour revenir au lien d'entr\u00E9e et soumettre votre mot de passe.
bharosa.authentipad.keypad.security.image.alt = Image du p\u00E9riph\u00E9rique de s\u00E9curit\u00E9

###  PinPad Description and Directions
bharosa.authentipad.pinpad.accessibility.description = PinPad
bharosa.authentipad.pinpad.accessibility.directions = Instructions pour PinPad : utilisez les liens suivants pour entrer votre code PIN num\u00E9rique. Votre titre personnalis\u00E9 appara\u00EEt en premier, suivi des liens de contr\u00F4le, puis enfin des liens num\u00E9rique. Une fois votre code PIN num\u00E9rique entr\u00E9, utilisez la combinaison de touches Maj+Tab pour revenir au lien d'entr\u00E9e et soumettre votre code PIN.
bharosa.authentipad.pinpad.security.image.alt = Image du p\u00E9riph\u00E9rique de s\u00E9curit\u00E9

###  TextPad Description and Directions
bharosa.authentipad.textpad.accessibility.description = TextPad
bharosa.authentipad.textpad.accessibility.directions = Instructions pour TextPad : utilisez les \u00E9l\u00E9ments suivants pour valider votre p\u00E9riph\u00E9rique. Votre titre personnalis\u00E9 appara\u00EEt en premier, suivi d'un horodatage pour assurer que le p\u00E9riph\u00E9rique a \u00E9t\u00E9 g\u00E9n\u00E9r\u00E9 pour cette session. Une fois votre mot de passe entr\u00E9 dans le champ d'entr\u00E9e pr\u00E9c\u00E9dent, utilisez la tabulation pour naviguer vers le lien d'entr\u00E9e pour soumettre votre mot de passe.
bharosa.authentipad.textpad.security.image.alt = Image du p\u00E9riph\u00E9rique de s\u00E9curit\u00E9

###  TextPadReset Description and Directions
bharosa.authentipad.textpadreset.accessibility.description = TextPad
bharosa.authentipad.textpadreset.accessibility.directions = Instructions pour TextPad : utilisez les \u00E9l\u00E9ments suivants pour entrer votre nouveau mot de passe. Votre titre personnalis\u00E9 appara\u00EEt en premier, suivi d'un champ d'entr\u00E9e du mot de passe et d'un champ de confirmation. Une fois votre mot de passe entr\u00E9, utilisez la tabulation pour naviguer vers le lien d'entr\u00E9e pour soumettre votre nouveau mot de passe.
bharosa.authentipad.textpadreset.security.image.alt = Image du p\u00E9riph\u00E9rique de s\u00E9curit\u00E9

###  CaptionPad Description and Directions
bharosa.authentipad.captionpad.accessibility.description = CaptionPad
