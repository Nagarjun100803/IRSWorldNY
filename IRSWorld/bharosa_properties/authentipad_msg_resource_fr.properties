bharosa.authentipad.questionpad.accessibility.directions = Instructions pour QuestionPad : utilisez les \u00E9l\u00E9ments suivants pour entrer votre r\u00E9ponse. Votre question personnalis\u00E9e appara\u00EEt en premier, suivie de votre texte personnalis\u00E9, puis de votre champ d'entr\u00E9e de r\u00E9ponse. Une fois que vous avez entr\u00E9 votre r\u00E9ponse, utilisez la tabulation pour naviguer vers le lien d'entr\u00E9e pour soumettre votre r\u00E9ponse.
