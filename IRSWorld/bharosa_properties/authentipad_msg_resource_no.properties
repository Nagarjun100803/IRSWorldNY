###  KeyPad Description and Directions
bharosa.autehntipad.keypad.accessibility.description = KeyPad
bharosa.authentipad.keypad.accessibility.directions = Instruksjoner for KeyPad: Bruk de f\u00F8lgende koblingene n\u00E5r du skal angi passordet ditt. F\u00F8rst kommer den personlige bildeteksten, deretter kontrollkoblinger og til slutt n\u00F8kkelkoblingene. N\u00E5r du har angitt passordet, bruker du Skift + Tabulator for \u00E5 g\u00E5 tilbake til koblingen for \u00E5 sende passordet.
bharosa.authentipad.keypad.security.image.alt = Bilde av sikkerhetsenhet

###  PinPad Description and Directions
bharosa.authentipad.pinpad.accessibility.description = PinPad
bharosa.authentipad.pinpad.accessibility.directions = Instruksjoner for PinPad: Bruk de f\u00F8lgende koblingene n\u00E5r du skal angi den numeriske PIN-koden din. F\u00F8rst kommer den personlige bildeteksten, deretter kontrollkoblinger og til slutt de numeriske koblingene. N\u00E5r du har angitt den numeriske PIN-koden, bruker du Skift + Tabulator for \u00E5 g\u00E5 tilbake til koblingen for \u00E5 sende PIN-koden.
bharosa.authentipad.pinpad.security.image.alt = Bilde av sikkerhetsenhet

###  TextPad Description and Directions
bharosa.authentipad.textpad.accessibility.description = TextPad
bharosa.authentipad.textpad.accessibility.directions = Instruksjoner for TextPad: Bruk de f\u00F8lgende elementene n\u00E5r du skal validere enheten din. F\u00F8rst kommer den personlige bildeteksten, deretter f\u00F8lger et tidsstempel for \u00E5 sikre at enheten ble generert for denne \u00F8kten. N\u00E5r du har angitt passordet ditt i det foreg\u00E5ende feltet for \u00E5 angi passord, bruker du Tabulator for \u00E5 navigere til koblingen for \u00E5 sende passordet. 
bharosa.authentipad.textpad.security.image.alt = Bilde av sikkerhetsenhet

###  TextPadReset Description and Directions
bharosa.authentipad.textpadreset.accessibility.description = TextPad
bharosa.authentipad.textpadreset.accessibility.directions = Instruksjoner for TextPad: Bruk de f\u00F8lgende elementene n\u00E5r du skal angi det nye passordet ditt. F\u00F8rst kommer den personlige bildeteksten, deretter et felt for \u00E5 skrive inn passordet og et felt for \u00E5 bekrefte passordet. N\u00E5r du har skrevet inn passordet, bruker du Tabulator for \u00E5 navigere til koblingen for \u00E5 sende det nye passordet.
bharosa.authentipad.textpadreset.security.image.alt = Bilde av sikkerhetsenhet

