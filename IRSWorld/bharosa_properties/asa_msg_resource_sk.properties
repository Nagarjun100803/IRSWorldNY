bharosa.uio.default.whatsthis.DeviceTextPad.pagetitle=Zariadenie TextPad
bharosa.uio.default.whatsthis.DeviceTextPad.title=Pou\u017E\u00EDvanie zariadenia TextPad: Pokyny

bharosa.uio.default.whatsthis.DeviceTextPad.whatsthis.title=\u010Co je to?
bharosa.uio.default.whatsthis.DeviceTextPad.whatsthis.text1=TextPad je virtu\u00E1lne zariadenie, ktor\u00E9 poskytuje zv\u00FD\u0161en\u00FA ochranu pred kr\u00E1de\u017Eou identity online.
bharosa.uio.default.whatsthis.DeviceTextPad.whatsthis.text2=TextPad umo\u017E\u0148uje zada\u0165 heslo pomocou \u0161tandardnej kl\u00E1vesnice. TextPad pom\u00E1ha pri ochrane pred ne\u00FAmyseln\u00FDm zadan\u00EDm citliv\u00FDch inform\u00E1ci\u00ED na falo\u0161nej webovej lokalite.

bharosa.uio.default.whatsthis.DeviceTextPad.about.title=Zariadenie TextPad: Funkcie zabezpe\u010Denia online
bharosa.uio.default.whatsthis.DeviceTextPad.about.text=Tu n\u00E1jdete niektor\u00E9 z pokro\u010Dil\u00FDch funkci\u00ED zabezpe\u010Denia, ktor\u00E9 poskytuje zariadenie TextPad, ako aj odpovede na naj\u010Dastej\u0161ie ot\u00E1zky.

bharosa.uio.default.whatsthis.DeviceTextPad.about.question1=Pre\u010Do potrebujem osobn\u00FD obr\u00E1zok a fr\u00E1zu?
bharosa.uio.default.whatsthis.DeviceTextPad.about.answer1=Zariadenie TextPad je personalizovan\u00E9 va\u0161\u00EDm vlastn\u00FDm obr\u00E1zkom na pozad\u00ED a fr\u00E1zou. T\u00E1to personaliz\u00E1cia je z\u00E1rukou, \u017Ee m\u00F4\u017Eete bezpe\u010Dne zada\u0165 svoje heslo. Odteraz nikdy nezad\u00E1vajte heslo online, ak sa nezobraz\u00ED va\u0161e personalizovan\u00E9 zariadenie TextPad. T\u00FAto personaliz\u00E1ciu nikdy nezmen\u00EDme bez v\u00E1\u0161ho vedomia.

bharosa.uio.default.whatsthis.DeviceTextPad.about.question2=Pre\u010Do je potrebn\u00E1 t\u00E1to zmena?
bharosa.uio.default.whatsthis.DeviceTextPad.about.answer2=Neust\u00E1le h\u013Ead\u00E1me sp\u00F4soby, ako zv\u00FD\u0161i\u0165 va\u0161u bezpe\u010Dnos\u0165 pri pr\u00E1ci online. TextPad je iba jedno z viacer\u00FDch opatren\u00ED, ktor\u00E9 sme zaviedli, aby sme zv\u00FD\u0161ili bezpe\u010Dnos\u0165 pri pr\u00E1ci na na\u0161ej lokalite.

bharosa.uio.default.whatsthis.DeviceTextPad.about.question3=Na\u010Do sl\u00FA\u017Ei d\u00E1tum aktu\u00E1lnosti?
bharosa.uio.default.whatsthis.DeviceTextPad.about.answer3=Zariadenie TextPad bude ma\u0165 pri ka\u017Edom zobrazen\u00ED nov\u00FD \u010Das a d\u00E1tum. Je to \u010Fal\u0161ia z funkci\u00ED zabezpe\u010Denia, ktor\u00E1 v\u00E1s chr\u00E1ni pri pr\u00E1ci online. Pred zadan\u00EDm hesla skontrolujte, \u010Di d\u00E1tum a \u010Das nie je star\u0161\u00ED ako 24 hod\u00EDn.


