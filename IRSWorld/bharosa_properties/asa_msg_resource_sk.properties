bharosa.uio.default.whatsthis.DeviceKeyPadAlpha.whatsthis.title=\u010Co je to?
bharosa.uio.default.whatsthis.DeviceKeyPadAlpha.whatsthis.text1=KeyPad je virtu\u00E1lne zariadenie, ktor\u00E9 poskytuje zv\u00FD\u0161en\u00FA ochranu pred kr\u00E1de\u017Eou identity online.
bharosa.uio.default.whatsthis.DeviceKeyPadAlpha.whatsthis.text2=KeyPad umo\u017E\u0148uje zada\u0165 heslo nieko\u013Ek\u00FDmi kliknutiami my\u0161ou, tak\u017Ee nemus\u00EDte pou\u017E\u00EDva\u0165 kl\u00E1vesy na kl\u00E1vesnici. Takto budete chr\u00E1nen\u00ED pred mnoh\u00FDmi hrozbami spojen\u00FDmi s pr\u00E1cou online.

bharosa.uio.default.whatsthis.DeviceKeyPadAlpha.about.title=Zariadenie KeyPad: Funkcie zabezpe\u010Denia online
bharosa.uio.default.whatsthis.DeviceKeyPadAlpha.about.text=Tu n\u00E1jdete niektor\u00E9 z pokro\u010Dil\u00FDch funkci\u00ED zabezpe\u010Denia, ktor\u00E9 poskytuje zariadenie KeyPad, ako aj odpovede na naj\u010Dastej\u0161ie ot\u00E1zky.

bharosa.uio.default.whatsthis.DeviceKeyPadAlpha.about.question1=Pre\u010Do potrebujem osobn\u00FD obr\u00E1zok a fr\u00E1zu?
bharosa.uio.default.whatsthis.DeviceKeyPadAlpha.about.answer1=Zariadenie KeyPad je personalizovan\u00E9 va\u0161\u00EDm vlastn\u00FDm obr\u00E1zkom na pozad\u00ED a fr\u00E1zou. T\u00E1to personaliz\u00E1cia je z\u00E1rukou, \u017Ee m\u00F4\u017Eete bezpe\u010Dne zada\u0165 svoje heslo. Odteraz nikdy nezad\u00E1vajte heslo online, ak sa nezobraz\u00ED va\u0161e personalizovan\u00E9 zariadenie KeyPad. T\u00FAto personaliz\u00E1ciu nikdy nezmen\u00EDme bez v\u00E1\u0161ho vedomia.

bharosa.uio.default.whatsthis.DeviceKeyPadAlpha.about.question2=Pre\u010Do sa kl\u00E1vesy premiest\u0148uj\u00FA?
bharosa.uio.default.whatsthis.DeviceKeyPadAlpha.about.answer2=Kl\u00E1vesy zariadenia KeyPad sa pri ka\u017Edom prihl\u00E1sen\u00ED premiestnia na in\u00E9 miesto v r\u00E1m\u010Deku. Ide o \u010Fal\u0161ie bezpe\u010Dnostn\u00E9 opatrenie.

bharosa.uio.default.whatsthis.DeviceKeyPadAlpha.about.question3=Na\u010Do sl\u00FA\u017Ei d\u00E1tum aktu\u00E1lnosti?
bharosa.uio.default.whatsthis.DeviceKeyPadAlpha.about.answer3=Zariadenie KeyPad bude ma\u0165 pri ka\u017Edom zobrazen\u00ED nov\u00FD \u010Das a d\u00E1tum. Je to \u010Fal\u0161ia z funkci\u00ED zabezpe\u010Denia, ktor\u00E1 v\u00E1s chr\u00E1ni pri pr\u00E1ci online. Pred zadan\u00EDm hesla skontrolujte, \u010Di d\u00E1tum a \u010Das nie je star\u0161\u00ED ako 24 hod\u00EDn.


