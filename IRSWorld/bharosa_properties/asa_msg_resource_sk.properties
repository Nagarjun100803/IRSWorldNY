bharosa.uio.default.whatsthis.DeviceQuestionPad.whatsthis.title=\u010Co je to?
bharosa.uio.default.whatsthis.DeviceQuestionPad.whatsthis.text1=QuestionPad je virtu\u00E1lne zariadenie, ktor\u00E9 poskytuje zv\u00FD\u0161en\u00FA ochranu pred kr\u00E1de\u017Eou identity online.
