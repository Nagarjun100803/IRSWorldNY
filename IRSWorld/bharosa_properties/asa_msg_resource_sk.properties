bharosa.uio.default.whatsthis.DeviceQuestionPad.about.question1=Pre\u010Do potrebujem osobn\u00FD obr\u00E1zok a fr\u00E1zu?
bharosa.uio.default.whatsthis.DeviceQuestionPad.about.answer1=Zariadenie QuestionPad je personalizovan\u00E9 va\u0161\u00EDm vlastn\u00FDm obr\u00E1zkom na pozad\u00ED a fr\u00E1zou. T\u00E1to personaliz\u00E1cia je z\u00E1rukou, \u017Ee m\u00F4\u017Eete bezpe\u010Dne zada\u0165 odpovede na bezpe\u010Dnostn\u00E9 ot\u00E1zky. Odteraz nikdy nezad\u00E1vajte odpovede online, ak sa nezobraz\u00ED va\u0161e personalizovan\u00E9 zariadenie QuestionPad. T\u00FAto personaliz\u00E1ciu nikdy nezmen\u00EDme bez v\u00E1\u0161ho vedomia.

bharosa.uio.default.whatsthis.DeviceQuestionPad.about.question2=Pre\u010Do je potrebn\u00E1 t\u00E1to zmena?
bharosa.uio.default.whatsthis.DeviceQuestionPad.about.answer2=Neust\u00E1le h\u013Ead\u00E1me sp\u00F4soby, ako zv\u00FD\u0161i\u0165 va\u0161u bezpe\u010Dnos\u0165 pri pr\u00E1ci online. QuestionPad je iba jedno z viacer\u00FDch opatren\u00ED, ktor\u00E9 sme zaviedli, aby sme zv\u00FD\u0161ili bezpe\u010Dnos\u0165 pri pr\u00E1ci na na\u0161ej lokalite.

