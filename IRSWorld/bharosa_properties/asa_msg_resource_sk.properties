bharosa.uio.default.register.info.title=Nov\u00FD profil zabezpe\u010Denia
bharosa.uio.default.register.info.message=Nastaven\u00EDm nov\u00E9ho profilu zabezpe\u010Denia zv\u00FD\u0161ite svoju ochranu pri pr\u00E1ci online.<br>Tento profil n\u00E1m pom\u00F4\u017Ee identifikova\u0165 v\u00E1s a prida\u0165 nov\u00E9 vrstvy zabezpe\u010Denia pre va\u0161e konto, a z\u00E1rove\u0148 v\u00E1m pom\u00F4\u017Ee identifikova\u0165 na\u0161u lokalitu.

bharosa.uio.default.register.info.section1.title=Krok 1: Zabezpe\u010Denie - Obr\u00E1zok alebo fr\u00E1za
bharosa.uio.default.register.info.section1.subtitle=Zv\u00FD\u0161en\u00E9 zabezpe\u010Denie d\u00E1t
bharosa.uio.default.register.info.section1.message=Va\u0161e nov\u00E9 personalizovan\u00E9 zabezpe\u010Dovacie zariadenia zv\u00FD\u0161ia va\u0161u ochranu pri online bankovn\u00EDctve. Inform\u00E1cie, ktor\u00E9 budete zad\u00E1va\u0165, s\u00FA chr\u00E1nen\u00E9 pred mnoh\u00FDmi bezpe\u010Dnostn\u00FDmi hrozbami, ktor\u00E9 dnes existuj\u00FA. Obr\u00E1zok, fr\u00E1za a d\u00E1tum z\u00E1rove\u0148 sl\u00FA\u017Eia ako d\u00F4kaz, \u017Ee sa nach\u00E1dzate na na\u0161ej ofici\u00E1lnej lokalite.

bharosa.uio.default.register.info.section2.title=Krok 2: Zabezpe\u010Denie - Ot\u00E1zky a odpovede
bharosa.uio.default.register.info.section2.subtitle=\u010Eal\u0161ia vrstva zabezpe\u010Denia
bharosa.uio.default.register.info.section2.message=Na pridanie \u010Fal\u0161ej vrstvy zabezpe\u010Denia je potrebn\u00E9 zaregistrova\u0165 tri bezpe\u010Dnostn\u00E9 ot\u00E1zky. Ak sa v bud\u00FAcnosti vyskytne potenci\u00E1lne rizikov\u00E1 situ\u00E1cia, m\u00F4\u017Eeme v\u00E1m prostredn\u00EDctvom v\u00E1\u0161ho personalizovan\u00E9ho zariadenia polo\u017Ei\u0165 jednu z t\u00FDchto ot\u00E1zok. Ot\u00E1zky a odpovede by ste mali uchov\u00E1va\u0165 v tajnosti rovnako ako heslo.

