###  KeyPad Description and Directions
bharosa.autehntipad.keypad.accessibility.description = Tastatur-Pad
bharosa.authentipad.keypad.accessibility.directions = Anweisungen f\u00FCr Tastatur-Pad: Verwenden Sie die folgenden Links zur Eingabe Ihres Kennwortes. Zuerst wird Ihr personalisierter Titeltext angezeigt, gefolgt von Kontrolllinks, auf die wiederum Tastenlinks folgen. Nachdem Sie Ihr Kennwort eingegeben haben, gehen Sie mit Umschalt-Tabulatortaste zum Eingabelink zur\u00FCck, um Ihr Kennwort weiterzuleiten.
bharosa.authentipad.keypad.security.image.alt = Abbildung von Sicherheitsger\u00E4t

###  PinPad Description and Directions
bharosa.authentipad.pinpad.accessibility.description = Pin-Pad
bharosa.authentipad.pinpad.accessibility.directions = Anweisungen f\u00FCr Pin-Pad: Verwenden Sie die folgenden Links zur Eingabe Ihrer numerischen Pin. Zuerst wird Ihr personalisierter Titeltext angezeigt, gefolgt von Kontrolllinks, auf die wiederum numerische Links folgen. Nachdem Sie Ihre numerische Pin eingegeben haben, gehen Sie mit Umschalt-Tabulatortaste zum Eingabelink zur\u00FCck, um Ihre Pin weiterzuleiten.
bharosa.authentipad.pinpad.security.image.alt = Abbildung von Sicherheitsger\u00E4t

###  TextPad Description and Directions
bharosa.authentipad.textpad.accessibility.description = Text-Pad
bharosa.authentipad.textpad.accessibility.directions = Anweisungen f\u00FCr Text-Pad: Verwenden Sie die folgenden Elemente zur Validierung Ihres Ger\u00E4ts. Zuerst wird Ihr personalisierter Titeltext angezeigt, gefolgt von einem Zeitstempel, mit dem sichergestellt wird, dass das Ger\u00E4t f\u00FCr diese Session generiert wurde. Nachdem Sie Ihr Kennwort in das vorherige Kennworteingabefeld eingegeben haben, navigieren Sie mit der Tabulatortaste zum Eingabelink, um Ihr Kennwort weiterzuleiten.
bharosa.authentipad.textpad.security.image.alt = Abbildung von Sicherheitsger\u00E4t

###  TextPadReset Description and Directions
bharosa.authentipad.textpadreset.accessibility.description = Text-Pad
bharosa.authentipad.textpadreset.accessibility.directions = Anweisungen f\u00FCr Text-Pad: Verwenden Sie die folgenden Elemente zur Eingabe Ihres neuen Kennwortes. Zuerst wird der personalisierte Titeltext angezeigt, gefolgt von einem Kennworteingabefeld und einem Kennwortbest\u00E4tigungsfeld. Nachdem Sie Ihr Kennwort eingegeben haben, navigieren Sie mit der Tabulatortaste zum Eingabelink, um Ihr neues Kennwort weiterzuleiten.
bharosa.authentipad.textpadreset.security.image.alt = Abbildung von Sicherheitsger\u00E4t

