bharosa.authentipad.captionpad.accessibility.description = Titel-Pad
bharosa.authentipad.captionpad.accessibility.directions = Anweisungen f\u00FCr Titel-Pad: Verwenden Sie die folgenden Elemente zur Eingabe des neuen Titeltextes. Als erstes werden Kontrolllinks angezeigt, gefolgt von einem Texteingabefeld. Nachdem Sie die \u00DCberschrift eingegeben haben, navigieren Sie mit der Tabulatortaste zum Eingabelink, um die neue \u00DCberschrift weiterzuleiten.
bharosa.authentipad.captionpad.security.image.alt = Abbildung von Sicherheitsger\u00E4t

