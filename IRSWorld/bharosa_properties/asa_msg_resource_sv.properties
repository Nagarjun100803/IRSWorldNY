bharosa.uio.default.whatsthis.DevicePinPad.about.text=H\u00E4r \u00E4r n\u00E5gra av de avancerade s\u00E4kerhetsfunktioner som associeras med PIN-satsen samt svar p\u00E5 dina vanligaste fr\u00E5gor.

bharosa.uio.default.whatsthis.DevicePinPad.about.question1=Varf\u00F6r beh\u00F6ver jag en personlig bild och fras?
bharosa.uio.default.whatsthis.DevicePinPad.about.answer1=PIN-satsen \u00E4r anpassad med din egen bakgrundsbild och fras. Denna anpassning f\u00F6rs\u00E4krar att det \u00E4r s\u00E4kert att ange din PIN-kod. Fr\u00E5n och med nu ska du aldrig ange PIN-koden online om du inte ser din anpassade PIN-sats. Vi kommer aldrig att \u00E4ndra din anpassade PIN-sats utan att meddela dig.

bharosa.uio.default.whatsthis.DevicePinPad.about.question2=Varf\u00F6r r\u00F6r sig tangenterna?
bharosa.uio.default.whatsthis.DevicePinPad.about.answer2=Tangenterna p\u00E5 PIN-satsen flyttas till en annan plats inom ramen varje g\u00E5ng du loggar in. Detta \u00E4r ytterligare en s\u00E4kerhets\u00E5tg\u00E4rd.

bharosa.uio.default.whatsthis.DevicePinPad.about.question3=Vad anv\u00E4nds f\u00F6rnyelsedatum till?
bharosa.uio.default.whatsthis.DevicePinPad.about.answer3=Varje g\u00E5ng PIN-satsen visas har den ett nytt datum och ny tid. Detta \u00E4r ytterligare en s\u00E4kerhetsfunktion f\u00F6r att s\u00E4kerst\u00E4lla din s\u00E4kerhet online. Innan du anger koden kontrollerar du att datum och tid inte \u00E4r \u00E4ldre \u00E4n 24 timmar.

