bharosa.uio.default.register.info.title=Din nya s\u00E4kerhetsprofil
bharosa.uio.default.register.info.message=Om du st\u00E4ller in din nya s\u00E4kerhetsprofil \u00F6kar du ditt skydd online .<br>Det ger ditt konto en ny s\u00E4kerhetsniv\u00E5 eftersom vi kan k\u00E4nna igen dig - och du kan l\u00E4ttare k\u00E4nna igen oss.

bharosa.uio.default.register.info.section1.title=Steg 1: S\u00E4kerhetsbild och s\u00E4kerhetsfras
bharosa.uio.default.register.info.section1.subtitle=F\u00F6rb\u00E4ttrad datas\u00E4kerhet
bharosa.uio.default.register.info.section1.message=Ditt nya anpassade s\u00E4kerhetshj\u00E4lpmedel hj\u00E4lper till att skydda dig samtidigt som den bankinformation du anger online skyddas fr\u00E5n m\u00E5nga av de s\u00E4kerhetshot som finns idag. Samtidigt utg\u00F6r bilden, frasen och datum bevis p\u00E5 att du \u00E4r p\u00E5 v\u00E5r officiella hemsida.

bharosa.uio.default.register.info.section2.title=Steg 2: S\u00E4kerhetsfr\u00E5gor och svar
bharosa.uio.default.register.info.section2.subtitle=Ytterligare s\u00E4kerhetsniv\u00E5
bharosa.uio.default.register.info.section2.message=Du registrerar tre s\u00E4kerhetsfr\u00E5gor f\u00F6r att l\u00E4gga till ytterligare s\u00E4kerhetsniv\u00E5er. I framtiden kommer vi st\u00E4lla en av dessa fr\u00E5gor med din personliga enhet om en situation verkar riskfylld. De h\u00E4r fr\u00E5gorna och svaren b\u00F6r, precis som ditt l\u00F6senord, f\u00F6rvaras p\u00E5 ett s\u00E4kert st\u00E4lle.

