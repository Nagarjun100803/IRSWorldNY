bharosa.uio.default.whatsthis.DeviceTextPad.pagetitle=Om textsatsen
bharosa.uio.default.whatsthis.DeviceTextPad.title=Anv\u00E4nda textsatsen: Instruktioner

bharosa.uio.default.whatsthis.DeviceTextPad.whatsthis.title=Vad \u00E4r detta?
bharosa.uio.default.whatsthis.DeviceTextPad.whatsthis.text1=Textsatsen \u00E4r en virtuell enhet som ger dig avancerat s\u00E4kerhetsskydd mot identitetsst\u00F6lder online.
bharosa.uio.default.whatsthis.DeviceTextPad.whatsthis.text2=P\u00E5 textsatsen kan du ange l\u00F6senordet via ditt vanliga tangentbord. Textsatsen hj\u00E4lper till att skydda dig fr\u00E5n att oavsiktligt ange k\u00E4nslig information p\u00E5 en bedr\u00E4glig webbplats.

bharosa.uio.default.whatsthis.DeviceTextPad.about.title=Om textsatsen: S\u00E4kerhetsfunktioner online
bharosa.uio.default.whatsthis.DeviceTextPad.about.text=H\u00E4r \u00E4r n\u00E5gra av de avancerade s\u00E4kerhetsfunktioner som associeras med textsatsen samt svar p\u00E5 dina vanligaste fr\u00E5gor.

bharosa.uio.default.whatsthis.DeviceTextPad.about.question1=Varf\u00F6r beh\u00F6ver jag en personlig bild och fras?
bharosa.uio.default.whatsthis.DeviceTextPad.about.answer1=Textsatsen \u00E4r anpassad med din egen bakgrundsbild och fras. Denna anpassning f\u00F6rs\u00E4krar att det \u00E4r s\u00E4kert att ange ditt l\u00F6senord. Fr\u00E5n och med nu ska du aldrig ange l\u00F6senordet online om du inte ser din anpassade textsats. Vi kommer aldrig att \u00E4ndra din anpassade textsats utan att meddela dig.

bharosa.uio.default.whatsthis.DeviceTextPad.about.question2=Varf\u00F6r \u00E4ndringen?
bharosa.uio.default.whatsthis.DeviceTextPad.about.answer2=Vi s\u00F6ker alltid efter olika s\u00E4tt att g\u00F6ra din onlineupplevelse s\u00E4krare. Textsatsen \u00E4r bara ett av de m\u00E5nga m\u00E5tt vi har vidtagit f\u00F6r att f\u00F6rb\u00E4ttra s\u00E4kerheten n\u00E4r du \u00E4r p\u00E5 v\u00E5r webbplats.

bharosa.uio.default.whatsthis.DeviceTextPad.about.question3=Vad anv\u00E4nds f\u00F6rnyelsedatum till?
bharosa.uio.default.whatsthis.DeviceTextPad.about.answer3=Varje g\u00E5ng textsatsen visas har den ett nytt datum och ny tid. Detta \u00E4r ytterligare en s\u00E4kerhetsfunktion f\u00F6r att s\u00E4kerst\u00E4lla din s\u00E4kerhet online. Innan du anger l\u00F6senordet kontrollerar du att datum och tid inte \u00E4r \u00E4ldre \u00E4n 24 timmar.


