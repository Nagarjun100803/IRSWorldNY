bharosa.uio.default.whatsthis.DeviceQuestionPad.whatsthis.title=Vad \u00E4r detta?
bharosa.uio.default.whatsthis.DeviceQuestionPad.whatsthis.text1=Fr\u00E5gesatsen \u00E4r en virtuell enhet som ger dig avancerat s\u00E4kerhetsskydd mot identitetsst\u00F6lder online.
bharosa.uio.default.whatsthis.DeviceQuestionPad.whatsthis.text2=Med fr\u00E5gesatsen kan du besvara s\u00E4kerhetsfr\u00E5gor via ditt vanliga tangentbord. Fr\u00E5gesats hj\u00E4lper till att skydda dig fr\u00E5n att oavsiktligt ange k\u00E4nslig information p\u00E5 en bedr\u00E4glig webbplats.

bharosa.uio.default.whatsthis.DeviceQuestionPad.about.title=Om fr\u00E5gesatsen: S\u00E4kerhetsfunktioner online
bharosa.uio.default.whatsthis.DeviceQuestionPad.about.text=H\u00E4r \u00E4r n\u00E5gra av de avancerade s\u00E4kerhetsfunktioner som associeras med fr\u00E5gesatsen samt svar p\u00E5 dina vanligaste fr\u00E5gor.

bharosa.uio.default.whatsthis.DeviceQuestionPad.about.question1=Varf\u00F6r beh\u00F6ver jag en personlig bild och fras?
bharosa.uio.default.whatsthis.DeviceQuestionPad.about.answer1=Fr\u00E5gesatsen \u00E4r anpassad med din egen bakgrundsbild och fras. Denna anpassning f\u00F6rs\u00E4krar att det \u00E4r s\u00E4kert att besvara dina s\u00E4kerhetsfr\u00E5gor. Fr\u00E5n och med nu ska du aldrig ange n\u00E5gra svar online om inte din anpassade fr\u00E5gesats visas. Vi kommer aldrig att \u00E4ndra din anpassade fr\u00E5gesats utan att meddela dig.

bharosa.uio.default.whatsthis.DeviceQuestionPad.about.question2=Varf\u00F6r \u00E4ndringen?
bharosa.uio.default.whatsthis.DeviceQuestionPad.about.answer2=Vi s\u00F6ker alltid efter olika s\u00E4tt att g\u00F6ra din onlineupplevelse s\u00E4krare. Fr\u00E5gesatsen \u00E4r bara ett av de m\u00E5nga m\u00E5tt vi har vidtagit f\u00F6r att f\u00F6rb\u00E4ttra s\u00E4kerheten n\u00E4r du \u00E4r p\u00E5 v\u00E5r webbplats.

bharosa.uio.default.whatsthis.DeviceQuestionPad.about.question3=Vad anv\u00E4nds f\u00F6rnyelsedatum till?
bharosa.uio.default.whatsthis.DeviceQuestionPad.about.answer3=Varje g\u00E5ng fr\u00E5gesatsen visas har den ett nytt datum och ny tid. Detta \u00E4r ytterligare en s\u00E4kerhetsfunktion f\u00F6r att s\u00E4kerst\u00E4lla din s\u00E4kerhet online. Innan du anger svaret kontrollerar du att datum och tid inte \u00E4r \u00E4ldre \u00E4n 24 timmar.

