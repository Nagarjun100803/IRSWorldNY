bharosa.uio.default.messages.enum.wherepassword.name=Hol kell megadni a jelsz\u00F3t?
bharosa.uio.default.messages.enum.wherepassword.description=Fejleszt\u00E9st v\u00E9gezt\u00FCnk a biztons\u00E1g ter\u00E9n annak \u00E9rdek\u00E9ben, hogy nagyobb v\u00E9delmet ny\u00FAjtsunk az online banki m\u0171veletek sor\u00E1n. Ezent\u00FAl el\u0151sz\u00F6r meg kell adnia felhaszn\u00E1l\u00F3nev\u00E9t, majd egy m\u00E1sik oldalon a jelszav\u00E1t.

bharosa.uio.default.messages.enum.notimage.name=Ez nem az \u00D6n k\u00E9pe vagy mondata?
bharosa.uio.default.messages.enum.notimage.description=Ha a k\u00E9perny\u0151n megjelen\u0151 eszk\u00F6z nem az \u00D6n szem\u00E9lyre szabott k\u00E9p\u00E9t vagy mondat\u00E1t mutatja, ellen\u0151rizze, hogy helyes felhaszn\u00E1l\u00F3nevet adott-e meg. Ha felhaszn\u00E1l\u00F3nev\u00E9t helyesen adta meg, m\u00E9gsem a szem\u00E9lyre szabott eszk\u00F6zt l\u00E1tja, forduljon az \u00FCgyf\u00E9lszolg\u00E1lathoz. K\u00F6sz\u00F6nj\u00FCk.

bharosa.uio.default.messages.enum.forgotanswer.name=Elfelejtette a v\u00E1laszt?
bharosa.uio.default.messages.enum.forgotanswer.description=Ha elfelejtette a biztons\u00E1gi k\u00E9rd\u00E9sekre adand\u00F3 v\u00E1laszokat, forduljon az \u00FCgyf\u00E9lszolg\u00E1lathoz. K\u00F6sz\u00F6nj\u00FCk.


