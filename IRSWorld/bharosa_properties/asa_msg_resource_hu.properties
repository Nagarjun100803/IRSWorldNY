bharosa.uio.default.whatsthis.DeviceKeyPadFull.whatsthis.title=Mi ez?
bharosa.uio.default.whatsthis.DeviceKeyPadFull.whatsthis.text1=A Billenty\u0171zet-k\u00E9perny\u0151 olyan virtu\u00E1lis eszk\u00F6z, amely fokozott v\u00E9delmet ny\u00FAjt az online azonoss\u00E1glop\u00E1s ellen.
bharosa.uio.default.whatsthis.DeviceKeyPadFull.whatsthis.text2=A Billenty\u0171zet-k\u00E9perny\u0151 lehet\u0151v\u00E9 teszi, hogy jelszav\u00E1t a norm\u00E1l billenty\u0171zet helyett eg\u00E9rkattint\u00E1sokkal adja meg. Ez t\u00F6bbf\u00E9le online vissza\u00E9l\u00E9s ellen jelent v\u00E9delmet.

bharosa.uio.default.whatsthis.DeviceKeyPadFull.about.title=Tudnival\u00F3k a Billenty\u0171zet-k\u00E9perny\u0151r\u0151l: Online biztons\u00E1gi szolg\u00E1ltat\u00E1sok
bharosa.uio.default.whatsthis.DeviceKeyPadFull.about.text=A k\u00F6vetkez\u0151kben a Billenty\u0171zet-k\u00E9perny\u0151h\u00F6z kapcsol\u00F3d\u00F3, fokozott biztons\u00E1got ny\u00FAjt\u00F3 szolg\u00E1ltat\u00E1sokr\u00F3l olvashat, \u00E9s v\u00E1laszt kaphat a leggyakrabban felmer\u00FCl\u0151 k\u00E9rd\u00E9sekre.

bharosa.uio.default.whatsthis.DeviceKeyPadFull.about.question1=Mi\u00E9rt van sz\u00FCks\u00E9g szem\u00E9lyes k\u00E9pre \u00E9s mondatra?
bharosa.uio.default.whatsthis.DeviceKeyPadFull.about.answer1=A Billenty\u0171zet-k\u00E9perny\u0151t az \u00D6n \u00E1ltal v\u00E1lasztott h\u00E1tt\u00E9rk\u00E9ppel \u00E9s mondattal szabjuk szem\u00E9lyre. A szem\u00E9lyre szabott megjelen\u00E9s garant\u00E1lja, hogy jelszav\u00E1t biztons\u00E1gosan megadhatja.  Ezent\u00FAl online m\u00F3don kiz\u00E1r\u00F3lag akkor adja meg jelszav\u00E1t, ha a szem\u00E9lyre szabott Billenty\u0171zet-k\u00E9perny\u0151t l\u00E1tja. A szem\u00E9lyre szabott megjelen\u00E9st az \u00D6n tudom\u00E1sa n\u00E9lk\u00FCl sosem m\u00F3dos\u00EDtjuk.

bharosa.uio.default.whatsthis.DeviceKeyPadFull.about.question2=Mi\u00E9rt v\u00E1ltozik a gombok helye?
bharosa.uio.default.whatsthis.DeviceKeyPadFull.about.answer2=A Billenty\u0171zet-k\u00E9perny\u0151 gombjai a nagyobb biztons\u00E1g \u00E9rdek\u00E9ben minden bejelentkez\u00E9skor m\u00E1s helyen jelennek meg.

bharosa.uio.default.whatsthis.DeviceKeyPadFull.about.question3=Mi a szerepe a friss\u00EDtett d\u00E1tumnak?
bharosa.uio.default.whatsthis.DeviceKeyPadFull.about.answer3=A Billenty\u0171zet-k\u00E9perny\u0151n minden alkalommal friss d\u00E1tum \u00E9s id\u0151pont l\u00E1that\u00F3. Ez az egyik m\u00F3dszer az online biztons\u00E1g n\u00F6vel\u00E9s\u00E9re. Miel\u0151tt be\u00EDrja jelszav\u00E1t, ellen\u0151rizze, hogy az id\u0151pont 24 \u00F3r\u00E1n\u00E1l nem r\u00E9gebbi-e.


