bharosa.uio.default.register.info.title=Az \u00D6n biztons\u00E1gi profilja
bharosa.uio.default.register.info.message=Az \u00FAj biztons\u00E1gi profil be\u00E1ll\u00EDt\u00E1s\u00E1val fokozhatja online v\u00E9delm\u00E9t. <br>Fi\u00F3kj\u00E1t \u00FAjabb biztons\u00E1gi r\u00E9tegekkel er\u0151s\u00EDtheti meg, amelyek seg\u00EDts\u00E9g\u00E9vel \u00D6n \u00E9s webhely\u00FCnk k\u00F6lcs\u00F6n\u00F6sen azonos\u00EDtani tudj\u00E1k egym\u00E1st.

bharosa.uio.default.register.info.section1.title=1. l\u00E9p\u00E9s: Biztons\u00E1gi k\u00E9p \u00E9s mondat
bharosa.uio.default.register.info.section1.subtitle=Fokozott adatbiztons\u00E1g
bharosa.uio.default.register.info.section1.message=Az \u00FAj, szem\u00E9lyre szabott biztons\u00E1gi eszk\u00F6z\u00F6k fokozott v\u00E9delmet ny\u00FAjtanak az online banki m\u0171veletek sor\u00E1n. A bevitt adatok napjaink legt\u00F6bb biztons\u00E1gi kock\u00E1zata ellen v\u00E9delmet \u00E9lveznek. Emellett a k\u00E9p, a mondat \u00E9s a d\u00E1tum is igazolja, hogy \u00D6n a mi hivatalos webhely\u00FCnk\u00F6n j\u00E1r.

bharosa.uio.default.register.info.section2.title=2. l\u00E9p\u00E9s: Biztons\u00E1gi k\u00E9rd\u00E9sek \u00E9s v\u00E1laszok
bharosa.uio.default.register.info.section2.subtitle=Tov\u00E1bbi biztons\u00E1gi r\u00E9teg
bharosa.uio.default.register.info.section2.message=H\u00E1rom biztons\u00E1gi k\u00E9rd\u00E9st kell megadnia, amely tov\u00E1bbi biztons\u00E1gi r\u00E9teget k\u00E9pez. A k\u00E9s\u0151bbiekben, ha a m\u0171velet kock\u00E1zatosnak t\u0171nik, e h\u00E1rom k\u00E9rd\u00E9s k\u00F6z\u00FCl fogunk feltenni egyet a szem\u00E9lyre szabott eszk\u00F6z\u00F6n kereszt\u00FCl. A k\u00E9rd\u00E9seket \u00E9s a v\u00E1laszokat a jelsz\u00F3hoz hasonl\u00F3an titokban kell tartani.

