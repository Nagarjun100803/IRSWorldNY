################## Authenticator Registration option links #############
# The following properties are used to generate messages with links in them which the user uses to make authenticator registration choices.
# "message" is the overall string with "{0}" indicating where in the string the link for taking action will be placed,
# "link.text" is the text used as the link inside the "message".

# Usage Example(s) 
# 1. Learn more about your device
bharosa.uio.default.register.authenticator.learnmore.message={0} \u05E2\u05DC \u05D4\u05D4\u05EA\u05E7\u05DF \u05E9\u05DC\u05DA
bharosa.uio.default.register.authenticator.learnmore.link.text=\u05DC\u05DE\u05D3 \u05E2\u05D5\u05D3

# Usage Example(s) 
# 1. Get a new image and phrase
bharosa.uio.default.register.authenticator.changeimage.message=\u05E7\u05D1\u05DC {0} \u05D7\u05D3\u05E9\u05D9\u05DD
bharosa.uio.default.register.authenticator.changeimage.link.text=\u05EA\u05DE\u05D5\u05E0\u05D4 \u05D5\u05DE\u05E9\u05E4\u05D8

# Usage Example(s) 
# 1. Upgrade to a higher security device
bharosa.uio.default.register.authenticator.upgrade.message={0} \u05DC\u05D4\u05EA\u05E7\u05DF \u05D0\u05D1\u05D8\u05D7\u05D4 \u05D1\u05E8\u05DE\u05D4 \u05D2\u05D1\u05D5\u05D4\u05D4 \u05D9\u05D5\u05EA\u05E8
bharosa.uio.default.register.authenticator.upgrade.link.text=\u05E9\u05D3\u05E8\u05D2

# Usage Example(s) 
# 1. Revert to the default security device
bharosa.uio.default.register.authenticator.downgrade.message={0} \u05DC\u05D1\u05E8\u05D9\u05E8\u05EA \u05D4\u05DE\u05D7\u05D3\u05DC \u05E9\u05DC \u05D4\u05EA\u05E7\u05DF \u05D0\u05D1\u05D8\u05D7\u05D4
bharosa.uio.default.register.authenticator.downgrade.link.text=\u05D7\u05D6\u05D5\u05E8

