################## User Preferences option links #############
# The following properties are used to generate messages with links in them which the user uses to make user preference choices
# "message" is the overall string with "{0}" indicating where in the string the link for taking action will be placed,
# "link.text" is the text used as the link inside the "message".

# Usage Example(s) 
# 1. Learn more about your device
bharosa.uio.default.userpreferences.learnmore.message={0} \u05E2\u05DC \u05D4\u05D4\u05EA\u05E7\u05DF \u05E9\u05DC\u05DA
bharosa.uio.default.userpreferences.learnmore.link.text=\u05DC\u05DE\u05D3 \u05E2\u05D5\u05D3

# Usage Example(s) 
# 1. Get a new image and phrase
