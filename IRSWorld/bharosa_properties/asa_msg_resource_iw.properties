bharosa.uio.default.userpreferences.changeimage.link.text=\u05EA\u05DE\u05D5\u05E0\u05D4 \u05D5\u05DE\u05E9\u05E4\u05D8

# Usage Example(s) 
# 1. Upgrade to a higher security device
bharosa.uio.default.userpreferences.upgrade.message={0} \u05DC\u05D4\u05EA\u05E7\u05DF \u05D0\u05D1\u05D8\u05D7\u05D4 \u05D1\u05E8\u05DE\u05D4 \u05D2\u05D1\u05D5\u05D4\u05D4 \u05D9\u05D5\u05EA\u05E8
bharosa.uio.default.userpreferences.upgrade.link.text=\u05E9\u05D3\u05E8\u05D2

# Usage Example(s) 
# 1. Revert to the default security device
bharosa.uio.default.userpreferences.downgrade.message={0} \u05DC\u05D1\u05E8\u05D9\u05E8\u05EA \u05D4\u05DE\u05D7\u05D3\u05DC \u05E9\u05DC \u05D4\u05EA\u05E7\u05DF \u05D0\u05D1\u05D8\u05D7\u05D4
bharosa.uio.default.userpreferences.downgrade.link.text=\u05D7\u05D6\u05D5\u05E8

# Usage Example(s) 
# 1. Reset your challenge questions
