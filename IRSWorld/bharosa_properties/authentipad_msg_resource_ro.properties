bharosa.authentipad.textpad.accessibility.directions = Instruc\u0163iuni pentru panoul pentru text: Utiliza\u0163i urm\u0103toarele elemente pentru a valida dispozitivul dvs. Textul dvs. personalizat pentru titlu apare primul, urmat de un marcaj temporal pentru confirmare c\u0103 acest dispozitiv a fost generat pentru aceast\u0103 sesiune. Dup\u0103 ce a\u0163i introdus parola \u00EEn c\u00E2mpul de introducere a parolei anterior, utiliza\u0163i tasta tab pentru a naviga la leg\u0103tura de confirmare (enter) pentru a parola dvs.
bharosa.authentipad.textpad.security.image.alt = Imagine pentru dispozitiv de securitate

