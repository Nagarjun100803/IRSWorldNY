
#/oam/apps/bharosa_client.properties.net.sample
#Copy this file to bharosa_client.properties and customize it

#Customize for pointing to the correct servlet to get the keypad image
bharosa.authentipad.image.url=GetImage.aspx?

#Customize for pointing to the correct servlet for fingerprinting requests
bharosa.fingerprint.url=CookieManager.aspx?

#Customize for pointing to the correct path to the images
bharosa.authentipad.static.image.url=/bharosa_web/images/

vcrypt.soap.auth=false
vcrypt.tracker.soap.url=%vcrypt.soap.url%
vcrypt.tracker.soap.useSOAPServer=true

bharosa.globalization.set.thread.currentCulture=false
bharosa.globalization.set.thread.currentUICulture=false

# Success Page message
bharosa.success.page.message.authentication=Login Successful!
bharosa.success.page.message.transaction=Transaction Successful!

# Success Page links
bharosa.success.page.link.enum=Enum for dynamically generating links

bharosa.success.page.link.enum.logout=1
bharosa.success.page.link.enum.logout.name=Logout
bharosa.success.page.link.enum.logout.description=Will close the session and redirect to login page.
bharosa.success.page.link.enum.logout.url=LogoutPage.aspx
bharosa.success.page.link.enum.logout.order=1

bharosa.success.page.link.enum.transactions=2
bharosa.success.page.link.enum.transactions.name=Transactions
bharosa.success.page.link.enum.transactions.description=Redirect the user to the transactions page
bharosa.success.page.link.enum.transactions.url=TransactionPage.aspx
bharosa.success.page.link.enum.transactions.order=2

