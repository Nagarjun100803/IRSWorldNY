################## Authenticator Registration option links #############
# The following properties are used to generate messages with links in them which the user uses to make authenticator registration choices.
# "message" is the overall string with "{0}" indicating where in the string the link for taking action will be placed,
# "link.text" is the text used as the link inside the "message".

# Usage Example(s) 
# 1. Learn more about your device
bharosa.uio.default.register.authenticator.learnmore.message={0} \u03C0\u03BB\u03B7\u03C1\u03BF\u03C6\u03BF\u03C1\u03AF\u03B5\u03C2 \u03C3\u03C7\u03B5\u03C4\u03B9\u03BA\u03AC \u03BC\u03B5 \u03C4\u03B7 \u03C3\u03C5\u03C3\u03BA\u03B5\u03C5\u03AE \u03C3\u03B1\u03C2
bharosa.uio.default.register.authenticator.learnmore.link.text=\u03A0\u03B5\u03C1\u03B9\u03C3\u03C3\u03CC\u03C4\u03B5\u03C1\u03B5\u03C2 \u03C0\u03BB\u03B7\u03C1\u03BF\u03C6\u03BF\u03C1\u03AF\u03B5\u03C2

# Usage Example(s) 
# 1. Get a new image and phrase
bharosa.uio.default.register.authenticator.changeimage.message=\u039B\u03AE\u03C8\u03B7 \u03BD\u03AD\u03B1\u03C2 {0}
bharosa.uio.default.register.authenticator.changeimage.link.text=\u03B5\u03B9\u03BA\u03CC\u03BD\u03B1\u03C2 \u03BA\u03B1\u03B9 \u03C6\u03C1\u03AC\u03C3\u03B7\u03C2

# Usage Example(s) 
# 1. Upgrade to a higher security device
bharosa.uio.default.register.authenticator.upgrade.message={0} \u03C3\u03B5 \u03C3\u03C5\u03C3\u03BA\u03B5\u03C5\u03AE \u03C5\u03C8\u03B7\u03BB\u03CC\u03C4\u03B5\u03C1\u03B7\u03C2 \u03B1\u03C3\u03C6\u03B1\u03BB\u03B5\u03AF\u03B1\u03C2
