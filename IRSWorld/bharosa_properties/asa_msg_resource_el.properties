bharosa.uio.default.whatsthis.DeviceQuestionPad.about.answer1=\u03A4\u03BF QuestionPad \u03C0\u03C1\u03BF\u03C3\u03B1\u03C1\u03BC\u03CC\u03B6\u03B5\u03C4\u03B1\u03B9 \u03BC\u03B5 \u03C4\u03B7 \u03B4\u03B9\u03BA\u03AE \u03C3\u03B1\u03C2 \u03B5\u03B9\u03BA\u03CC\u03BD\u03B1 \u03C6\u03CC\u03BD\u03C4\u03BF\u03C5 \u03BA\u03B1\u03B9 \u03C6\u03C1\u03AC\u03C3\u03B7. \u0397 \u03C0\u03C1\u03BF\u03C3\u03B1\u03C1\u03BC\u03BF\u03B3\u03AE \u03B1\u03C5\u03C4\u03AE \u03B1\u03C0\u03BF\u03C4\u03B5\u03BB\u03B5\u03AF \u03B4\u03B9\u03B1\u03B2\u03B5\u03B2\u03B1\u03AF\u03C9\u03C3\u03B7 \u03CC\u03C4\u03B9 \u03BC\u03C0\u03BF\u03C1\u03B5\u03AF\u03C4\u03B5 \u03BD\u03B1 \u03B1\u03C0\u03B1\u03BD\u03C4\u03AE\u03C3\u03B5\u03C4\u03B5 \u03C4\u03B9\u03C2 \u03B5\u03C1\u03C9\u03C4\u03AE\u03C3\u03B5\u03B9\u03C2 \u03B1\u03C3\u03C6\u03B1\u03BB\u03B5\u03AF\u03B1\u03C2 \u03C3\u03B1\u03C2 \u03BC\u03B5 \u03B1\u03C3\u03C6\u03AC\u03BB\u03B5\u03B9\u03B1. \u03A3\u03C4\u03BF \u03B5\u03BE\u03AE\u03C2, \u03BC\u03B7\u03BD \u03C0\u03BB\u03B7\u03BA\u03C4\u03C1\u03BF\u03BB\u03BF\u03B3\u03B5\u03AF\u03C4\u03B5 \u03C0\u03BF\u03C4\u03AD \u03C4\u03B9\u03C2 \u03B1\u03C0\u03B1\u03BD\u03C4\u03AE\u03C3\u03B5\u03B9\u03C2 \u03C3\u03B1\u03C2 \u03B7\u03BB\u03B5\u03BA\u03C4\u03C1\u03BF\u03BD\u03B9\u03BA\u03AC \u03B5\u03BA\u03C4\u03CC\u03C2 \u03B1\u03BD \u03B5\u03BC\u03C6\u03B1\u03BD\u03B9\u03C3\u03C4\u03B5\u03AF \u03C4\u03BF \u03C0\u03C1\u03BF\u03C3\u03B1\u03C1\u03BC\u03BF\u03C3\u03BC\u03AD\u03BD\u03BF \u03C3\u03B1\u03C2 QuestionPad. \u0394\u03B5\u03BD \u03B8\u03B1 \u03B1\u03BB\u03BB\u03AC\u03BE\u03BF\u03C5\u03BC\u03B5 \u03C0\u03BF\u03C4\u03AD \u03C4\u03B7\u03BD \u03C0\u03C1\u03BF\u03C3\u03C9\u03C0\u03B9\u03BA\u03AE \u03C3\u03B1\u03C2 \u03C0\u03C1\u03BF\u03C3\u03B1\u03C1\u03BC\u03BF\u03B3\u03AE \u03C7\u03C9\u03C1\u03AF\u03C2 \u03BD\u03B1 \u03C4\u03BF \u03B3\u03BD\u03C9\u03C1\u03AF\u03B6\u03B5\u03C4\u03B5.

bharosa.uio.default.whatsthis.DeviceQuestionPad.about.question2=\u0393\u03B9\u03B1\u03C4\u03AF \u03C0\u03C1\u03B1\u03B3\u03BC\u03B1\u03C4\u03BF\u03C0\u03BF\u03B9\u03B5\u03AF\u03C4\u03B1\u03B9 \u03B1\u03BB\u03BB\u03B1\u03B3\u03AE;
bharosa.uio.default.whatsthis.DeviceQuestionPad.about.answer2=\u0391\u03BD\u03B1\u03B6\u03B7\u03C4\u03BF\u03CD\u03BC\u03B5 \u03C0\u03AC\u03BD\u03C4\u03B1 \u03C4\u03C1\u03CC\u03C0\u03BF\u03C5\u03C2 \u03B3\u03B9\u03B1 \u03B1\u03C3\u03C6\u03B1\u03BB\u03AD\u03C3\u03C4\u03B5\u03C1\u03B7 \u03B7\u03BB\u03B5\u03BA\u03C4\u03C1\u03BF\u03BD\u03B9\u03BA\u03AE \u03B5\u03BC\u03C0\u03B5\u03B9\u03C1\u03AF\u03B1. \u03A4\u03BF QuestionPad \u03B1\u03C0\u03BF\u03C4\u03B5\u03BB\u03B5\u03AF \u03AD\u03BD\u03B1 \u03B1\u03C0\u03CC \u03C4\u03B1 \u03C0\u03BF\u03BB\u03BB\u03AC \u03BC\u03AD\u03C4\u03C1\u03B1 \u03C0\u03BF\u03C5 \u03BB\u03B1\u03BC\u03B2\u03AC\u03BD\u03BF\u03C5\u03BC\u03B5 \u03B3\u03B9\u03B1 \u03C4\u03B7 \u03B2\u03B5\u03BB\u03C4\u03AF\u03C9\u03C3\u03B7 \u03C4\u03B7\u03C2 \u03B1\u03C3\u03C6\u03AC\u03BB\u03B5\u03B9\u03AC\u03C2 \u03C3\u03B1\u03C2 \u03CC\u03C4\u03B1\u03BD \u03B2\u03C1\u03AF\u03C3\u03BA\u03B5\u03C3\u03C4\u03B5 \u03C4\u03B7\u03BD \u03C4\u03BF\u03C0\u03BF\u03B8\u03B5\u03C3\u03AF\u03B1 \u03BC\u03B1\u03C2.

bharosa.uio.default.whatsthis.DeviceQuestionPad.about.question3=\u03A0\u03BF\u03B9\u03B1 \u03B5\u03AF\u03BD\u03B1\u03B9 \u03B7 \u03C7\u03C1\u03AE\u03C3\u03B7 \u03C4\u03B7\u03C2 \u03B7\u03BC\u03B5\u03C1\u03BF\u03BC\u03B7\u03BD\u03AF\u03B1\u03C2 \u03B1\u03BD\u03B1\u03BD\u03AD\u03C9\u03C3\u03B7\u03C2;
bharosa.uio.default.whatsthis.DeviceQuestionPad.about.answer3=\u039A\u03AC\u03B8\u03B5 \u03C6\u03BF\u03C1\u03AC \u03C3\u03B1\u03C2 \u03C0\u03B1\u03C1\u03BF\u03C5\u03C3\u03B9\u03AC\u03B6\u03BF\u03C5\u03BC\u03B5 \u03AD\u03BD\u03B1 QuestionPad \u03BC\u03B5 \u03BD\u03AD\u03B1 \u03CE\u03C1\u03B1 \u03BA\u03B1\u03B9 \u03B7\u03BC\u03B5\u03C1\u03BF\u03BC\u03B7\u03BD\u03AF\u03B1. \u0391\u03C5\u03C4\u03CC \u03B1\u03C0\u03BF\u03C4\u03B5\u03BB\u03B5\u03AF \u03AC\u03BB\u03BB\u03B7 \u03BC\u03B9\u03B1 \u03BB\u03B5\u03B9\u03C4\u03BF\u03C5\u03C1\u03B3\u03AF\u03B1 \u03B1\u03C3\u03C6\u03B1\u03BB\u03B5\u03AF\u03B1\u03C2 \u03B3\u03B9\u03B1 \u03C4\u03B7 \u03B4\u03B9\u03B1\u03C3\u03C6\u03AC\u03BB\u03B9\u03C3\u03B7 \u03C4\u03B7\u03C2 \u03B7\u03BB\u03B5\u03BA\u03C4\u03C1\u03BF\u03BD\u03B9\u03BA\u03AE\u03C2 \u03C3\u03B1\u03C2 \u03B1\u03C3\u03C6\u03AC\u03BB\u03B5\u03B9\u03B1\u03C2. \u03A0\u03C1\u03B9\u03BD \u03C0\u03BB\u03B7\u03BA\u03C4\u03C1\u03BF\u03BB\u03BF\u03B3\u03AE\u03C3\u03B5\u03C4\u03B5 \u03C4\u03B7\u03BD \u03B1\u03C0\u03AC\u03BD\u03C4\u03B7\u03C3\u03AE \u03C3\u03B1\u03C2, \u03B2\u03B5\u03B2\u03B1\u03B9\u03C9\u03B8\u03B5\u03AF\u03C4\u03B5 \u03CC\u03C4\u03B9 \u03B7 \u03CE\u03C1\u03B1 \u03BA\u03B1\u03B9 \u03B7\u03BC\u03B5\u03C1\u03BF\u03BC\u03B7\u03BD\u03AF\u03B1 \u03B4\u03B5\u03BD \u03C5\u03C0\u03B5\u03C1\u03B2\u03B1\u03AF\u03BD\u03BF\u03C5\u03BD \u03C4\u03B9\u03C2 24 \u03CE\u03C1\u03B5\u03C2.

